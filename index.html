<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contabilità Personale · Partita Doppia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>

  :root {
    --bg: #f7f6f2;
    --panel: #ffffff;
    --panel-2: #fbfaf6;
    --ink: #1a1a1a;
    --ink-2: #4a4a4a;
    --ink-3: #8a8a82;
    --rule: #e8e6df;
    --rule-2: #d8d5cc;
    --accent: #2d5e3e;       /* verde campo, sobrio */
    --accent-soft: #e8efe9;
    --accent-ink: #1a3d27;
    --gold: #b8954b;
    --danger: #b54343;
    --danger-soft: #fbecec;
    --success: #2d5e3e;
    --warn: #c08020;
    --shadow-sm: 0 1px 2px rgba(20,20,20,0.04), 0 0 0 1px rgba(20,20,20,0.04);
    --shadow-md: 0 4px 16px rgba(20,20,20,0.06), 0 0 0 1px rgba(20,20,20,0.04);
    --shadow-lg: 0 20px 50px rgba(20,20,20,0.12);
    --radius: 6px;
    --radius-lg: 10px;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--ink);
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }

  .serif { font-family: 'Fraunces', Georgia, serif; }
  .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }

  button { font-family: inherit; cursor: pointer; }
  input, select, textarea { font-family: inherit; font-size: inherit; }

  /* === LAYOUT === */
  .app { min-height: 100vh; display: flex; flex-direction: column; }

  .topbar {
    background: var(--ink);
    color: #f0eee7;
    padding: 14px 28px;
    display: flex;
    align-items: center;
    gap: 24px;
    border-bottom: 1px solid #000;
  }
  .topbar h1 {
    font-family: 'Fraunces', serif;
    font-size: 18px;
    font-weight: 500;
    margin: 0;
    letter-spacing: -0.01em;
    flex: 1;
  }
  .topbar h1 .sub {
    color: #a8a59a;
    margin-left: 12px;
    font-size: 13px;
    font-style: italic;
  }
  .topbar .badge {
    background: #2d2d2d;
    border: 1px solid #3a3a3a;
    padding: 4px 10px;
    border-radius: 4px;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: #c9c7be;
  }
  .topbar select {
    background: #2d2d2d;
    color: #f0eee7;
    border: 1px solid #3a3a3a;
    padding: 5px 10px;
    border-radius: 4px;
    font-size: 12px;
    cursor: pointer;
  }
  .topbar select:hover { border-color: #555; }
  .topbar button.icon-btn {
    background: transparent;
    color: #c9c7be;
    border: 1px solid #3a3a3a;
    padding: 5px 10px;
    border-radius: 4px;
    font-size: 12px;
  }
  .topbar button.icon-btn:hover { background: #2d2d2d; }

  .layout {
    display: flex;
    flex: 1;
    min-height: 0;
  }
  .sidebar {
    width: 220px;
    background: var(--panel);
    border-right: 1px solid var(--rule);
    padding: 24px 12px;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .sidebar .section-label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--ink-3);
    margin: 18px 14px 6px;
    font-weight: 600;
  }
  .sidebar .section-label:first-child { margin-top: 0; }
  .navlink {
    background: transparent;
    border: none;
    text-align: left;
    padding: 8px 14px;
    border-radius: 4px;
    color: var(--ink-2);
    font-size: 13.5px;
    font-weight: 500;
    display: flex;
    align-items: center;
    gap: 10px;
    transition: background 0.12s;
  }
  .navlink:hover { background: var(--bg); color: var(--ink); }
  .navlink.active {
    background: var(--ink);
    color: #f0eee7;
  }
  .navlink .ico {
    font-size: 14px;
    width: 16px;
    text-align: center;
    opacity: 0.7;
  }
  .navlink.active .ico { opacity: 1; }

  .main {
    flex: 1;
    min-width: 0;
    padding: 32px 36px;
    overflow-y: auto;
  }

  .page-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 24px;
    margin-bottom: 28px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--rule);
  }
  .page-head h2 {
    font-family: 'Fraunces', serif;
    font-size: 28px;
    font-weight: 500;
    margin: 0;
    letter-spacing: -0.02em;
  }
  .page-head .sub {
    color: var(--ink-3);
    font-size: 13px;
  }

  /* === BUTTONS === */
  .btn {
    background: var(--ink);
    color: #f0eee7;
    border: 1px solid var(--ink);
    padding: 8px 16px;
    border-radius: var(--radius);
    font-size: 13px;
    font-weight: 500;
    transition: all 0.12s;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .btn:hover { background: #000; }
  .btn.ghost {
    background: transparent;
    color: var(--ink);
    border: 1px solid var(--rule-2);
  }
  .btn.ghost:hover { background: var(--bg); border-color: var(--ink-3); }
  .btn.accent {
    background: var(--accent);
    border-color: var(--accent);
  }
  .btn.accent:hover { background: var(--accent-ink); }
  .btn.danger {
    background: transparent;
    color: var(--danger);
    border: 1px solid var(--rule-2);
  }
  .btn.danger:hover { background: var(--danger-soft); border-color: var(--danger); }
  .btn.sm { padding: 5px 10px; font-size: 12px; }

  /* === CARDS === */
  .card {
    background: var(--panel);
    border: 1px solid var(--rule);
    border-radius: var(--radius-lg);
    padding: 20px;
  }
  .card.flat { box-shadow: var(--shadow-sm); }
  .card .card-title {
    font-family: 'Fraunces', serif;
    font-size: 16px;
    font-weight: 500;
    margin: 0 0 14px;
  }

  /* === KPI === */
  .kpi-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
    gap: 14px;
    margin-bottom: 24px;
  }
  .kpi {
    background: var(--panel);
    border: 1px solid var(--rule);
    border-radius: var(--radius-lg);
    padding: 18px 20px;
    position: relative;
    overflow: hidden;
  }
  .kpi.accent { background: var(--ink); color: #f0eee7; border-color: var(--ink); }
  .kpi .label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--ink-3);
    margin-bottom: 8px;
    font-weight: 600;
  }
  .kpi.accent .label { color: #a8a59a; }
  .kpi .value {
    font-family: 'Fraunces', serif;
    font-size: 28px;
    font-weight: 500;
    letter-spacing: -0.02em;
    line-height: 1.1;
  }
  .kpi .value.neg { color: var(--danger); }
  .kpi .hint {
    margin-top: 4px;
    font-size: 11.5px;
    color: var(--ink-3);
  }

  /* === TABLE === */
  .tbl-wrap {
    background: var(--panel);
    border: 1px solid var(--rule);
    border-radius: var(--radius-lg);
    overflow: hidden;
  }
  table.tbl {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  table.tbl th {
    text-align: left;
    padding: 11px 14px;
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--ink-3);
    font-weight: 600;
    background: var(--panel-2);
    border-bottom: 1px solid var(--rule);
    position: sticky;
    top: 0;
  }
  table.tbl td {
    padding: 10px 14px;
    border-bottom: 1px solid var(--rule);
    vertical-align: top;
  }
  table.tbl tr:last-child td { border-bottom: none; }
  table.tbl tr:hover td { background: var(--panel-2); }
  table.tbl td.num, table.tbl th.num { text-align: right; font-variant-numeric: tabular-nums; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12.5px; }
  table.tbl td.neg { color: var(--danger); }
  table.tbl td.pos { color: var(--success); }
  table.tbl .pill {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 99px;
    font-size: 11px;
    font-weight: 500;
    background: var(--bg);
    border: 1px solid var(--rule);
    color: var(--ink-2);
  }
  table.tbl .pill.entrata { background: var(--accent-soft); border-color: #c8d8ce; color: var(--accent-ink); }
  table.tbl .pill.uscita { background: var(--danger-soft); border-color: #f1d6d6; color: var(--danger); }
  table.tbl .pill.giroconto { background: #f4ebd7; border-color: #e6d5a8; color: #7a5a1d; }

  .empty-state {
    padding: 40px;
    text-align: center;
    color: var(--ink-3);
    font-style: italic;
  }

  /* === FORM === */
  .form-grid {
    display: grid;
    gap: 14px;
  }
  .form-row {
    display: grid;
    grid-template-columns: 180px 1fr;
    align-items: center;
    gap: 16px;
  }
  .form-row label {
    font-size: 12.5px;
    color: var(--ink-2);
    font-weight: 500;
  }
  .form-row .req { color: var(--danger); }
  input[type=text], input[type=number], input[type=date], input[type=password], select, textarea {
    width: 100%;
    padding: 8px 11px;
    border: 1px solid var(--rule-2);
    border-radius: var(--radius);
    background: var(--panel);
    color: var(--ink);
    transition: border 0.12s;
  }
  input:focus, select:focus, textarea:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }
  textarea { resize: vertical; min-height: 60px; }

  .tipo-switch {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 0;
    border: 1px solid var(--rule-2);
    border-radius: var(--radius);
    overflow: hidden;
  }
  .tipo-switch button {
    background: var(--panel);
    color: var(--ink-2);
    border: none;
    border-right: 1px solid var(--rule);
    padding: 10px 12px;
    font-size: 13px;
    font-weight: 500;
    transition: all 0.12s;
  }
  .tipo-switch button:last-child { border-right: none; }
  .tipo-switch button:hover { background: var(--bg); }
  .tipo-switch button.active.entrata { background: var(--accent); color: #fff; }
  .tipo-switch button.active.uscita { background: var(--danger); color: #fff; }
  .tipo-switch button.active.giroconto { background: var(--gold); color: #fff; }

  /* === FILTERS === */
  .filters {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 16px;
    align-items: center;
  }
  .filters input, .filters select {
    padding: 6px 10px;
    font-size: 12.5px;
    max-width: 200px;
  }
  .filters .label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--ink-3);
    font-weight: 600;
  }

  /* === LOGIN === */
  .login-shell {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background:
      radial-gradient(at 20% 30%, var(--accent-soft) 0px, transparent 50%),
      radial-gradient(at 80% 70%, #f4ebd7 0px, transparent 50%),
      var(--bg);
    padding: 24px;
  }
  .login-card {
    background: var(--panel);
    border: 1px solid var(--rule);
    border-radius: 14px;
    padding: 40px 44px;
    max-width: 420px;
    width: 100%;
    box-shadow: var(--shadow-lg);
  }
  .login-card .logo {
    font-family: 'Fraunces', serif;
    font-size: 22px;
    font-weight: 500;
    margin: 0 0 4px;
    letter-spacing: -0.01em;
  }
  .login-card .tag {
    color: var(--ink-3);
    font-size: 12.5px;
    margin-bottom: 28px;
    font-style: italic;
  }
  .login-card .field { margin-bottom: 14px; }
  .login-card .field label {
    display: block;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--ink-3);
    margin-bottom: 5px;
    font-weight: 600;
  }
  .login-card .err {
    color: var(--danger);
    background: var(--danger-soft);
    padding: 8px 12px;
    border-radius: var(--radius);
    font-size: 12.5px;
    margin-bottom: 12px;
  }
  .login-card .btn { width: 100%; justify-content: center; padding: 11px; }

  /* === MODAL === */
  .modal-bg {
    position: fixed;
    inset: 0;
    background: rgba(20,20,20,0.4);
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .modal {
    background: var(--panel);
    border-radius: var(--radius-lg);
    max-width: 640px;
    width: 100%;
    max-height: 90vh;
    overflow-y: auto;
    box-shadow: var(--shadow-lg);
  }
  .modal-head {
    padding: 18px 24px;
    border-bottom: 1px solid var(--rule);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .modal-head h3 {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    margin: 0;
    font-size: 18px;
  }
  .modal-body { padding: 22px 24px; }
  .modal-foot {
    padding: 14px 24px;
    border-top: 1px solid var(--rule);
    display: flex;
    justify-content: flex-end;
    gap: 8px;
  }

  /* === TOAST === */
  .toast {
    position: fixed;
    bottom: 24px;
    right: 24px;
    padding: 12px 18px;
    background: var(--ink);
    color: #f0eee7;
    border-radius: var(--radius);
    font-size: 13px;
    box-shadow: var(--shadow-lg);
    z-index: 200;
    animation: slideUp 0.2s ease-out;
  }
  .toast.success { background: var(--accent); }
  .toast.error { background: var(--danger); }
  @keyframes slideUp {
    from { transform: translateY(20px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }

  /* === LIQUIDITY BARS === */
  .liq-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 14px;
  }
  .liq-card {
    background: var(--panel);
    border: 1px solid var(--rule);
    border-radius: var(--radius-lg);
    padding: 18px 20px;
  }
  .liq-card .head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 10px;
  }
  .liq-card .name {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--ink-3);
    font-weight: 600;
  }
  .liq-card .saldo {
    font-family: 'Fraunces', serif;
    font-size: 24px;
    font-weight: 500;
    letter-spacing: -0.02em;
  }
  .liq-card .saldo.neg { color: var(--danger); }
  .liq-card .delta {
    font-size: 11px;
    color: var(--ink-3);
    margin-top: 4px;
    font-variant-numeric: tabular-nums;
  }
  .liq-card .delta .pos { color: var(--success); }
  .liq-card .delta .neg { color: var(--danger); }

  /* === SCROLLBARS === */
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--rule-2); border-radius: 5px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--ink-3); }

  /* === MOBILE: bottone menu hamburger === */
  .menu-btn {
    display: none;
    background: transparent;
    color: #f0eee7;
    border: 1px solid #3a3a3a;
    width: 36px;
    height: 36px;
    border-radius: 6px;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    padding: 0;
  }
  .menu-btn:hover { background: #2d2d2d; }
  .sidebar-backdrop {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(20,20,20,0.4);
    z-index: 90;
    animation: fadeIn 0.15s ease-out;
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  /* === RESPONSIVE: mobile === */
  @media (max-width: 768px) {
    body { font-size: 14px; }

    .topbar {
      padding: 10px 14px;
      gap: 10px;
      flex-wrap: nowrap;
    }
    .topbar h1 {
      font-size: 15px;
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .topbar h1 .sub { display: none; }
    .topbar .badge { display: none; }
    .topbar select {
      font-size: 13px;
      padding: 6px 8px;
      max-width: 110px;
    }
    .topbar button.icon-btn {
      font-size: 11px;
      padding: 5px 8px;
    }
    .topbar .desktop-only { display: none; }
    .menu-btn { display: inline-flex; }

    /* Sidebar diventa drawer */
    .layout { flex-direction: column; }
    .sidebar {
      position: fixed;
      top: 0; left: 0; bottom: 0;
      width: 75%;
      max-width: 280px;
      z-index: 100;
      flex-direction: column;
      flex-wrap: nowrap;
      padding: 20px 14px;
      overflow-y: auto;
      transform: translateX(-100%);
      transition: transform 0.22s ease-out;
      box-shadow: 0 0 30px rgba(0,0,0,0.15);
    }
    .sidebar.open { transform: translateX(0); }
    .sidebar.open ~ .sidebar-backdrop { display: block; }
    .sidebar .section-label { display: block; margin-top: 14px; }
    .sidebar .section-label:first-child { margin-top: 0; }
    .navlink {
      padding: 10px 14px;
      font-size: 14px;
    }

    /* Main */
    .main {
      padding: 14px;
      width: 100%;
    }

    /* Page head */
    .page-head {
      flex-direction: column;
      align-items: stretch;
      gap: 12px;
      margin-bottom: 18px;
    }
    .page-head h2 { font-size: 22px; }
    .page-head .sub { font-size: 12px; }

    /* KPI grid: 2 colonne su mobile */
    .kpi-grid {
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 16px;
    }
    .kpi {
      padding: 12px 14px;
    }
    .kpi .label { font-size: 9.5px; margin-bottom: 4px; }
    .kpi .value { font-size: 20px; }
    .kpi .hint { font-size: 10.5px; }

    /* Liquidità grid: 2 colonne */
    .liq-grid {
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }
    .liq-card { padding: 12px 14px; }
    .liq-card .saldo { font-size: 18px; }
    .liq-card .name { font-size: 10px; }
    .liq-card .delta { font-size: 10px; }

    /* Form: una colonna, label sopra */
    .form-row {
      grid-template-columns: 1fr;
      gap: 6px;
    }
    .form-row label { font-size: 12px; font-weight: 600; color: var(--ink); }
    input, select, textarea {
      font-size: 16px !important;  /* iOS no-zoom su focus */
      padding: 10px 12px;
    }

    /* Tipo switch */
    .tipo-switch button { font-size: 12px; padding: 9px 6px; }

    /* Filtri: full-width stack */
    .filters {
      gap: 8px;
    }
    .filters input, .filters select {
      max-width: none;
      width: 100%;
      font-size: 13.5px !important;
    }
    .filters .label { width: 100%; margin-bottom: -4px; }

    /* Tabelle: scroll fluido, font più compatto */
    .tbl-wrap {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      border-radius: 8px;
    }
    table.tbl { font-size: 12px; min-width: 600px; }
    table.tbl th { padding: 8px 10px; font-size: 9.5px; }
    table.tbl td { padding: 8px 10px; }
    table.tbl td.num, table.tbl th.num { font-size: 11.5px; }

    /* Modal: quasi fullscreen su mobile */

/* ============================================================
   CALCOLI CONTABILI
   ============================================================ */
function calcSaldi(scritture){
  // saldo per conto: {dare, avere, saldo=dare-avere}
  const m = {};
  CONTI.forEach(c=>{ m[c.codice]={dare:0,avere:0}; });
  scritture.forEach(s=> s.righe.forEach(r=>{
    if(!m[r.c]) m[r.c]={dare:0,avere:0};
    m[r.c].dare += (r.d||0); m[r.c].avere += (r.a||0);
  }));
  Object.keys(m).forEach(k=>{ m[k].dare=r2(m[k].dare); m[k].avere=r2(m[k].avere); m[k].saldo=r2(m[k].dare-m[k].avere); });
  return m;
}
function saldoRealeConto(cod){
  const ini = SALDI_INIZIALI[cod] || 0;
  let e=0,u=0;
  MOVIMENTI.forEach(mv=>{ if(mv.cod===cod){ if(mv.tipo==='E') e+=mv.imp; else u+=mv.imp; } });
  return r2(ini + e - u);
}

  const disallineato = liq.some(x=>Math.abs(x.diff)>0.01);

  // sintesi patrimoniale / economica
  const sumCat = (cats, side) => r2(CONTI.filter(c=>cats.includes(c.categoria)).reduce((s,c)=>{
    const v=saldi[c.codice]||{dare:0,avere:0};
    return s + (side==='saldo'? (v.dare-v.avere) : side==='avere'?(v.avere-v.dare):(v.dare-v.avere));
  },0));
  const immMat = sumCat(['IMM. MATERIALI'],'saldo');
  const immFin = sumCat(['IMM. FINANZIARIE'],'saldo');
  const fondi = -sumCat(['RETTIFICA ATTIVO'],'saldo'); // saldo avere => negativo, lo rendo positivo
  const ricavi = r2(CONTI.filter(c=>c.categoria==='RICAVI').reduce((s,c)=>{const v=saldi[c.codice]||{dare:0,avere:0};return s+(v.avere-v.dare);},0));
  const costi = r2(CONTI.filter(c=>c.categoria==='COSTI').reduce((s,c)=>{const v=saldi[c.codice]||{dare:0,avere:0};return s+(v.dare-v.avere);},0));
  const risultato = r2(ricavi-costi);
  const pn = r2(CONTI.filter(c=>c.categoria==='PATRIMONIO NETTO').reduce((s,c)=>{const v=saldi[c.codice]||{dare:0,avere:0};return s+(v.avere-v.dare);},0));

  // flusso mensile (da movimenti reali)
  const mesiUsati = MESI_ORD.filter(m=>MOVIMENTI.some(x=>x.mese===m));
  const flusso = mesiUsati.map(m=>{
    const e=r2(MOVIMENTI.filter(x=>x.mese===m&&x.tipo==='E').reduce((s,x)=>s+x.imp,0));
    const u=r2(MOVIMENTI.filter(x=>x.mese===m&&x.tipo==='U').reduce((s,x)=>s+x.imp,0));
    return {m,e,u,delta:r2(e-u)};
  });
  const chartRef = useRef(null);
  useEffect(()=>{
    if(!chartRef.current || !window.Chart) return;
    const ctx = chartRef.current.getContext('2d');
    const ch = new Chart(ctx,{type:'bar',data:{labels:flusso.map(f=>f.m),datasets:[
      {label:'Entrate',data:flusso.map(f=>f.e),backgroundColor:'#2d5e3e'},
      {label:'Uscite',data:flusso.map(f=>f.u),backgroundColor:'#b54343'},
    ]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom'}},scales:{y:{ticks:{callback:v=>num2(v)}}}}});
    return ()=>ch.destroy();
  },[scritture]);

  return (
    <div>
      <PageHead title="Dashboard" sub="Disponibilità reali e sintesi di bilancio">
        <button className="btn accent" onClick={()=>goto('nuova')}>+ Nuova scrittura</button>
      </PageHead>

      {disallineato &&
        <div className="card" style={{borderColor:'#e6d5a8',background:'#fbf6e8',marginBottom:20,cursor:'pointer'}} onClick={()=>goto('movimenti')}>
          <strong style={{color:'#7a5a1d'}}>⚠ Disallineamento contabilità ↔ movimenti reali.</strong>
          <span style={{color:'var(--ink-2)',marginLeft:8}}>I saldi di libro giornale non coincidono con i movimenti di cassa. Vai a “Movimenti & Riconciliazione” per il dettaglio.</span>
        </div>}

      <div className="kpi-grid">
        <Kpi accent label="Disponibilità liquide (contabili)" value={eur(totLiqContabile)} hint={`Saldo reale movimenti: ${eur(totLiqReale)}`}/>
        <Kpi label="Immobilizzazioni nette" value={eur(r2(immMat+immFin-fondi))} hint={`Materiali ${eur(immMat)} · Finanziarie ${eur(immFin)} · F.do ${eur(fondi)}`}/>
        <Kpi label="Patrimonio netto" value={eur(pn)}/>
        <Kpi label="Risultato d'esercizio" value={eur(risultato)} neg={risultato<0} hint={`Ricavi ${eur(ricavi)} · Costi ${eur(costi)}`}/>
      </div>

      <div className="card-title serif" style={{fontSize:16,margin:'4px 0 12px'}}>Disponibilità per conto</div>
      <div className="liq-grid" style={{marginBottom:28}}>
        {liq.map(x=>(
          <div className="liq-card" key={x.cod}>
            <div className="head">
              <span className="name">{x.nome}</span>
            </div>
            <div className={'saldo'+(x.contabile<0?' neg':'')}>{eur(x.contabile)}</div>
            <div className="delta">
              reale {eur(x.reale)} · diff <span className={Math.abs(x.diff)<0.01?'':(x.diff<0?'neg':'pos')}>{x.diff>0?'+':''}{num2(x.diff)} €</span>
            </div>
          </div>
        ))}
      </div>

      <div className="card flat">
        <div className="card-title">Flusso di cassa mensile (movimenti reali)</div>
        <div style={{height:260}}><canvas ref={chartRef}></canvas></div>
      </div>
    </div>
  );
}

/* ============================================================
   PAGINA: NUOVA SCRITTURA
   ============================================================ */
function ContoSelect({value,onChange,filter}){
  const list = filter ? CONTI.filter(filter) : CONTI;
  return (
    <select value={value} onChange={e=>onChange(e.target.value?parseInt(e.target.value):'')}>
      <option value="">— seleziona conto —</option>
      {list.map(c=><option key={c.codice} value={c.codice}>{c.codice} · {c.nome}</option>)}
    </select>
  );
}

function PageNuova({onAdd, toast}){
  const [mode,setMode] = useState('liquidita'); // liquidita | contabile
  const [data,setData] = useState(todayISO());
  const [descr,setDescr] = useState('');
  // modalità liquidità: verso = E entrata | U uscita | G giroconto
  const [verso,setVerso] = useState('U');
  const [contoLiq,setContoLiq] = useState(1);     // conto liquidità (E/U) o conto DA (G)
  const [contoLiqA,setContoLiqA] = useState(3);   // conto AL (solo giroconto)
  const [contropartita,setContropartita] = useState('');
  const [importo,setImporto] = useState('');
  // modalità contabile libera
  const [righe,setRighe] = useState([{c:'',d:'',a:''},{c:'',d:'',a:''}]);

  const setRiga=(i,k,v)=>setRighe(rs=>rs.map((r,j)=>j===i?{...r,[k]:v}:r));
  const addRiga=()=>setRighe(rs=>[...rs,{c:'',d:'',a:''}]);
  const delRiga=i=>setRighe(rs=>rs.filter((_,j)=>j!==i));

  const totD = mode==='contabile' ? r2(righe.reduce((s,r)=>s+(parseFloat(r.d)||0),0)) : 0;
  const totA = mode==='contabile' ? r2(righe.reduce((s,r)=>s+(parseFloat(r.a)||0),0)) : 0;
  const quadra = Math.abs(totD-totA)<0.005 && totD>0;

  function submit(){
    if(!data){ toast('Inserisci la data','error'); return; }
    let nuove=[], tipo=mode;
    if(mode==='liquidita'){
      const imp = parseFloat(importo);
      if(!imp||imp<=0){ toast('Importo non valido','error'); return; }
      if(verso==='G'){
        if(contoLiq===contoLiqA){ toast('I due conti devono essere diversi','error'); return; }
        nuove=[{c:contoLiqA,d:imp,a:0},{c:contoLiq,d:0,a:imp}]; tipo='giroconto';
      } else {
        if(!contropartita){ toast('Seleziona la contropartita','error'); return; }
        if(verso==='E') nuove=[{c:contoLiq,d:imp,a:0},{c:contropartita,d:0,a:imp}];
        else            nuove=[{c:contropartita,d:imp,a:0},{c:contoLiq,d:0,a:imp}];
      }
    } else {
      if(!quadra){ toast('La scrittura non quadra (Dare ≠ Avere)','error'); return; }
      nuove = righe.filter(r=>r.c&&((parseFloat(r.d)||0)>0||(parseFloat(r.a)||0)>0))
                   .map(r=>({c:parseInt(r.c),d:r2(parseFloat(r.d)||0),a:r2(parseFloat(r.a)||0)}));
      if(nuove.length<2){ toast('Servono almeno due righe valide','error'); return; }
    }
    const defDescr = verso==='G' ? `Giroconto ${contoByCode[contoLiq].nome} → ${contoByCode[contoLiqA].nome}` : '(senza descrizione)';
    onAdd({id:uid(),data,descr:descr||defDescr,righe:nuove,origine:'manuale',tipo});
    toast(verso==='G'?'Giroconto registrato':'Scrittura registrata','success');
    setDescr(''); setImporto(''); setContropartita('');
    setRighe([{c:'',d:'',a:''},{c:'',d:'',a:''}]);
  }

  return (
    <div>
      <PageHead title="Nuova scrittura" sub="Registrazione in partita doppia"/>
      <div className="card" style={{maxWidth:760}}>
        <div className="tipo-switch" style={{gridTemplateColumns:'1fr 1fr',marginBottom:20}}>
          <button className={mode==='liquidita'?'active entrata':''} onClick={()=>setMode('liquidita')}>Con liquidità</button>
          <button className={mode==='contabile'?'active giroconto':''} onClick={()=>setMode('contabile')}>Contabile (libera)</button>
        </div>

        <div className="form-grid">
          {mode==='liquidita' && <>
            <div className="form-row"><label>Tipo movimento</label>
              <div className="tipo-switch" style={{gridTemplateColumns:'1fr 1fr 1fr'}}>
                <button className={verso==='E'?'active entrata':''} onClick={()=>setVerso('E')}>Entrata</button>
                <button className={verso==='U'?'active uscita':''} onClick={()=>setVerso('U')}>Uscita</button>
                <button className={verso==='G'?'active giroconto':''} onClick={()=>setVerso('G')}>Giroconto</button>
              </div>
            </div>
          </>}

          <div className="form-row"><label>Data <span className="req">*</span></label><input type="date" value={data} onChange={e=>setData(e.target.value)}/></div>
          <div className="form-row"><label>Descrizione</label><input type="text" value={descr} onChange={e=>setDescr(e.target.value)} placeholder="Es. Stipendio, spesa supermercato…"/></div>

          {mode==='liquidita' && verso!=='G' && <>
            <div className="form-row"><label>Conto liquidità <span className="req">*</span></label>
              <ContoSelect value={contoLiq} onChange={setContoLiq} filter={c=>c.categoria==='DISP. LIQUIDE'}/>
            </div>
            <div className="form-row"><label>Contropartita <span className="req">*</span></label>
              <ContoSelect value={contropartita} onChange={setContropartita} filter={c=>c.categoria!=='DISP. LIQUIDE'}/>
            </div>
            <div className="form-row"><label>Importo <span className="req">*</span></label><input type="number" step="0.01" value={importo} onChange={e=>setImporto(e.target.value)} placeholder="0,00"/></div>
            <div style={{background:'var(--panel-2)',borderRadius:6,padding:'12px 14px',fontSize:12.5,color:'var(--ink-2)'}}>
              {verso==='E'
                ? <>Dare <b>{contoByCode[contoLiq]?.nome}</b> · Avere <b>{contropartita?contoByCode[contropartita]?.nome:'…'}</b></>
                : <>Dare <b>{contropartita?contoByCode[contropartita]?.nome:'…'}</b> · Avere <b>{contoByCode[contoLiq]?.nome}</b></>}
            </div>
          </>}

          {mode==='liquidita' && verso==='G' && <>
            <div className="form-row"><label>Dal conto <span className="req">*</span></label>
              <ContoSelect value={contoLiq} onChange={setContoLiq} filter={c=>c.categoria==='DISP. LIQUIDE'}/>
            </div>
            <div className="form-row"><label>Al conto <span className="req">*</span></label>
              <ContoSelect value={contoLiqA} onChange={setContoLiqA} filter={c=>c.categoria==='DISP. LIQUIDE'}/>
            </div>
            <div className="form-row"><label>Importo <span className="req">*</span></label><input type="number" step="0.01" value={importo} onChange={e=>setImporto(e.target.value)} placeholder="0,00"/></div>
            <div style={{background:'var(--panel-2)',borderRadius:6,padding:'12px 14px',fontSize:12.5,color:'var(--ink-2)'}}>
              Dare <b>{contoByCode[contoLiqA]?.nome}</b> · Avere <b>{contoByCode[contoLiq]?.nome}</b>
            </div>
          </>}

          {mode==='contabile' && <>
            <div className="tbl-wrap">
              <table className="tbl">
                <thead><tr><th>Conto</th><th className="num">Dare</th><th className="num">Avere</th><th></th></tr></thead>
                <tbody>
                  {righe.map((r,i)=>(
                    <tr key={i}>
                      <td><ContoSelect value={r.c} onChange={v=>setRiga(i,'c',v)}/></td>
                      <td className="num"><input type="number" step="0.01" value={r.d} onChange={e=>setRiga(i,'d',e.target.value)} style={{textAlign:'right'}}/></td>
                      <td className="num"><input type="number" step="0.01" value={r.a} onChange={e=>setRiga(i,'a',e.target.value)} style={{textAlign:'right'}}/></td>
                      <td><button className="btn ghost sm" onClick={()=>delRiga(i)} disabled={righe.length<=2}>✕</button></td>
                    </tr>
                  ))}
                </tbody>
                <tfoot><tr>
                  <td style={{fontWeight:600}}>Totali</td>
                  <td className="num" style={{fontWeight:600}}>{num2(totD)}</td>
                  <td className="num" style={{fontWeight:600}}>{num2(totA)}</td>
                  <td className="num" style={{color:quadra?'var(--success)':'var(--danger)',fontWeight:600}}>{quadra?'✓':'≠'}</td>
                </tr></tfoot>
              </table>
            </div>
            <button className="btn ghost sm" onClick={addRiga} style={{alignSelf:'flex-start'}}>+ Aggiungi riga</button>
          </>}

          <div style={{display:'flex',justifyContent:'flex-end',gap:8,marginTop:8}}>
            <button className="btn accent" onClick={submit}>{verso==='G'&&mode==='liquidita'?'Registra giroconto':'Registra scrittura'}</button>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ============================================================
   PAGINA: MOVIMENTI  (riepilogo di TUTTI i movimenti)
   ============================================================ */
function PageMovimenti({scritture, saldi}){
  const [tab,setTab] = useState('tutti'); // tutti | cassa | riconc
  const [fConto,setFConto] = useState('');
  const [fTipo,setFTipo] = useState('');
  const [q,setQ] = useState('');
  const [fMese,setFMese] = useState('');
  const [fContoCassa,setFContoCassa] = useState('');

  // --- TUTTI I MOVIMENTI: una riga per ogni movimento di conto del libro giornale ---
  const tutte = useMemo(()=>{
    const out=[];
    scritture.forEach(s=> s.righe.forEach((r,i)=>{
      out.push({key:s.id+'_'+i, data:s.data, descr:s.descr, tipo:s.tipo, origine:s.origine, c:r.c, d:r.d||0, a:r.a||0});
    }));
    return out.sort((x,y)=> (y.data||'').localeCompare(x.data||''));
  },[scritture]);
  const contiUsati = useMemo(()=>{ const set=new Set(); tutte.forEach(m=>set.add(m.c)); return [...set].sort((a,b)=>a-b); },[tutte]);
  const movFilt = tutte.filter(m=>(!fConto||String(m.c)===fConto)&&(!fTipo||m.tipo===fTipo)
      &&(!q || (m.descr||'').toLowerCase().includes(q.toLowerCase()) || (contoByCode[m.c]?.nome||'').toLowerCase().includes(q.toLowerCase())));
  const totD=r2(movFilt.reduce((s,m)=>s+m.d,0)), totA=r2(movFilt.reduce((s,m)=>s+m.a,0));

  // --- CASSA (movimenti reali importati) ---
  const cassaFilt = MOVIMENTI.filter(m=>(!fMese||m.mese===fMese)&&(!fContoCassa||String(m.cod)===fContoCassa))
    .sort((a,b)=>MESI_ORD.indexOf(a.mese)-MESI_ORD.indexOf(b.mese));
  const cassaE=r2(cassaFilt.filter(m=>m.tipo==='E').reduce((s,m)=>s+m.imp,0));
  const cassaU=r2(cassaFilt.filter(m=>m.tipo==='U').reduce((s,m)=>s+m.imp,0));

  // --- RICONCILIAZIONE ---
  const ric = LIQ_CODES.map(cod=>{
    const c=contoByCode[cod];
    const contabile = saldi[cod]?saldi[cod].saldo:0;
    const ini = SALDI_INIZIALI[cod]||0;
    const e = r2(MOVIMENTI.filter(m=>m.cod===cod&&m.tipo==='E').reduce((s,m)=>s+m.imp,0));
    const u = r2(MOVIMENTI.filter(m=>m.cod===cod&&m.tipo==='U').reduce((s,m)=>s+m.imp,0));
    const reale = r2(ini+e-u);
    return {cod,nome:c.nome,contabile,ini,e,u,reale,diff:r2(reale-contabile)};
  });
  const totDiff = r2(ric.reduce((s,x)=>s+x.diff,0));
  const tipoLabel = t => t==='giroconto'?'giroconto':t==='liquidita'?'liquidità':t==='contabile'?'contabile':t;

  return (
    <div>
      <PageHead title="Movimenti" sub="Riepilogo di tutti i movimenti registrati"/>
      <div className="tipo-switch" style={{gridTemplateColumns:'1fr 1fr 1fr',maxWidth:560,marginBottom:22}}>
        <button className={tab==='tutti'?'active entrata':''} onClick={()=>setTab('tutti')}>Tutti i movimenti</button>
        <button className={tab==='cassa'?'active entrata':''} onClick={()=>setTab('cassa')}>Cassa (importati)</button>
        <button className={tab==='riconc'?'active entrata':''} onClick={()=>setTab('riconc')}>Riconciliazione</button>
      </div>

      {tab==='tutti' && <>
        <div className="filters">
          <span className="label">Conto</span>
          <select value={fConto} onChange={e=>setFConto(e.target.value)}><option value="">Tutti</option>{contiUsati.map(c=><option key={c} value={c}>{contoByCode[c]?.nome||('#'+c)}</option>)}</select>
          <span className="label">Tipo</span>
          <select value={fTipo} onChange={e=>setFTipo(e.target.value)}><option value="">Tutti</option><option value="liquidita">Liquidità</option><option value="giroconto">Giroconto</option><option value="contabile">Contabile</option></select>
          <input type="text" placeholder="Cerca descrizione/conto…" value={q} onChange={e=>setQ(e.target.value)}/>
          <span style={{marginLeft:'auto',fontSize:12,color:'var(--ink-3)'}}>{movFilt.length} movimenti</span>
        </div>
        <div className="tbl-wrap">
          <table className="tbl">
            <thead><tr><th>Data</th><th>Descrizione</th><th>Conto</th><th>Tipo</th><th className="num">Dare</th><th className="num">Avere</th></tr></thead>
            <tbody>
              {movFilt.length===0 && <tr><td colSpan="6" className="empty-state">Nessun movimento</td></tr>}
              {movFilt.map(m=>(
                <tr key={m.key}>
                  <td style={{whiteSpace:'nowrap'}}>{fmtDate(m.data)}</td>
                  <td>{m.descr}</td>
                  <td>{contoByCode[m.c]?.nome||('#'+m.c)}</td>
                  <td><span className={'pill '+(m.tipo==='giroconto'?'giroconto':'')}>{tipoLabel(m.tipo)}</span></td>
                  <td className="num">{m.d>0?num2(m.d):''}</td>
                  <td className="num">{m.a>0?num2(m.a):''}</td>
                </tr>
              ))}
            </tbody>
            <tfoot><tr><td colSpan="4" style={{fontWeight:600}}>Totali</td><td className="num" style={{fontWeight:600}}>{num2(totD)}</td><td className="num" style={{fontWeight:600}}>{num2(totA)}</td></tr></tfoot>
          </table>
        </div>
      </>}

      {tab==='cassa' && <>
        <div className="filters">
          <span className="label">Mese</span>
          <select value={fMese} onChange={e=>setFMese(e.target.value)}><option value="">Tutti</option>{MESI_ORD.filter(m=>MOVIMENTI.some(x=>x.mese===m)).map(m=><option key={m}>{m}</option>)}</select>
          <span className="label">Conto</span>
          <select value={fContoCassa} onChange={e=>setFContoCassa(e.target.value)}><option value="">Tutti</option>{LIQ_CODES.map(c=><option key={c} value={c}>{contoByCode[c].nome}</option>)}</select>
          <span style={{marginLeft:'auto',fontSize:12,color:'var(--ink-3)'}}>+{num2(cassaE)} · −{num2(cassaU)}</span>
        </div>
        <div className="tbl-wrap">
          <table className="tbl">
            <thead><tr><th>Mese</th><th>Conto</th><th>Causale</th><th>Categoria</th><th>Metodo</th><th className="num">Importo</th></tr></thead>
            <tbody>
              {cassaFilt.map((m,i)=>(
                <tr key={i}><td>{m.mese}</td><td>{m.conto}</td><td>{m.motivo}</td><td>{m.cat}</td><td>{m.metodo}</td>
                  <td className={'num '+(m.tipo==='E'?'pos':'neg')}>{m.tipo==='E'?'+':'−'}{num2(m.imp)}</td></tr>
              ))}
            </tbody>
          </table>
        </div>
        <div style={{fontSize:12,color:'var(--ink-3)',marginTop:8,fontStyle:'italic'}}>Movimenti reali importati dagli sheet Entrate/Uscite. Servono da riscontro per la riconciliazione.</div>
      </>}

      {tab==='riconc' && <>
        {Math.abs(totDiff)<0.01
          ? <div className="card" style={{borderColor:'#c8d8ce',background:'var(--accent-soft)',marginBottom:18,color:'var(--accent-ink)'}}><b>✓ Contabilità e movimenti reali allineati.</b></div>
          : <div className="card" style={{borderColor:'#e6d5a8',background:'#fbf6e8',marginBottom:18,color:'#7a5a1d'}}><b>⚠ Differenza complessiva {num2(totDiff)} €</b> tra saldo reale (movimenti) e saldo contabile (giornale).</div>}
        <div className="tbl-wrap">
          <table className="tbl">
            <thead><tr><th>Conto</th><th className="num">Saldo iniziale</th><th className="num">Entrate</th><th className="num">Uscite</th><th className="num">Saldo reale</th><th className="num">Saldo contabile</th><th className="num">Differenza</th></tr></thead>
            <tbody>
              {ric.map(x=>(
                <tr key={x.cod}>
                  <td><b>{x.nome}</b></td>
                  <td className="num">{num2(x.ini)}</td><td className="num pos">{num2(x.e)}</td><td className="num neg">{num2(x.u)}</td>
                  <td className="num">{num2(x.reale)}</td><td className="num">{num2(x.contabile)}</td>
                  <td className={'num '+(Math.abs(x.diff)<0.01?'':(x.diff<0?'neg':'pos'))}>{x.diff>0?'+':''}{num2(x.diff)}</td>
                </tr>
              ))}
            </tbody>
            <tfoot><tr><td style={{fontWeight:600}}>Totale</td><td colSpan="5"></td><td className="num" style={{fontWeight:600,color:Math.abs(totDiff)<0.01?'var(--success)':'var(--warn)'}}>{num2(totDiff)}</td></tr></tfoot>
          </table>
        </div>
      </>}
    </div>
  );
}

/* ============================================================
   PAGINA: LIBRO GIORNALE
   ============================================================ */
function PageLibroGiornale({scritture}){
  const [q,setQ]=useState('');
  const [fAnno,setFAnno]=useState('');
  const anni=[...new Set(scritture.map(s=>(s.data||'').slice(0,4)).filter(Boolean))].sort();
  const list=scritture.filter(s=>(!fAnno||(s.data||'').startsWith(fAnno))&&(!q||(s.descr||'').toLowerCase().includes(q.toLowerCase())))
    .sort((a,b)=>(b.data||'').localeCompare(a.data||''));
  const totD=r2(list.reduce((s,e)=>s+e.righe.reduce((x,r)=>x+(r.d||0),0),0));
  const totA=r2(list.reduce((s,e)=>s+e.righe.reduce((x,r)=>x+(r.a||0),0),0));

  return (
    <div>
      <PageHead title="Libro Giornale" sub={`${list.length} scritture in partita doppia`}/>
      <div className="filters">
        <span className="label">Anno</span>
        <select value={fAnno} onChange={e=>setFAnno(e.target.value)}><option value="">Tutti</option>{anni.map(a=><option key={a}>{a}</option>)}</select>
        <input type="text" placeholder="Cerca descrizione…" value={q} onChange={e=>setQ(e.target.value)}/>
      </div>
      <div className="tbl-wrap">
        <table className="tbl giornale">
          <thead><tr><th style={{width:90}}>Data</th><th>Descrizione / Conto</th><th className="num">Dare</th><th className="num">Avere</th></tr></thead>
          <tbody>
            {list.map(s=>{
              const sd=r2(s.righe.reduce((x,r)=>x+(r.d||0),0)), sa=r2(s.righe.reduce((x,r)=>x+(r.a||0),0));
              const ok=Math.abs(sd-sa)<0.01;
              return (
                <React.Fragment key={s.id}>
                  <tr className="gj-head">
                    <td>{fmtDate(s.data)}</td>
                    <td><b>{s.descr}</b> <span className={'pill '+(s.tipo==='giroconto'?'giroconto':'')} style={{marginLeft:6}}>{s.origine==='manuale'?(s.tipo==='giroconto'?'giroconto':'manuale'):'libro'}</span>{!ok&&<span className="pill" style={{background:'#f3dada',color:'#a33',marginLeft:6}}>non quadra</span>}</td>
                    <td className="num"></td><td className="num"></td>
                  </tr>
                  {s.righe.map((r,i)=>(
                    <tr key={s.id+'_'+i} className="gj-row">
                      <td></td>
                      <td style={{paddingLeft:r.d>0?20:46}}>{contoByCode[r.c]?.nome||('#'+r.c)}</td>
                      <td className="num">{r.d>0?num2(r.d):''}</td>
                      <td className="num">{r.a>0?num2(r.a):''}</td>
                    </tr>
                  ))}
                </React.Fragment>
              );
            })}
          </tbody>
          <tfoot><tr><td colSpan="2" style={{fontWeight:600}}>Totali</td><td className="num" style={{fontWeight:600}}>{num2(totD)}</td><td className="num" style={{fontWeight:600}}>{num2(totA)}</td></tr></tfoot>
        </table>
      </div>
    </div>
  );
}

/* ============================================================
   PAGINA: PIVOT CONTI  (pivot unica, tutti i conti)
   ============================================================ */
function PagePivotConti({saldi}){
  const [collapsed,setCollapsed]=useState({});
  const [q,setQ]=useState('');
  const toggle=cat=>setCollapsed(c=>({...c,[cat]:!c[cat]}));

  // ordine categorie come nel piano dei conti
  const CAT_ORDER=[];
  CONTI.forEach(c=>{ if(!CAT_ORDER.includes(c.categoria)) CAT_ORDER.push(c.categoria); });

  const righe=CONTI.map(c=>({...c,...(saldi[c.codice]||{dare:0,avere:0,saldo:0})}))
    .filter(c=>(c.dare!==0||c.avere!==0)&&(!q||c.nome.toLowerCase().includes(q.toLowerCase())||String(c.codice)===q));
  const byCat={}; righe.forEach(r=>{ (byCat[r.categoria]=byCat[r.categoria]||[]).push(r); });
  const totD=r2(righe.reduce((s,r)=>s+r.dare,0));
  const totA=r2(righe.reduce((s,r)=>s+r.avere,0));

  return (
    <div>
      <PageHead title="Pivot Conti" sub="Saldi di tutti i conti — clicca una categoria per comprimerla"/>
      <div className="filters">
        <input type="text" placeholder="Cerca conto…" value={q} onChange={e=>setQ(e.target.value)}/>
      </div>
      <div className="tbl-wrap">
        <table className="tbl pivot">
          <thead><tr><th style={{width:48}}>Cod</th><th>Conto</th><th className="num">Somma Dare</th><th className="num">Somma Avere</th><th className="num">Saldo</th></tr></thead>
          <tbody>
            {CAT_ORDER.filter(cat=>byCat[cat]).map(cat=>{
              const list=byCat[cat];
              const sd=r2(list.reduce((s,r)=>s+r.dare,0)), sa=r2(list.reduce((s,r)=>s+r.avere,0));
              const isOpen=!collapsed[cat];
              return (
                <React.Fragment key={cat}>
                  <tr className="pv-group" onClick={()=>toggle(cat)}>
                    <td>{isOpen?'▾':'▸'}</td>
                    <td><b>{cat}</b> <span style={{color:'var(--ink-3)',fontWeight:400}}>({list.length})</span></td>
                    <td className="num"><b>{num2(sd)}</b></td>
                    <td className="num"><b>{num2(sa)}</b></td>
                    <td className="num"><b>{num2(r2(sd-sa))}</b></td>
                  </tr>
                  {isOpen && list.sort((a,b)=>a.codice-b.codice).map(r=>(
                    <tr key={r.codice} className="pv-row">
                      <td className="mono">{r.codice}</td>
                      <td style={{paddingLeft:24}}>{r.nome}</td>
                      <td className="num">{r.dare?num2(r.dare):''}</td>
                      <td className="num">{r.avere?num2(r.avere):''}</td>
                      <td className={'num '+(r.saldo<0?'neg':'')}>{num2(r.saldo)}</td>
                    </tr>
                  ))}
                </React.Fragment>
              );
            })}
          </tbody>
          <tfoot><tr><td colSpan="2" style={{fontWeight:700}}>TOTALE COMPLESSIVO</td>
            <td className="num" style={{fontWeight:700}}>{num2(totD)}</td>
            <td className="num" style={{fontWeight:700}}>{num2(totA)}</td>
            <td className="num" style={{fontWeight:700,color:Math.abs(totD-totA)<0.01?'var(--success)':'var(--danger)'}}>{Math.abs(totD-totA)<0.01?'✓':num2(r2(totD-totA))}</td>
          </tr></tfoot>
        </table>
      </div>
    </div>
  );
}

function PageBilancio({saldi}){
  const [tab,setTab]=useState('bdv'); // bdv | spce
  const conti = CONTI.map(c=>({...c,...(saldi[c.codice]||{dare:0,avere:0,saldo:0})})).filter(c=>c.dare!==0||c.avere!==0);
  const totD=r2(conti.reduce((s,c)=>s+c.dare,0));
  const totA=r2(conti.reduce((s,c)=>s+c.avere,0));

  // SP / CE
  const valCat = cat => CONTI.filter(c=>c.categoria===cat);
  const saldoOf = c => (saldi[c.codice]||{saldo:0}).saldo;
  const sumSaldo = cat => r2(valCat(cat).reduce((s,c)=>s+saldoOf(c),0));

  const immMat=sumSaldo('IMM. MATERIALI'), immFin=sumSaldo('IMM. FINANZIARIE'), disp=sumSaldo('DISP. LIQUIDE');
  const fondi=sumSaldo('RETTIFICA ATTIVO'); // negativo (avere)
  const attivo = r2(immMat+immFin+disp+fondi);
  const pn=sumSaldo('PATRIMONIO NETTO'); // negativo (avere)
  const ricavi=r2(valCat('RICAVI').reduce((s,c)=>s-saldoOf(c),0));
  const costi=r2(valCat('COSTI').reduce((s,c)=>s+saldoOf(c),0));
  const risultato=r2(ricavi-costi);
  const passivoNetto = r2(-pn);  // PN in positivo
  const totPassivo = r2(passivoNetto + risultato);

  const rowsCat = cat => valCat(cat).map(c=>({nome:c.nome,saldo:saldoOf(c)})).filter(r=>Math.abs(r.saldo)>0.001);

  function SezSP({titolo,righe,segno}){
    return (<>
      <tr><td colSpan="2" style={{fontWeight:600,background:'var(--panel-2)'}}>{titolo}</td></tr>
      {righe.map((r,i)=><tr key={i}><td style={{paddingLeft:24}}>{r.nome}</td><td className="num">{num2(segno*r.saldo)}</td></tr>)}
    </>);
  }

  return (
    <div>
      <PageHead title="Bilancio di Verifica" sub="Verifica saldi + Stato Patrimoniale e Conto Economico"/>
      <div className="tipo-switch" style={{gridTemplateColumns:'1fr 1fr',maxWidth:420,marginBottom:22}}>
        <button className={tab==='bdv'?'active entrata':''} onClick={()=>setTab('bdv')}>Bilancio di verifica</button>
        <button className={tab==='spce'?'active entrata':''} onClick={()=>setTab('spce')}>SP / CE</button>
      </div>

      {tab==='bdv' && <>
        <div className="tbl-wrap">
          <table className="tbl">
            <thead><tr><th style={{width:50}}>Cod</th><th>Conto</th><th>Prosp.</th><th className="num">Dare</th><th className="num">Avere</th><th className="num">Saldo</th></tr></thead>
            <tbody>
              {conti.sort((a,b)=>a.codice-b.codice).map(c=>(
                <tr key={c.codice}>
                  <td className="mono">{c.codice}</td><td>{c.nome}</td>
                  <td><span className="pill">{c.prospetto}</span></td>
                  <td className="num">{c.dare>0?num2(c.dare):''}</td>
                  <td className="num">{c.avere>0?num2(c.avere):''}</td>
                  <td className={'num '+(c.saldo<0?'neg':'')}>{num2(c.saldo)}</td>
                </tr>
              ))}
            </tbody>
            <tfoot><tr><td colSpan="3" style={{fontWeight:600}}>Totali</td>
              <td className="num" style={{fontWeight:600}}>{num2(totD)}</td>
              <td className="num" style={{fontWeight:600}}>{num2(totA)}</td>
              <td className="num" style={{fontWeight:600,color:Math.abs(totD-totA)<0.01?'var(--success)':'var(--danger)'}}>{Math.abs(totD-totA)<0.01?'✓':num2(r2(totD-totA))}</td>
            </tr></tfoot>
          </table>
        </div>
      </>}

      {tab==='spce' && <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:18}}>
        {/* STATO PATRIMONIALE */}
        <div className="card flat">
          <div className="card-title">Stato Patrimoniale</div>
          <table className="tbl"><tbody>
            <SezSP titolo="ATTIVO — Immobilizzazioni materiali" righe={rowsCat('IMM. MATERIALI')} segno={1}/>
            <SezSP titolo="Immobilizzazioni finanziarie" righe={rowsCat('IMM. FINANZIARIE')} segno={1}/>
            <SezSP titolo="Fondi ammortamento (−)" righe={rowsCat('RETTIFICA ATTIVO')} segno={1}/>
            <SezSP titolo="Disponibilità liquide" righe={rowsCat('DISP. LIQUIDE')} segno={1}/>
            <tr><td style={{fontWeight:700}}>TOTALE ATTIVO</td><td className="num" style={{fontWeight:700}}>{num2(attivo)}</td></tr>
            <SezSP titolo="PASSIVO E NETTO — Patrimonio netto" righe={rowsCat('PATRIMONIO NETTO')} segno={-1}/>
            <tr><td style={{paddingLeft:24}}>Risultato d'esercizio</td><td className="num">{num2(risultato)}</td></tr>
            <tr><td style={{fontWeight:700}}>TOTALE PASSIVO E NETTO</td><td className="num" style={{fontWeight:700}}>{num2(r2(passivoNetto+risultato))}</td></tr>
          </tbody></table>
          <div style={{marginTop:10,fontSize:12,color:Math.abs(attivo-(passivoNetto+risultato))<1?'var(--success)':'var(--warn)'}}>
            {Math.abs(attivo-(passivoNetto+risultato))<1?'✓ Attivo = Passivo + Netto':`Sbilancio ${num2(r2(attivo-(passivoNetto+risultato)))} € (conti transitori/rettifiche)`}
          </div>
        </div>
        {/* CONTO ECONOMICO */}
        <div className="card flat">
          <div className="card-title">Conto Economico</div>
          <table className="tbl"><tbody>
            <SezSP titolo="RICAVI" righe={rowsCat('RICAVI')} segno={-1}/>
            <tr><td style={{fontWeight:700}}>TOTALE RICAVI</td><td className="num" style={{fontWeight:700}}>{num2(ricavi)}</td></tr>
            <SezSP titolo="COSTI" righe={rowsCat('COSTI')} segno={1}/>
            <tr><td style={{fontWeight:700}}>TOTALE COSTI</td><td className="num" style={{fontWeight:700}}>{num2(costi)}</td></tr>
            <tr><td style={{fontWeight:700,fontSize:15}}>RISULTATO D'ESERCIZIO</td><td className={'num '+(risultato<0?'neg':'')} style={{fontWeight:700,fontSize:15}}>{num2(risultato)}</td></tr>
          </tbody></table>
        </div>
      </div>}
    </div>
  );
}
/* ============================================================
   PAGINA: RENDICONTO FINANZIARIO  (matrice: mesi in colonna, raggruppabile)
   ============================================================ */
const RF_INVEST = ['FONDI INVESTIMENTO'];
const RF_INTERNI = ['GIROCONTI','RICARICA PREPAGATA','RICARICA CARTA'];

function PageRendiconto(){
  const [vista,setVista] = useState('mensile'); // mensile | totali
  const [collapsed,setCollapsed] = useState({entrate:false,uscite:false,investimenti:false});
  const toggle = k => setCollapsed(c=>({...c,[k]:!c[k]}));

  const mesi = MESI_ORD.filter(m=>MOVIMENTI.some(x=>x.mese===m));
  const catE = [...new Set(MOVIMENTI.filter(m=>m.tipo==='E'&&!RF_INTERNI.includes(m.cat)).map(m=>m.cat))].sort();
  const catU = [...new Set(MOVIMENTI.filter(m=>m.tipo==='U'&&!RF_INVEST.includes(m.cat)&&!RF_INTERNI.includes(m.cat)).map(m=>m.cat))].sort();
  const catI = [...new Set(MOVIMENTI.filter(m=>RF_INVEST.includes(m.cat)).map(m=>m.cat))].sort();

  const sum = (tipoTest, cat, mese) => r2(MOVIMENTI.filter(m=>tipoTest(m)&&m.cat===cat&&m.mese===mese).reduce((s,m)=>s+m.imp,0));
  const sumTot = (tipoTest, cats, mese) => r2(cats.reduce((s,c)=>s+sum(tipoTest,c,mese),0));
  const isE=m=>m.tipo==='E', isU=m=>m.tipo==='U';

  // catena disponibilità
  const dispIni={}, dispFin={}, flusso={}, totEnt={}, totUsc={}, totInv={};
  let prev = r2(LIQ_CODES.reduce((s,c)=>s+(SALDI_INIZIALI[c]||0),0));
  mesi.forEach(m=>{
    dispIni[m]=prev;
    totEnt[m]=sumTot(isE,catE,m);
    totUsc[m]=sumTot(isU,catU,m);
    totInv[m]=sumTot(isU,catI,m);
    flusso[m]=r2(totEnt[m]-totUsc[m]-totInv[m]);
    dispFin[m]=r2(dispIni[m]+flusso[m]);
    prev=dispFin[m];
  });
  const sommaMesi = arr => r2(mesi.reduce((s,m)=>s+(arr[m]||0),0));
  const colTot = {
    dispIni: dispIni[mesi[0]]||0, dispFin: dispFin[mesi[mesi.length-1]]||0,
    totEnt: sommaMesi(totEnt), totUsc: sommaMesi(totUsc), totInv: sommaMesi(totInv), flusso: sommaMesi(flusso),
  };
  const colCatTot = (tipoTest,cat)=> r2(mesi.reduce((s,m)=>s+sum(tipoTest,cat,m),0));

  const cols = vista==='mensile' ? mesi : [];
  const Cell = ({v,cls}) => <td className={'num '+(cls||'')}>{v||v===0?num2(v):''}</td>;

  return (
    <div>
      <PageHead title="Rendiconto Finanziario" sub="Flussi di cassa — mesi in colonna, sezioni raggruppabili">
        <div className="tipo-switch" style={{gridTemplateColumns:'1fr 1fr',width:200}}>
          <button className={vista==='mensile'?'active entrata':''} onClick={()=>setVista('mensile')}>Mensile</button>
          <button className={vista==='totali'?'active entrata':''} onClick={()=>setVista('totali')}>Totali</button>
        </div>
      </PageHead>

      <div className="tbl-wrap">
        <table className="tbl rf-matrix">
          <thead>
            <tr>
              <th className="rf-voce">Voce</th>
              {cols.map(m=><th key={m} className="num" style={{textTransform:'capitalize'}}>{m}</th>)}
              <th className="num">Totale</th>
            </tr>
          </thead>
          <tbody>
            {/* DISP INIZIALI */}
            <tr className="rf-tot">
              <td className="rf-voce">Disponibilità iniziali</td>
              {cols.map(m=><Cell key={m} v={dispIni[m]}/>)}
              <Cell v={colTot.dispIni}/>
            </tr>

            {/* ENTRATE */}
            <tr className="rf-group" onClick={()=>toggle('entrate')}>
              <td className="rf-voce">{collapsed.entrate?'▸':'▾'} Entrate operative</td>
              {cols.map(m=><Cell key={m} v={totEnt[m]} cls="pos"/>)}
              <Cell v={colTot.totEnt} cls="pos"/>
            </tr>
            {!collapsed.entrate && catE.map(cat=>(
              <tr key={'e'+cat} className="rf-row">
                <td className="rf-voce sub">{cat}</td>
                {cols.map(m=><Cell key={m} v={sum(isE,cat,m)}/>)}
                <Cell v={colCatTot(isE,cat)}/>
              </tr>
            ))}

            {/* USCITE */}
            <tr className="rf-group" onClick={()=>toggle('uscite')}>
              <td className="rf-voce">{collapsed.uscite?'▸':'▾'} Uscite operative</td>
              {cols.map(m=><Cell key={m} v={totUsc[m]} cls="neg"/>)}
              <Cell v={colTot.totUsc} cls="neg"/>
            </tr>
            {!collapsed.uscite && catU.map(cat=>(
              <tr key={'u'+cat} className="rf-row">
                <td className="rf-voce sub">{cat}</td>
                {cols.map(m=><Cell key={m} v={sum(isU,cat,m)}/>)}
                <Cell v={colCatTot(isU,cat)}/>
              </tr>
            ))}

            {/* INVESTIMENTI */}
            {catI.length>0 && <>
              <tr className="rf-group" onClick={()=>toggle('investimenti')}>
                <td className="rf-voce">{collapsed.investimenti?'▸':'▾'} Investimenti</td>
                {cols.map(m=><Cell key={m} v={totInv[m]} cls="neg"/>)}
                <Cell v={colTot.totInv} cls="neg"/>
              </tr>
              {!collapsed.investimenti && catI.map(cat=>(
                <tr key={'i'+cat} className="rf-row">
                  <td className="rf-voce sub">{cat}</td>
                  {cols.map(m=><Cell key={m} v={sum(isU,cat,m)}/>)}
                  <Cell v={colCatTot(isU,cat)}/>
                </tr>
              ))}
            </>}

            {/* FLUSSO */}
            <tr className="rf-tot">
              <td className="rf-voce">Flusso del periodo</td>
              {cols.map(m=><Cell key={m} v={flusso[m]} cls={flusso[m]<0?'neg':'pos'}/>)}
              <Cell v={colTot.flusso} cls={colTot.flusso<0?'neg':'pos'}/>
            </tr>
            {/* DISP FINALI */}
            <tr className="rf-tot strong">
              <td className="rf-voce">Disponibilità finali</td>
              {cols.map(m=><Cell key={m} v={dispFin[m]}/>)}
              <Cell v={colTot.dispFin}/>
            </tr>
          </tbody>
        </table>
      </div>
      <div style={{fontSize:12,color:'var(--ink-3)',marginTop:10,fontStyle:'italic'}}>
        Flusso = entrate operative − uscite operative − investimenti. Giroconti e ricariche interne (trasferimenti tra conti propri) sono esclusi perché si compensano. Investimenti = categoria “FONDI INVESTIMENTO”.
      </div>
    </div>
  );
}

/* ============================================================
   PAGINA: CESPITI
   ============================================================ */
function PageCespiti({cespiti,setCespiti,toast}){
  const [edit,setEdit]=useState(null); // oggetto in editing o 'new'
  const blank={nome:'',classe:'II. IMMOBILIZZAZIONI MATERIALI',annoIni:new Date().getFullYear(),costoStorico:0,aliquota:0.2,quotaEs:0,fondo:0,note:''};
  const [form,setForm]=useState(blank);

  const vn = c => r2((c.costoStorico||0)-(c.fondo||0));
  const totCS=r2(cespiti.reduce((s,c)=>s+(c.costoStorico||0),0));
  const totFondo=r2(cespiti.reduce((s,c)=>s+(c.fondo||0),0));
  const totVN=r2(cespiti.reduce((s,c)=>s+vn(c),0));

  function openNew(){ setForm(blank); setEdit('new'); }
  function openEdit(c){ setForm({...c}); setEdit(c.id); }
  function save(){
    if(!form.nome){toast('Nome obbligatorio','error');return;}
    const f={...form,costoStorico:parseFloat(form.costoStorico)||0,aliquota:parseFloat(form.aliquota)||0,quotaEs:parseFloat(form.quotaEs)||0,fondo:parseFloat(form.fondo)||0,annoIni:parseInt(form.annoIni)||null};
    if(edit==='new') setCespiti([...cespiti,{...f,id:uid()}]);
    else setCespiti(cespiti.map(c=>c.id===edit?{...f,id:edit}:c));
    setEdit(null); toast('Cespite salvato','success');
  }
  function del(id){ if(window.confirm('Eliminare il cespite?')){ setCespiti(cespiti.filter(c=>c.id!==id)); toast('Cespite eliminato','success'); } }

  return (
    <div>
      <PageHead title="Cespiti" sub="Libro dei beni ammortizzabili">
        <button className="btn accent" onClick={openNew}>+ Nuovo cespite</button>
      </PageHead>
      <div className="kpi-grid">
        <Kpi label="Costo storico totale" value={eur(totCS)}/>
        <Kpi label="Fondo ammortamento" value={eur(totFondo)}/>
        <Kpi accent label="Valore netto contabile" value={eur(totVN)}/>
      </div>
      <div className="tbl-wrap">
        <table className="tbl">
          <thead><tr><th>Cespite</th><th>Classe</th><th className="num">Anno</th><th className="num">Costo storico</th><th className="num">Aliquota</th><th className="num">Quota es.</th><th className="num">Fondo</th><th className="num">Valore netto</th><th></th></tr></thead>
          <tbody>
            {cespiti.map(c=>(
              <tr key={c.id}>
                <td><b>{c.nome}</b>{c.note&&<div style={{fontSize:11,color:'var(--ink-3)'}}>{c.note}</div>}</td>
                <td style={{fontSize:11}}>{c.classe}</td>
                <td className="num">{c.annoIni}</td>
                <td className="num">{num2(c.costoStorico)}</td>
                <td className="num">{((c.aliquota||0)*100).toFixed(0)}%</td>
                <td className="num">{num2(c.quotaEs)}</td>
                <td className="num">{num2(c.fondo)}</td>
                <td className="num">{num2(vn(c))}</td>
                <td><div style={{display:'flex',gap:4}}><button className="btn ghost sm" onClick={()=>openEdit(c)}>✎</button><button className="btn danger sm" onClick={()=>del(c.id)}>✕</button></div></td>
              </tr>
            ))}
          </tbody>
          <tfoot><tr><td colSpan="3" style={{fontWeight:600}}>Totali</td><td className="num" style={{fontWeight:600}}>{num2(totCS)}</td><td colSpan="2"></td><td className="num" style={{fontWeight:600}}>{num2(totFondo)}</td><td className="num" style={{fontWeight:600}}>{num2(totVN)}</td><td></td></tr></tfoot>
        </table>
      </div>

      {edit!==null && <div className="modal-bg" onClick={e=>{if(e.target.className==='modal-bg')setEdit(null);}}>
        <div className="modal">
          <div className="modal-head"><h3>{edit==='new'?'Nuovo cespite':'Modifica cespite'}</h3><button className="btn ghost sm" onClick={()=>setEdit(null)}>✕</button></div>
          <div className="modal-body"><div className="form-grid">
            <div className="form-row"><label>Nome</label><input type="text" value={form.nome} onChange={e=>setForm({...form,nome:e.target.value})}/></div>
            <div className="form-row"><label>Classe</label><input type="text" value={form.classe} onChange={e=>setForm({...form,classe:e.target.value})}/></div>
            <div className="form-row"><label>Anno inizio</label><input type="number" value={form.annoIni} onChange={e=>setForm({...form,annoIni:e.target.value})}/></div>
            <div className="form-row"><label>Costo storico</label><input type="number" step="0.01" value={form.costoStorico} onChange={e=>setForm({...form,costoStorico:e.target.value})}/></div>
            <div className="form-row"><label>Aliquota (es. 0,20)</label><input type="number" step="0.01" value={form.aliquota} onChange={e=>setForm({...form,aliquota:e.target.value})}/></div>
            <div className="form-row"><label>Quota esercizio</label><input type="number" step="0.01" value={form.quotaEs} onChange={e=>setForm({...form,quotaEs:e.target.value})}/></div>
            <div className="form-row"><label>Fondo ammortamento</label><input type="number" step="0.01" value={form.fondo} onChange={e=>setForm({...form,fondo:e.target.value})}/></div>
            <div className="form-row"><label>Note</label><input type="text" value={form.note} onChange={e=>setForm({...form,note:e.target.value})}/></div>
          </div></div>
          <div className="modal-foot"><button className="btn ghost" onClick={()=>setEdit(null)}>Annulla</button><button className="btn accent" onClick={save}>Salva</button></div>
        </div>
      </div>}
    </div>
  );
}

/* mappa conti di ammortamento per "classe" normalizzata */
function normKey(s){ return String(s||'').toUpperCase().replace(/\./g,' ').replace(/-/g,' ').replace(/\s+/g,' ').trim(); }
const AMM_COST = {}, AMM_FONDO = {};
CONTI.forEach(c=>{
  const up=c.nome.toUpperCase();
  if(c.categoria==='COSTI' && up.startsWith('AMMORTAMENTO')) AMM_COST[normKey(up.replace(/^AMMORTAMENTO/,''))]=c.codice;
  if(c.categoria==='RETTIFICA ATTIVO' && /^F\.?\s*AMMORTAMENTO/.test(up)) AMM_FONDO[normKey(up.replace(/^F\.?\s*AMMORTAMENTO/,''))]=c.codice;
});

function PageAmmortamenti({cespiti, onAdd, updateCespiti, toast}){
  const [anno,setAnno]=useState(new Date().getFullYear());
  const piano = cespiti.map(c=>{
    const quotaTeorica = r2((c.costoStorico||0)*(c.aliquota||0));
    const vn = r2((c.costoStorico||0)-(c.fondo||0));
    const quota = r2(Math.min(quotaTeorica, Math.max(vn,0)));   // non oltre il residuo
    const annoFine = (c.aliquota>0 && c.annoIni) ? c.annoIni + Math.ceil(1/c.aliquota) - 1 : null;
    const residuo = vn>0.005;
    const k = normKey(c.classe);
    return {...c, quota, vn, annoFine, residuo, costCode:AMM_COST[k], fondoCode:AMM_FONDO[k]};
  });
  const totQuota=r2(piano.reduce((s,p)=>s+(p.residuo?p.quota:0),0));
  const totVN=r2(piano.reduce((s,p)=>s+p.vn,0));

  // anteprima scrittura: solo cespiti con quota>0 e conti collegati
  const daAmmortare = piano.filter(p=>p.residuo && p.quota>0.005);
  const collegati = daAmmortare.filter(p=>p.costCode && p.fondoCode);
  const scollegati = daAmmortare.filter(p=>!p.costCode || !p.fondoCode);
  const quotaScrittura = r2(collegati.reduce((s,p)=>s+p.quota,0));

  function generaScrittura(){
    if(collegati.length===0){ toast('Nessun cespite ammortizzabile collegato','error'); return; }
    if(!window.confirm(`Registrare l'ammortamento ${anno} per ${eur(quotaScrittura)} e aggiornare i fondi dei ${collegati.length} cespiti collegati?`)) return;
    // aggrega per conto (più cespiti possono condividere gli stessi conti)
    const dare={}, avere={};
    collegati.forEach(p=>{ dare[p.costCode]=r2((dare[p.costCode]||0)+p.quota); avere[p.fondoCode]=r2((avere[p.fondoCode]||0)+p.quota); });
    const righe=[ ...Object.entries(dare).map(([c,d])=>({c:parseInt(c),d,a:0})),
                  ...Object.entries(avere).map(([c,a])=>({c:parseInt(c),d:0,a})) ];
    onAdd({id:uid(),data:`${anno}-12-31`,descr:`Ammortamento esercizio ${anno}`,righe,origine:'manuale',tipo:'contabile'});
    // aggiorna i fondi sui cespiti collegati
    const ids=new Set(collegati.map(p=>p.id));
    updateCespiti(cespiti.map(c=>{
      if(!ids.has(c.id)) return c;
      const p=collegati.find(x=>x.id===c.id);
      return {...c, fondo:r2((c.fondo||0)+p.quota)};
    }));
    toast('Scrittura di ammortamento registrata','success');
  }

  return (
    <div>
      <PageHead title="Piano di Ammortamento" sub="Quote d'esercizio e valore residuo"/>

      <div className="card" style={{marginBottom:22}}>
        <div className="card-title">Genera scrittura di ammortamento di fine anno</div>
        <div style={{display:'flex',gap:14,alignItems:'flex-end',flexWrap:'wrap'}}>
          <div className="form-row" style={{maxWidth:140}}>
            <label>Esercizio</label>
            <input type="number" value={anno} onChange={e=>setAnno(parseInt(e.target.value)||anno)}/>
          </div>
          <div style={{flex:1,minWidth:220,background:'var(--panel-2)',borderRadius:6,padding:'10px 14px',fontSize:13,color:'var(--ink-2)'}}>
            Quota da registrare: <b>{eur(quotaScrittura)}</b> · cespiti collegati: <b>{collegati.length}</b>
            {scollegati.length>0 && <div style={{color:'var(--warn)',marginTop:4,fontSize:12}}>⚠ {scollegati.length} senza conto collegato (esclusi): {scollegati.map(p=>p.nome).join(', ')}</div>}
          </div>
          <button className="btn accent" onClick={generaScrittura} disabled={collegati.length===0}>Registra 31/12/{anno}</button>
        </div>
        {collegati.length>0 && <div className="tbl-wrap" style={{marginTop:14}}>
          <table className="tbl">
            <thead><tr><th>Cespite</th><th>Conto costo (Dare)</th><th>Fondo (Avere)</th><th className="num">Quota</th></tr></thead>
            <tbody>
              {collegati.map(p=>(
                <tr key={p.id}><td>{p.nome}</td><td style={{fontSize:12}}>{contoByCode[p.costCode].nome}</td>
                  <td style={{fontSize:12}}>{contoByCode[p.fondoCode].nome}</td><td className="num">{num2(p.quota)}</td></tr>
              ))}
            </tbody>
            <tfoot><tr><td colSpan="3" style={{fontWeight:600}}>Totale</td><td className="num" style={{fontWeight:600}}>{num2(quotaScrittura)}</td></tr></tfoot>
          </table>
        </div>}
      </div>

      <div className="kpi-grid">
        <Kpi accent label="Quota ammortamento esercizio" value={eur(totQuota)} hint="Beni ancora da ammortizzare"/>
        <Kpi label="Valore netto residuo" value={eur(totVN)}/>
        <Kpi label="N. cespiti" value={piano.length}/>
      </div>
      <div className="tbl-wrap">
        <table className="tbl">
          <thead><tr><th>Cespite</th><th className="num">Costo storico</th><th className="num">Aliquota</th><th className="num">Quota annua</th><th className="num">Fondo</th><th className="num">Valore netto</th><th>Stato</th></tr></thead>
          <tbody>
            {piano.map(p=>(
              <tr key={p.id}>
                <td><b>{p.nome}</b>{p.annoFine&&<div style={{fontSize:11,color:'var(--ink-3)'}}>{p.annoIni}–{p.annoFine}</div>}</td>
                <td className="num">{num2(p.costoStorico)}</td>
                <td className="num">{((p.aliquota||0)*100).toFixed(0)}%</td>
                <td className="num">{num2(p.quota)}</td>
                <td className="num">{num2(p.fondo)}</td>
                <td className="num">{num2(p.vn)}</td>
                <td>{p.residuo?<span className="pill entrata">in ammortamento</span>:<span className="pill">completato</span>}</td>
              </tr>
            ))}
          </tbody>
          <tfoot><tr><td style={{fontWeight:600}}>Totali</td><td colSpan="2"></td><td className="num" style={{fontWeight:600}}>{num2(totQuota)}</td><td></td><td className="num" style={{fontWeight:600}}>{num2(totVN)}</td><td></td></tr></tfoot>
        </table>
      </div>
      <div style={{fontSize:12,color:'var(--ink-3)',marginTop:10,fontStyle:'italic'}}>Quota annua = costo storico × aliquota. Periodo stimato in base all'aliquota a quote costanti.</div>
    </div>
  );
}

/* ============================================================
   PAGINA: EXPORT
   ============================================================ */
function PageExport({scritture, cespiti, saldi, toast}){
  function buildWorkbook(){
    const wb=XLSX.utils.book_new();
    const add=(name,aoa)=>XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(aoa),name);

    // Libro Giornale
    const gj=[['Data','Descrizione','Codice','Conto','Dare','Avere']];
    [...scritture].sort((a,b)=>(a.data||'').localeCompare(b.data||'')).forEach(s=>s.righe.forEach((r,i)=>
      gj.push([i===0?s.data:'',i===0?s.descr:'',r.c,contoByCode[r.c]?.nome||'',r.d||'',r.a||''])));
    add('Libro Giornale',gj);

    // Movimenti (tutti)
    const mv=[['Data','Descrizione','Conto','Tipo','Dare','Avere']];
    [...scritture].sort((a,b)=>(b.data||'').localeCompare(a.data||'')).forEach(s=>s.righe.forEach(r=>
      mv.push([s.data,s.descr,contoByCode[r.c]?.nome||'',s.tipo,r.d||'',r.a||''])));
    add('Movimenti',mv);

    // Movimenti cassa importati
    const cs=[['Mese','Conto','Causale','Categoria','Metodo','Tipo','Importo']];
    MOVIMENTI.forEach(m=>cs.push([m.mese,m.conto,m.motivo,m.cat,m.metodo,m.tipo==='E'?'Entrata':'Uscita',m.imp]));
    add('Movimenti Cassa',cs);

    // Pivot / Bilancio di verifica
    const pv=[['Codice','Conto','Prospetto','Categoria','Dare','Avere','Saldo']];
    let td=0,ta=0;
    CONTI.forEach(c=>{const s=saldi[c.codice]||{dare:0,avere:0,saldo:0}; if(s.dare||s.avere){ pv.push([c.codice,c.nome,c.prospetto,c.categoria,s.dare,s.avere,s.saldo]); td+=s.dare; ta+=s.avere; }});
    pv.push(['','','','TOTALE',r2(td),r2(ta),r2(td-ta)]);
    add('Bilancio di Verifica',pv);

    // Rendiconto (mesi in colonna)
    const mesi=MESI_ORD.filter(m=>MOVIMENTI.some(x=>x.mese===m));
    const sumc=(test,cats,m)=>r2(cats.reduce((s,c)=>s+MOVIMENTI.filter(x=>test(x)&&x.cat===c&&x.mese===m).reduce((q,x)=>q+x.imp,0),0));
    const catE=[...new Set(MOVIMENTI.filter(m=>m.tipo==='E'&&!RF_INTERNI.includes(m.cat)).map(m=>m.cat))];
    const catU=[...new Set(MOVIMENTI.filter(m=>m.tipo==='U'&&!RF_INVEST.includes(m.cat)&&!RF_INTERNI.includes(m.cat)).map(m=>m.cat))];
    const rf=[['Voce',...mesi,'Totale']];
    const rowFn=(label,fn)=>{const vals=mesi.map(fn); rf.push([label,...vals,r2(vals.reduce((a,b)=>a+b,0))]);};
    let prev=r2(LIQ_CODES.reduce((s,c)=>s+(SALDI_INIZIALI[c]||0),0)); const di={},df={};
    mesi.forEach(m=>{di[m]=prev; const e=sumc(x=>x.tipo==='E',catE,m),u=sumc(x=>x.tipo==='U',catU,m),inv=sumc(x=>x.tipo==='U',RF_INVEST,m); df[m]=r2(prev+e-u-inv); prev=df[m];});
    rf.push(['Disponibilità iniziali',...mesi.map(m=>di[m]),di[mesi[0]]||0]);
    rowFn('Entrate operative',m=>sumc(x=>x.tipo==='E',catE,m));
    rowFn('Uscite operative',m=>sumc(x=>x.tipo==='U',catU,m));
    rowFn('Investimenti',m=>sumc(x=>x.tipo==='U',RF_INVEST,m));
    rowFn('Flusso del periodo',m=>r2(sumc(x=>x.tipo==='E',catE,m)-sumc(x=>x.tipo==='U',catU,m)-sumc(x=>x.tipo==='U',RF_INVEST,m)));
    rf.push(['Disponibilità finali',...mesi.map(m=>df[m]),df[mesi[mesi.length-1]]||0]);
    add('Rendiconto',rf);

    // Cespiti
    const ce=[['Cespite','Classe','Anno','Costo storico','Aliquota','Quota es.','Fondo','Valore netto']];
    cespiti.forEach(c=>ce.push([c.nome,c.classe,c.annoIni,c.costoStorico,c.aliquota,c.quotaEs,c.fondo,r2((c.costoStorico||0)-(c.fondo||0))]));
    add('Cespiti',ce);

    // Piano dei conti
    const pc=[['Codice','Nome','Prospetto','Categoria','Eccedenza']];
    CONTI.forEach(c=>pc.push([c.codice,c.nome,c.prospetto,c.categoria,c.eccedenza]));
    add('Piano dei Conti',pc);

    return wb;
  }
  function exportExcel(){
    if(!window.XLSX){ toast('Libreria non caricata','error'); return; }
    XLSX.writeFile(buildWorkbook(),`Contabilita_${todayISO()}.xlsx`);
    toast('Export Excel completato','success');
  }
  function exportJson(){
    const data={scritture,cespiti,exportedAt:new Date().toISOString()};
    const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
    a.download=`backup_contabilita_${todayISO()}.json`; a.click(); URL.revokeObjectURL(a.href);
    toast('Backup JSON scaricato','success');
  }

  // ---------- PDF ----------
  function pdfHeader(doc,titolo){
    doc.setFont('helvetica','bold'); doc.setFontSize(16);
    doc.text('CONTABILITÀ PERSONALE',105,18,{align:'center'});
    doc.setFontSize(11); doc.setFont('helvetica','normal');
    doc.text(titolo,105,25,{align:'center'});
    doc.setFontSize(9); doc.setTextColor(120);
    doc.text(`Generato il ${new Date().toLocaleDateString('it-IT')}`,105,31,{align:'center'});
    doc.setTextColor(0);
  }
  function exportBilancioPDF(){
    if(!window.jspdf){ toast('Libreria PDF non caricata','error'); return; }
    const {jsPDF}=window.jspdf; const doc=new jsPDF({orientation:'portrait',unit:'mm',format:'a4'});
    pdfHeader(doc,'Bilancio di Verifica');
    let td=0,ta=0; const rows=[];
    CONTI.forEach(c=>{const s=saldi[c.codice]||{dare:0,avere:0,saldo:0}; if(s.dare||s.avere){
      td+=s.dare; ta+=s.avere;
      rows.push([String(c.codice).padStart(2,'0'),c.nome,c.categoria,s.dare?num2(s.dare):'',s.avere?num2(s.avere):'',num2(Math.abs(s.saldo))+(s.saldo<0?' A':s.saldo>0?' D':'')]);
    }});
    rows.push([{content:'TOTALI',colSpan:3,styles:{fontStyle:'bold'}},{content:num2(r2(td)),styles:{fontStyle:'bold'}},{content:num2(r2(ta)),styles:{fontStyle:'bold'}},'']);
    doc.autoTable({startY:36,head:[['Cod','Conto','Categoria','Dare','Avere','Saldo']],body:rows,
      styles:{fontSize:8,cellPadding:1.5},headStyles:{fillColor:[45,94,62]},
      columnStyles:{3:{halign:'right'},4:{halign:'right'},5:{halign:'right'}}});
    doc.save(`Bilancio_di_Verifica_${todayISO()}.pdf`); toast('PDF generato','success');
  }
  function exportRendicontoPDF(){
    if(!window.jspdf){ toast('Libreria PDF non caricata','error'); return; }
    const {jsPDF}=window.jspdf; const doc=new jsPDF({orientation:'landscape',unit:'mm',format:'a4'});
    pdfHeader(doc,'Rendiconto Finanziario');
    const mesi=MESI_ORD.filter(m=>MOVIMENTI.some(x=>x.mese===m));
    const sumc=(test,cats,m)=>r2(cats.reduce((s,c)=>s+MOVIMENTI.filter(x=>test(x)&&x.cat===c&&x.mese===m).reduce((q,x)=>q+x.imp,0),0));
    const catE=[...new Set(MOVIMENTI.filter(m=>m.tipo==='E'&&!RF_INTERNI.includes(m.cat)).map(m=>m.cat))];
    const catU=[...new Set(MOVIMENTI.filter(m=>m.tipo==='U'&&!RF_INVEST.includes(m.cat)&&!RF_INTERNI.includes(m.cat)).map(m=>m.cat))];
    let prev=r2(LIQ_CODES.reduce((s,c)=>s+(SALDI_INIZIALI[c]||0),0)); const di={},df={};
    mesi.forEach(m=>{di[m]=prev; const e=sumc(x=>x.tipo==='E',catE,m),u=sumc(x=>x.tipo==='U',catU,m),inv=sumc(x=>x.tipo==='U',RF_INVEST,m); df[m]=r2(prev+e-u-inv); prev=df[m];});
    const row=(label,fn)=>{const v=mesi.map(fn); return [label,...v.map(num2),num2(r2(v.reduce((a,b)=>a+b,0)))];};
    const body=[
      ['Disponibilità iniziali',...mesi.map(m=>num2(di[m])),num2(di[mesi[0]]||0)],
      row('Entrate operative',m=>sumc(x=>x.tipo==='E',catE,m)),
      row('Uscite operative',m=>sumc(x=>x.tipo==='U',catU,m)),
      row('Investimenti',m=>sumc(x=>x.tipo==='U',RF_INVEST,m)),
      row('Flusso del periodo',m=>r2(sumc(x=>x.tipo==='E',catE,m)-sumc(x=>x.tipo==='U',catU,m)-sumc(x=>x.tipo==='U',RF_INVEST,m))),
      ['Disponibilità finali',...mesi.map(m=>num2(df[m])),num2(df[mesi[mesi.length-1]]||0)],
    ];
    const halign={}; mesi.forEach((_,i)=>halign[i+1]={halign:'right'}); halign[mesi.length+1]={halign:'right'};
    doc.autoTable({startY:36,head:[['Voce',...mesi.map(m=>m[0].toUpperCase()+m.slice(1)),'Totale']],body,
      styles:{fontSize:8,cellPadding:1.5},headStyles:{fillColor:[45,94,62]},columnStyles:halign});
    doc.save(`Rendiconto_${todayISO()}.pdf`); toast('PDF generato','success');
  }
