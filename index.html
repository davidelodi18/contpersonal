<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Finanze Personali</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

<style>
  :root {
    --bg: #f7f6f2;
    --panel: #ffffff;
    --panel-2: #fbfaf6;
    --ink: #1a1a1a;
    --ink-2: #4a4a4a;
    --ink-3: #8a8a82;
    --rule: #e8e6df;
    --rule-2: #d8d5cc;
    --accent: #2d5e3e;       /* verde campo, sobrio */
    --accent-soft: #e8efe9;
    --accent-ink: #1a3d27;
    --gold: #b8954b;
    --danger: #b54343;
    --danger-soft: #fbecec;
    --success: #2d5e3e;
    --warn: #c08020;
    --shadow-sm: 0 1px 2px rgba(20,20,20,0.04), 0 0 0 1px rgba(20,20,20,0.04);
    --shadow-md: 0 4px 16px rgba(20,20,20,0.06), 0 0 0 1px rgba(20,20,20,0.04);
    --shadow-lg: 0 20px 50px rgba(20,20,20,0.12);
    --radius: 6px;
    --radius-lg: 10px;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--ink);
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }

  .serif { font-family: 'Fraunces', Georgia, serif; }
  .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }

  button { font-family: inherit; cursor: pointer; }
  input, select, textarea { font-family: inherit; font-size: inherit; }

  /* === LAYOUT === */
  .app { min-height: 100vh; display: flex; flex-direction: column; }

  .topbar {
    background: var(--ink);
    color: #f0eee7;
    padding: 14px 28px;
    display: flex;
    align-items: center;
    gap: 24px;
    border-bottom: 1px solid #000;
  }
  .topbar h1 {
    font-family: 'Fraunces', serif;
    font-size: 18px;
    font-weight: 500;
    margin: 0;
    letter-spacing: -0.01em;
    flex: 1;
  }
  .topbar h1 .sub {
    color: #a8a59a;
    margin-left: 12px;
    font-size: 13px;
    font-style: italic;
  }
  .topbar .badge {
    background: #2d2d2d;
    border: 1px solid #3a3a3a;
    padding: 4px 10px;
    border-radius: 4px;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: #c9c7be;
  }
  .topbar select {
    background: #2d2d2d;
    color: #f0eee7;
    border: 1px solid #3a3a3a;
    padding: 5px 10px;
    border-radius: 4px;
    font-size: 12px;
    cursor: pointer;
  }
  .topbar select:hover { border-color: #555; }
  .topbar button.icon-btn {
    background: transparent;
    color: #c9c7be;
    border: 1px solid #3a3a3a;
    padding: 5px 10px;
    border-radius: 4px;
    font-size: 12px;
  }
  .topbar button.icon-btn:hover { background: #2d2d2d; }

  .layout {
    display: flex;
    flex: 1;
    min-height: 0;
  }
  .sidebar {
    width: 220px;
    background: var(--panel);
    border-right: 1px solid var(--rule);
    padding: 24px 12px;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .sidebar .section-label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--ink-3);
    margin: 18px 14px 6px;
    font-weight: 600;
  }
  .sidebar .section-label:first-child { margin-top: 0; }
  .navlink {
    background: transparent;
    border: none;
    text-align: left;
    padding: 8px 14px;
    border-radius: 4px;
    color: var(--ink-2);
    font-size: 13.5px;
    font-weight: 500;
    display: flex;
    align-items: center;
    gap: 10px;
    transition: background 0.12s;
  }
  .navlink:hover { background: var(--bg); color: var(--ink); }
  .navlink.active {
    background: var(--ink);
    color: #f0eee7;
  }
  .navlink .ico {
    font-size: 14px;
    width: 16px;
    text-align: center;
    opacity: 0.7;
  }
  .navlink.active .ico { opacity: 1; }

  .main {
    flex: 1;
    min-width: 0;
    padding: 32px 36px;
    overflow-y: auto;
  }

  .page-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 24px;
    margin-bottom: 28px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--rule);
  }
  .page-head h2 {
    font-family: 'Fraunces', serif;
    font-size: 28px;
    font-weight: 500;
    margin: 0;
    letter-spacing: -0.02em;
  }
  .page-head .sub {
    color: var(--ink-3);
    font-size: 13px;
  }

  /* === BUTTONS === */
  .btn {
    background: var(--ink);
    color: #f0eee7;
    border: 1px solid var(--ink);
    padding: 8px 16px;
    border-radius: var(--radius);
    font-size: 13px;
    font-weight: 500;
    transition: all 0.12s;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .btn:hover { background: #000; }
  .btn.ghost {
    background: transparent;
    color: var(--ink);
    border: 1px solid var(--rule-2);
  }
  .btn.ghost:hover { background: var(--bg); border-color: var(--ink-3); }
  .btn.accent {
    background: var(--accent);
    border-color: var(--accent);
  }
  .btn.accent:hover { background: var(--accent-ink); }
  .btn.danger {
    background: transparent;
    color: var(--danger);
    border: 1px solid var(--rule-2);
  }
  .btn.danger:hover { background: var(--danger-soft); border-color: var(--danger); }
  .btn.sm { padding: 5px 10px; font-size: 12px; }

  /* === CARDS === */
  .card {
    background: var(--panel);
    border: 1px solid var(--rule);
    border-radius: var(--radius-lg);
    padding: 20px;
  }
  .card.flat { box-shadow: var(--shadow-sm); }
  .card .card-title {
    font-family: 'Fraunces', serif;
    font-size: 16px;
    font-weight: 500;
    margin: 0 0 14px;
  }

  /* === KPI === */
  .kpi-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
    gap: 14px;
    margin-bottom: 24px;
  }
  .kpi {
    background: var(--panel);
    border: 1px solid var(--rule);
    border-radius: var(--radius-lg);
    padding: 18px 20px;
    position: relative;
    overflow: hidden;
  }
  .kpi.accent { background: var(--ink); color: #f0eee7; border-color: var(--ink); }
  .kpi .label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--ink-3);
    margin-bottom: 8px;
    font-weight: 600;
  }
  .kpi.accent .label { color: #a8a59a; }
  .kpi .value {
    font-family: 'Fraunces', serif;
    font-size: 28px;
    font-weight: 500;
    letter-spacing: -0.02em;
    line-height: 1.1;
  }
  .kpi .value.neg { color: var(--danger); }
  .kpi .hint {
    margin-top: 4px;
    font-size: 11.5px;
    color: var(--ink-3);
  }

  /* === TABLE === */
  .tbl-wrap {
    background: var(--panel);
    border: 1px solid var(--rule);
    border-radius: var(--radius-lg);
    overflow: hidden;
  }
  table.tbl {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  table.tbl th {
    text-align: left;
    padding: 11px 14px;
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--ink-3);
    font-weight: 600;
    background: var(--panel-2);
    border-bottom: 1px solid var(--rule);
    position: sticky;
    top: 0;
  }
  table.tbl td {
    padding: 10px 14px;
    border-bottom: 1px solid var(--rule);
    vertical-align: top;
  }
  table.tbl tr:last-child td { border-bottom: none; }
  table.tbl tr:hover td { background: var(--panel-2); }
  table.tbl td.num, table.tbl th.num { text-align: right; font-variant-numeric: tabular-nums; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12.5px; }
  table.tbl td.neg { color: var(--danger); }
  table.tbl td.pos { color: var(--success); }
  table.tbl .pill {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 99px;
    font-size: 11px;
    font-weight: 500;
    background: var(--bg);
    border: 1px solid var(--rule);
    color: var(--ink-2);
  }
  table.tbl .pill.entrata { background: var(--accent-soft); border-color: #c8d8ce; color: var(--accent-ink); }
  table.tbl .pill.uscita { background: var(--danger-soft); border-color: #f1d6d6; color: var(--danger); }
  table.tbl .pill.giroconto { background: #f4ebd7; border-color: #e6d5a8; color: #7a5a1d; }

  .empty-state {
    padding: 40px;
    text-align: center;
    color: var(--ink-3);
    font-style: italic;
  }

  /* === FORM === */
  .form-grid {
    display: grid;
    gap: 14px;
  }
  .form-row {
    display: grid;
    grid-template-columns: 180px 1fr;
    align-items: center;
    gap: 16px;
  }
  .form-row label {
    font-size: 12.5px;
    color: var(--ink-2);
    font-weight: 500;
  }
  .form-row .req { color: var(--danger); }
  input[type=text], input[type=number], input[type=date], input[type=password], select, textarea {
    width: 100%;
    padding: 8px 11px;
    border: 1px solid var(--rule-2);
    border-radius: var(--radius);
    background: var(--panel);
    color: var(--ink);
    transition: border 0.12s;
  }
  input:focus, select:focus, textarea:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }
  textarea { resize: vertical; min-height: 60px; }

  .tipo-switch {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 0;
    border: 1px solid var(--rule-2);
    border-radius: var(--radius);
    overflow: hidden;
  }
  .tipo-switch button {
    background: var(--panel);
    color: var(--ink-2);
    border: none;
    border-right: 1px solid var(--rule);
    padding: 10px 12px;
    font-size: 13px;
    font-weight: 500;
    transition: all 0.12s;
  }
  .tipo-switch button:last-child { border-right: none; }
  .tipo-switch button:hover { background: var(--bg); }
  .tipo-switch button.active.entrata { background: var(--accent); color: #fff; }
  .tipo-switch button.active.uscita { background: var(--danger); color: #fff; }
  .tipo-switch button.active.giroconto { background: var(--gold); color: #fff; }

  /* === FILTERS === */
  .filters {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 16px;
    align-items: center;
  }
  .filters input, .filters select {
    padding: 6px 10px;
    font-size: 12.5px;
    max-width: 200px;
  }
  .filters .label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--ink-3);
    font-weight: 600;
  }

  /* === LOGIN === */
  .login-shell {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background:
      radial-gradient(at 20% 30%, var(--accent-soft) 0px, transparent 50%),
      radial-gradient(at 80% 70%, #f4ebd7 0px, transparent 50%),
      var(--bg);
    padding: 24px;
  }
  .login-card {
    background: var(--panel);
    border: 1px solid var(--rule);
    border-radius: 14px;
    padding: 40px 44px;
    max-width: 420px;
    width: 100%;
    box-shadow: var(--shadow-lg);
  }
  .login-card .logo {
    font-family: 'Fraunces', serif;
    font-size: 22px;
    font-weight: 500;
    margin: 0 0 4px;
    letter-spacing: -0.01em;
  }
  .login-card .tag {
    color: var(--ink-3);
    font-size: 12.5px;
    margin-bottom: 28px;
    font-style: italic;
  }
  .login-card .field { margin-bottom: 14px; }
  .login-card .field label {
    display: block;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--ink-3);
    margin-bottom: 5px;
    font-weight: 600;
  }
  .login-card .err {
    color: var(--danger);
    background: var(--danger-soft);
    padding: 8px 12px;
    border-radius: var(--radius);
    font-size: 12.5px;
    margin-bottom: 12px;
  }
  .login-card .btn { width: 100%; justify-content: center; padding: 11px; }

  /* === MODAL === */
  .modal-bg {
    position: fixed;
    inset: 0;
    background: rgba(20,20,20,0.4);
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .modal {
    background: var(--panel);
    border-radius: var(--radius-lg);
    max-width: 640px;
    width: 100%;
    max-height: 90vh;
    overflow-y: auto;
    box-shadow: var(--shadow-lg);
  }
  .modal-head {
    padding: 18px 24px;
    border-bottom: 1px solid var(--rule);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .modal-head h3 {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    margin: 0;
    font-size: 18px;
  }
  .modal-body { padding: 22px 24px; }
  .modal-foot {
    padding: 14px 24px;
    border-top: 1px solid var(--rule);
    display: flex;
    justify-content: flex-end;
    gap: 8px;
  }

  /* === TOAST === */
  .toast {
    position: fixed;
    bottom: 24px;
    right: 24px;
    padding: 12px 18px;
    background: var(--ink);
    color: #f0eee7;
    border-radius: var(--radius);
    font-size: 13px;
    box-shadow: var(--shadow-lg);
    z-index: 200;
    animation: slideUp 0.2s ease-out;
  }
  .toast.success { background: var(--accent); }
  .toast.error { background: var(--danger); }
  @keyframes slideUp {
    from { transform: translateY(20px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }

  /* === LIQUIDITY BARS === */
  .liq-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 14px;
  }
  .liq-card {
    background: var(--panel);
    border: 1px solid var(--rule);
    border-radius: var(--radius-lg);
    padding: 18px 20px;
  }
  .liq-card .head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 10px;
  }
  .liq-card .name {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--ink-3);
    font-weight: 600;
  }
  .liq-card .saldo {
    font-family: 'Fraunces', serif;
    font-size: 24px;
    font-weight: 500;
    letter-spacing: -0.02em;
  }
  .liq-card .saldo.neg { color: var(--danger); }
  .liq-card .delta {
    font-size: 11px;
    color: var(--ink-3);
    margin-top: 4px;
    font-variant-numeric: tabular-nums;
  }
  .liq-card .delta .pos { color: var(--success); }
  .liq-card .delta .neg { color: var(--danger); }

  /* === SCROLLBARS === */
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--rule-2); border-radius: 5px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--ink-3); }

  /* === MOBILE: bottone menu hamburger === */
  .menu-btn {
    display: none;
    background: transparent;
    color: #f0eee7;
    border: 1px solid #3a3a3a;
    width: 36px;
    height: 36px;
    border-radius: 6px;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    padding: 0;
  }
  .menu-btn:hover { background: #2d2d2d; }
  .sidebar-backdrop {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(20,20,20,0.4);
    z-index: 90;
    animation: fadeIn 0.15s ease-out;
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  /* === RESPONSIVE: mobile === */
  @media (max-width: 768px) {
    body { font-size: 14px; }

    .topbar {
      padding: 10px 14px;
      gap: 10px;
      flex-wrap: nowrap;
    }
    .topbar h1 {
      font-size: 15px;
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .topbar h1 .sub { display: none; }
    .topbar .badge { display: none; }
    .topbar select {
      font-size: 13px;
      padding: 6px 8px;
      max-width: 110px;
    }
    .topbar button.icon-btn {
      font-size: 11px;
      padding: 5px 8px;
    }
    .topbar .desktop-only { display: none; }
    .menu-btn { display: inline-flex; }

    /* Sidebar diventa drawer */
    .layout { flex-direction: column; }
    .sidebar {
      position: fixed;
      top: 0; left: 0; bottom: 0;
      width: 75%;
      max-width: 280px;
      z-index: 100;
      flex-direction: column;
      flex-wrap: nowrap;
      padding: 20px 14px;
      overflow-y: auto;
      transform: translateX(-100%);
      transition: transform 0.22s ease-out;
      box-shadow: 0 0 30px rgba(0,0,0,0.15);
    }
    .sidebar.open { transform: translateX(0); }
    .sidebar.open ~ .sidebar-backdrop { display: block; }
    .sidebar .section-label { display: block; margin-top: 14px; }
    .sidebar .section-label:first-child { margin-top: 0; }
    .navlink {
      padding: 10px 14px;
      font-size: 14px;
    }

    /* Main */
    .main {
      padding: 14px;
      width: 100%;
    }

    /* Page head */
    .page-head {
      flex-direction: column;
      align-items: stretch;
      gap: 12px;
      margin-bottom: 18px;
    }
    .page-head h2 { font-size: 22px; }
    .page-head .sub { font-size: 12px; }

    /* KPI grid: 2 colonne su mobile */
    .kpi-grid {
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 16px;
    }
    .kpi {
      padding: 12px 14px;
    }
    .kpi .label { font-size: 9.5px; margin-bottom: 4px; }
    .kpi .value { font-size: 20px; }
    .kpi .hint { font-size: 10.5px; }

    /* Liquidità grid: 2 colonne */
    .liq-grid {
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }
    .liq-card { padding: 12px 14px; }
    .liq-card .saldo { font-size: 18px; }
    .liq-card .name { font-size: 10px; }
    .liq-card .delta { font-size: 10px; }

    /* Form: una colonna, label sopra */
    .form-row {
      grid-template-columns: 1fr;
      gap: 6px;
    }
    .form-row label { font-size: 12px; font-weight: 600; color: var(--ink); }
    input, select, textarea {
      font-size: 16px !important;  /* iOS no-zoom su focus */
      padding: 10px 12px;
    }

    /* Tipo switch */
    .tipo-switch button { font-size: 12px; padding: 9px 6px; }

    /* Filtri: full-width stack */
    .filters {
      gap: 8px;
    }
    .filters input, .filters select {
      max-width: none;
      width: 100%;
      font-size: 13.5px !important;
    }
    .filters .label { width: 100%; margin-bottom: -4px; }

    /* Tabelle: scroll fluido, font più compatto */
    .tbl-wrap {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      border-radius: 8px;
    }
    table.tbl { font-size: 12px; min-width: 600px; }
    table.tbl th { padding: 8px 10px; font-size: 9.5px; }
    table.tbl td { padding: 8px 10px; }
    table.tbl td.num, table.tbl th.num { font-size: 11.5px; }

    /* Modal: quasi fullscreen su mobile */
    .modal-bg { padding: 0; align-items: flex-end; }
    .modal {
      max-width: 100%;
      width: 100%;
      max-height: 95vh;
      border-radius: 14px 14px 0 0;
    }
    .modal-head { padding: 14px 18px; }
    .modal-head h3 { font-size: 16px; }
    .modal-body { padding: 16px 18px; }
    .modal-foot { padding: 12px 18px; }

    /* Card */
    .card { padding: 16px; }

    /* Cespiti & SP/CE: niente più 2 colonne affiancate */
    div[style*="grid-template-columns: 1fr 1fr"] {
      grid-template-columns: 1fr !important;
    }

    /* Topbar selettore stagione: pillola compatta */
    .topbar select { min-width: 0; }

    /* Login card */
    .login-card { padding: 28px 22px; }
    .login-card .logo { font-size: 19px; }

    /* Buttons */
    .btn { padding: 10px 14px; font-size: 13.5px; }
    .btn.sm { padding: 6px 10px; font-size: 12px; }

    /* Toast */
    .toast {
      bottom: 16px;
      right: 16px;
      left: 16px;
      text-align: center;
    }
  }

  /* === RESPONSIVE: very small (iPhone SE etc) === */
  @media (max-width: 380px) {
    .kpi-grid { grid-template-columns: 1fr; }
    .liq-grid { grid-template-columns: 1fr; }
    .kpi .value { font-size: 22px; }
  }
  .tbl tbody tr.row-click:hover { background: var(--accent-soft); }
  .rf-compact table.tbl { font-size: 11px; }
  .rf-compact table.tbl th { padding: 6px 7px; font-size: 9px; letter-spacing: .02em; }
  .rf-compact table.tbl td { padding: 5px 7px; }
  .rf-compact table.tbl td.num, .rf-compact table.tbl th.num { font-size: 10.5px; }

  /* === extra: finanze personali === */
  .filters { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:18px; align-items:center; }
  .filters select, .filters input[type=text] {
    padding:7px 10px; border:1px solid var(--rule-2); border-radius:6px; background:var(--panel);
    color:var(--ink); font-size:13px;
  }
  .filters input[type=text] { min-width:160px; }
  .chip { display:inline-flex; align-items:center; gap:6px; padding:4px 10px; border-radius:999px;
    font-size:11.5px; border:1px solid var(--rule-2); background:var(--panel-2); color:var(--ink-2); }
  .bar-track { height:8px; background:var(--rule); border-radius:999px; overflow:hidden; }
  .bar-fill { height:100%; border-radius:999px; transition:width .3s; }
  .bar-fill.ok { background:var(--accent); }
  .bar-fill.warn { background:var(--warn); }
  .bar-fill.over { background:var(--danger); }
  .twocol { display:grid; grid-template-columns:1fr 1fr; gap:18px; }
  .form-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:14px; }
  .form-grid .field-full { grid-column:1 / -1; }
  .field-lbl { display:block; font-size:11px; text-transform:uppercase; letter-spacing:.06em;
    color:var(--ink-3); font-weight:600; margin-bottom:5px; }
  .seg { display:inline-flex; border:1px solid var(--rule-2); border-radius:7px; overflow:hidden; }
  .seg button { background:var(--panel); border:none; padding:8px 16px; font-size:13px; color:var(--ink-2); }
  .seg button.on.entrata { background:var(--accent); color:#fff; }
  .seg button.on.uscita { background:var(--danger); color:#fff; }
  .chart-wrap { position:relative; height:280px; }
  .chart-wrap.sm { height:230px; }
  @media (max-width:768px){ .twocol{grid-template-columns:1fr;} .form-grid{grid-template-columns:1fr;} }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="env,react">
const { useState, useEffect, useMemo, useRef, useCallback } = React;

// ============================================================
// CONFIG
// ============================================================
const APP_VERSION = "1.0.0";
// Login gestito da Firebase Authentication (email + password). Nessuna password nel file.
const ANNO_DEFAULT = "2026";

// ⚠ Incolla qui la config del TUO progetto Firebase personale
// (un progetto SEPARATO da quello del club).
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyDFao6wt7W_NlLdryjer5OEmZJBaOZO7jQ",
  authDomain: "contpersonal-af58c.firebaseapp.com",
  databaseURL: "https://contpersonal-af58c-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "contpersonal-af58c",
  storageBucket: "contpersonal-af58c.firebasestorage.app",
  messagingSenderId: "799768688190",
  appId: "1:799768688190:web:1b549d4c034e04a460036f"
};

let db = null;
let auth = null;
let firebaseReady = false;
try {
  if (FIREBASE_CONFIG.apiKey !== "TODO") {
    firebase.initializeApp(FIREBASE_CONFIG);
    db = firebase.database();
    auth = firebase.auth();
    firebaseReady = true;
  }
} catch (e) { console.warn("Firebase non inizializzato:", e); }

// ============================================================
// COSTANTI DI DOMINIO
// ============================================================
const MESI = ["gennaio","febbraio","marzo","aprile","maggio","giugno",
              "luglio","agosto","settembre","ottobre","novembre","dicembre"];
const mIdx = (m) => MESI.indexOf(String(m || "").toLowerCase().trim());
const CONTI_DEFAULT = ["BPER C/C", "PREPAGATA", "CASSA"];

// ============================================================
// HELPERS
// ============================================================
const num = (n) => (isNaN(Number(n)) ? 0 : Number(n));
const eur = (n) => (n < 0 ? "−" : "") + "€ " + Math.abs(num(n))
  .toLocaleString("it-IT", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const cap = (s) => s ? s.charAt(0).toUpperCase() + s.slice(1) : s;
const keyOf = (s) => String(s || "").replace(/[.#$/\[\]]/g, "_").trim() || "_";
const distinct = (arr) => [...new Set(arr.filter(Boolean))];

const PALETTE = ["#2d5e3e","#b8954b","#b54343","#3c6e91","#7a5a1d","#6b8f71",
  "#a76b8f","#4a4a4a","#c08020","#5b8c5a","#8a6d3b","#a05050","#577590",
  "#9b7b4d","#6d6875","#43658b"];

// ============================================================
// LOGIN
// ============================================================
function Login() {
  const [email, setEmail] = useState("");
  const [pw, setPw] = useState("");
  const [err, setErr] = useState("");
  const [busy, setBusy] = useState(false);
  const submit = async (e) => {
    e.preventDefault();
    setErr(""); setBusy(true);
    try {
      await auth.signInWithEmailAndPassword(email.trim(), pw);
      // l'app passa allo stato loggato tramite onAuthStateChanged
    } catch (ex) {
      const map = {
        "auth/invalid-credential": "Email o password errate.",
        "auth/invalid-email": "Email non valida.",
        "auth/user-not-found": "Utente inesistente.",
        "auth/wrong-password": "Password errata.",
        "auth/too-many-requests": "Troppi tentativi, riprova tra poco."
      };
      setErr(map[ex.code] || ("Accesso non riuscito (" + (ex.code || ex.message) + ")."));
    }
    setBusy(false);
  };
  return (
    <div className="login-shell">
      <form className="login-card" onSubmit={submit}>
        <div className="logo">Finanze Personali</div>
        <div className="tag">Entrate · Uscite · Budget</div>
        {err && <div className="err">{err}</div>}
        <div className="field">
          <label>Email</label>
          <input type="email" autoFocus value={email} onChange={e => setEmail(e.target.value)} />
        </div>
        <div className="field">
          <label>Password</label>
          <input type="password" value={pw} onChange={e => setPw(e.target.value)} />
        </div>
        <button className="btn accent" type="submit" disabled={busy}>{busy ? "Accesso…" : "Entra"}</button>
      </form>
    </div>
  );
}

// ============================================================
// DATA HOOK
// ============================================================
function useData(anno, user) {
  const [movimenti, setMov] = useState([]);
  const [budget, setBudget] = useState([]);
  const [saldi, setSaldi] = useState([]);
  const [loading, setLoading] = useState(true);
  useEffect(() => {
    if (!db || !user) { setLoading(false); return; }
    setLoading(true);
    const base = `finanze/${anno}`;
    const rM = db.ref(`${base}/movimenti`), rB = db.ref(`${base}/budget`), rS = db.ref(`${base}/saldiIniziali`);
    const toArr = (snap) => { const o = snap.val() || {}; return Object.keys(o).map(k => ({ _id: k, ...o[k] })); };
    rM.on("value", s => { setMov(toArr(s)); setLoading(false); });
    rB.on("value", s => setBudget(toArr(s)));
    rS.on("value", s => setSaldi(toArr(s)));
    return () => { rM.off(); rB.off(); rS.off(); };
  }, [anno, user]);
  return { movimenti, budget, saldi, loading };
}

// ============================================================
// CHART
// ============================================================
function ChartBox({ type, data, options, className }) {
  const ref = useRef(null), inst = useRef(null);
  useEffect(() => {
    if (!ref.current) return;
    if (inst.current) inst.current.destroy();
    inst.current = new Chart(ref.current, { type, data, options });
    return () => { if (inst.current) inst.current.destroy(); };
  });
  return <div className={"chart-wrap " + (className || "")}><canvas ref={ref}></canvas></div>;
}

// ============================================================
// FORM MOVIMENTO (usato in Nuovo + Modifica)
// ============================================================
function MovForm({ init, conti, metodi, categorie, onSave, onCancel }) {
  const [tipo, setTipo] = useState(init?.tipo || "USCITA");
  const [mese, setMese] = useState(init?.mese || MESI[new Date().getMonth()]);
  const [conto, setConto] = useState(init?.conto || (conti[0] || ""));
  const [motivo, setMotivo] = useState(init?.motivo || "");
  const [metodo, setMetodo] = useState(init?.metodo || "");
  const [categoria, setCategoria] = useState(init?.categoria || "");
  const [importo, setImporto] = useState(init?.importo != null ? String(init.importo) : "");

  const save = () => {
    const imp = num(importo.replace(",", "."));
    if (!mese) return alert("Seleziona il mese");
    if (imp <= 0) return alert("Inserisci un importo valido");
    onSave({
      tipo, mese: mese.toLowerCase(), conto: conto.trim(),
      motivo: motivo.trim(), metodo: metodo.trim(),
      categoria: categoria.trim(), importo: imp
    });
  };

  return (
    <div className="card">
      <div className="form-grid">
        <div className="field-full">
          <span className="field-lbl">Tipo</span>
          <div className="seg">
            <button type="button" className={tipo==="ENTRATA"?"on entrata":""} onClick={()=>setTipo("ENTRATA")}>Entrata</button>
            <button type="button" className={tipo==="USCITA"?"on uscita":""} onClick={()=>setTipo("USCITA")}>Uscita</button>
          </div>
        </div>
        <div>
          <span className="field-lbl">Mese</span>
          <select value={mese} onChange={e=>setMese(e.target.value)} style={{width:"100%"}}>
            {MESI.map(m => <option key={m} value={m}>{cap(m)}</option>)}
          </select>
        </div>
        <div>
          <span className="field-lbl">Importo (€)</span>
          <input type="text" inputMode="decimal" value={importo} placeholder="0,00"
            onChange={e=>setImporto(e.target.value)} style={{width:"100%"}} />
        </div>
        <div>
          <span className="field-lbl">Conto</span>
          <input type="text" list="dl-conti" value={conto} onChange={e=>setConto(e.target.value)} style={{width:"100%"}} />
          <datalist id="dl-conti">{conti.map(c => <option key={c} value={c} />)}</datalist>
        </div>
        <div>
          <span className="field-lbl">Categoria</span>
          <input type="text" list="dl-cat" value={categoria} onChange={e=>setCategoria(e.target.value)} style={{width:"100%"}} />
          <datalist id="dl-cat">{categorie.map(c => <option key={c} value={c} />)}</datalist>
        </div>
        <div>
          <span className="field-lbl">Metodo</span>
          <input type="text" list="dl-met" value={metodo} onChange={e=>setMetodo(e.target.value)} style={{width:"100%"}} />
          <datalist id="dl-met">{metodi.map(c => <option key={c} value={c} />)}</datalist>
        </div>
        <div>
          <span className="field-lbl">Motivo / descrizione</span>
          <input type="text" value={motivo} onChange={e=>setMotivo(e.target.value)} style={{width:"100%"}} />
        </div>
      </div>
      <div style={{display:"flex", gap:10, marginTop:18}}>
        <button className="btn accent" onClick={save}>{init?._id ? "Salva modifiche" : "Aggiungi movimento"}</button>
        {onCancel && <button className="btn ghost" onClick={onCancel}>Annulla</button>}
      </div>
    </div>
  );
}

// ============================================================
// PAGINA: NUOVO
// ============================================================
function PageNuovo({ anno, conti, metodi, categorie, onDone }) {
  const save = async (dati) => {
    await db.ref(`finanze/${anno}/movimenti`).push({ ...dati, createdAt: new Date().toISOString() });
    onDone("Movimento aggiunto");
  };
  return (
    <>
      <div className="page-head"><h2 className="serif">Nuovo movimento</h2>
        <div className="sub">Aggiungi un'entrata o un'uscita</div></div>
      <MovForm conti={conti} metodi={metodi} categorie={categorie} onSave={save} />
    </>
  );
}

// ============================================================
// PAGINA: MOVIMENTI
// ============================================================
function PageMovimenti({ anno, movimenti, conti, metodi, categorie, onToast }) {
  const [fMese, setFMese] = useState("");
  const [fTipo, setFTipo] = useState("");
  const [fConto, setFConto] = useState("");
  const [fCat, setFCat] = useState("");
  const [q, setQ] = useState("");
  const [editing, setEditing] = useState(null);

  const filtered = useMemo(() => {
    return movimenti.filter(m =>
      (!fMese || m.mese === fMese) &&
      (!fTipo || m.tipo === fTipo) &&
      (!fConto || m.conto === fConto) &&
      (!fCat || m.categoria === fCat) &&
      (!q || (m.motivo || "").toLowerCase().includes(q.toLowerCase()))
    ).sort((a,b) => (mIdx(b.mese) - mIdx(a.mese)) || ((b.createdAt||"") < (a.createdAt||"") ? -1 : 1));
  }, [movimenti, fMese, fTipo, fConto, fCat, q]);

  const tot = useMemo(() => {
    let e=0, u=0;
    filtered.forEach(m => m.tipo === "ENTRATA" ? e += num(m.importo) : u += num(m.importo));
    return { e, u, saldo: e - u };
  }, [filtered]);

  const del = async (m) => {
    if (!window.confirm("Eliminare questo movimento?")) return;
    await db.ref(`finanze/${anno}/movimenti/${m._id}`).remove();
    onToast("Movimento eliminato");
  };
  const saveEdit = async (dati) => {
    await db.ref(`finanze/${anno}/movimenti/${editing._id}`).update(dati);
    setEditing(null); onToast("Movimento aggiornato");
  };

  return (
    <>
      <div className="page-head"><h2 className="serif">Movimenti</h2>
        <div className="sub">{filtered.length} movimenti · entrate {eur(tot.e)} · uscite {eur(tot.u)} · saldo {eur(tot.saldo)}</div></div>

      {editing && (
        <div style={{marginBottom:20}}>
          <div className="field-lbl" style={{marginBottom:8}}>Modifica movimento</div>
          <MovForm init={editing} conti={conti} metodi={metodi} categorie={categorie}
            onSave={saveEdit} onCancel={() => setEditing(null)} />
        </div>
      )}

      <div className="filters">
        <select value={fMese} onChange={e=>setFMese(e.target.value)}>
          <option value="">Tutti i mesi</option>
          {MESI.map(m => <option key={m} value={m}>{cap(m)}</option>)}
        </select>
        <select value={fTipo} onChange={e=>setFTipo(e.target.value)}>
          <option value="">Entrate + Uscite</option>
          <option value="ENTRATA">Solo entrate</option>
          <option value="USCITA">Solo uscite</option>
        </select>
        <select value={fConto} onChange={e=>setFConto(e.target.value)}>
          <option value="">Tutti i conti</option>
          {conti.map(c => <option key={c} value={c}>{c}</option>)}
        </select>
        <select value={fCat} onChange={e=>setFCat(e.target.value)}>
          <option value="">Tutte le categorie</option>
          {categorie.map(c => <option key={c} value={c}>{c}</option>)}
        </select>
        <input type="text" placeholder="Cerca nel motivo…" value={q} onChange={e=>setQ(e.target.value)} />
        {(fMese||fTipo||fConto||fCat||q) &&
          <button className="btn ghost sm" onClick={()=>{setFMese("");setFTipo("");setFConto("");setFCat("");setQ("");}}>Reset</button>}
      </div>

      <div className="card flat" style={{padding:0, overflowX:"auto"}}>
        <table className="tbl">
          <thead><tr>
            <th>Mese</th><th>Tipo</th><th>Conto</th><th>Motivo</th><th>Categoria</th><th>Metodo</th>
            <th className="num">Importo</th><th></th>
          </tr></thead>
          <tbody>
            {filtered.length === 0 && <tr><td colSpan="8" style={{textAlign:"center",color:"var(--ink-3)",padding:"28px"}}>Nessun movimento</td></tr>}
            {filtered.map(m => (
              <tr key={m._id}>
                <td>{cap(m.mese)}</td>
                <td><span className={"pill " + (m.tipo==="ENTRATA"?"entrata":"uscita")}>{m.tipo==="ENTRATA"?"Entrata":"Uscita"}</span></td>
                <td>{m.conto}</td>
                <td>{m.motivo}</td>
                <td>{m.categoria}</td>
                <td style={{color:"var(--ink-3)"}}>{m.metodo}</td>
                <td className={"num " + (m.tipo==="ENTRATA"?"pos":"neg")}>{m.tipo==="ENTRATA"?"+":"−"}{eur(m.importo).replace("−","")}</td>
                <td style={{whiteSpace:"nowrap"}}>
                  <button className="btn ghost sm" onClick={()=>{setEditing(m); window.scrollTo(0,0);}}>✎</button>{" "}
                  <button className="btn danger sm" onClick={()=>del(m)}>✕</button>
                </td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </>
  );
}

// ============================================================
// PAGINA: DASHBOARD
// ============================================================
function PageDashboard({ movimenti, saldi, conti, anno }) {
  const [fMese, setFMese] = useState("");

  const inScope = useMemo(() => fMese ? movimenti.filter(m => m.mese === fMese) : movimenti, [movimenti, fMese]);

  const k = useMemo(() => {
    let e=0,u=0; inScope.forEach(m => m.tipo==="ENTRATA"?e+=num(m.importo):u+=num(m.importo));
    return { e, u, saldo: e-u };
  }, [inScope]);

  // saldo liquidità per conto (sempre su tutto l'anno)
  const saldiConto = useMemo(() => {
    const sIni = {}; saldi.forEach(s => sIni[s.conto] = num(s.importo));
    const map = {}; conti.forEach(c => map[c] = sIni[c] || 0);
    movimenti.forEach(m => {
      if (map[m.conto] === undefined) map[m.conto] = sIni[m.conto] || 0;
      map[m.conto] += (m.tipo==="ENTRATA"?1:-1) * num(m.importo);
    });
    return map;
  }, [movimenti, saldi, conti]);
  const liquiditaTot = Object.values(saldiConto).reduce((a,b)=>a+b,0);

  // andamento mensile
  const perMese = useMemo(() => {
    const E = Array(12).fill(0), U = Array(12).fill(0);
    movimenti.forEach(m => { const i=mIdx(m.mese); if(i<0) return; m.tipo==="ENTRATA"?E[i]+=num(m.importo):U[i]+=num(m.importo); });
    const lastIdx = Math.max(0, ...movimenti.map(m=>mIdx(m.mese)).filter(i=>i>=0).concat([0]));
    const labels = MESI.slice(0, lastIdx+1).map(cap);
    return { labels, E: E.slice(0,lastIdx+1), U: U.slice(0,lastIdx+1) };
  }, [movimenti]);

  // spese per categoria
  const perCat = useMemo(() => {
    const map = {};
    inScope.filter(m=>m.tipo==="USCITA").forEach(m => map[m.categoria||"(senza)"] = (map[m.categoria||"(senza)"]||0)+num(m.importo));
    return Object.entries(map).sort((a,b)=>b[1]-a[1]);
  }, [inScope]);
  const topCat = perCat.slice(0, 12);

  return (
    <>
      <div className="page-head">
        <h2 className="serif">Dashboard</h2>
        <div className="sub">{fMese ? cap(fMese)+" "+anno : "Anno "+anno} · {inScope.length} movimenti</div>
      </div>

      <div className="filters">
        <select value={fMese} onChange={e=>setFMese(e.target.value)}>
          <option value="">Tutto l'anno</option>
          {MESI.map(m => <option key={m} value={m}>{cap(m)}</option>)}
        </select>
      </div>

      <div className="kpi-grid">
        <div className="kpi"><div className="label">Entrate</div><div className="value pos" style={{color:"var(--accent)"}}>{eur(k.e)}</div></div>
        <div className="kpi"><div className="label">Uscite</div><div className="value neg">{eur(k.u)}</div></div>
        <div className="kpi"><div className="label">Saldo del periodo</div><div className={"value " + (k.saldo<0?"neg":"")}>{eur(k.saldo)}</div></div>
        <div className="kpi accent"><div className="label">Liquidità totale</div><div className="value">{eur(liquiditaTot)}</div><div className="hint">su tutti i conti</div></div>
      </div>

      <div className="twocol" style={{marginTop:20}}>
        <div className="card">
          <div className="card-title">Andamento mensile</div>
          <ChartBox type="bar"
            data={{ labels: perMese.labels, datasets: [
              { label:"Entrate", data: perMese.E, backgroundColor:"#2d5e3e", borderRadius:4 },
              { label:"Uscite", data: perMese.U, backgroundColor:"#b54343", borderRadius:4 },
            ]}}
            options={{ responsive:true, maintainAspectRatio:false,
              plugins:{ legend:{ position:"bottom" } },
              scales:{ y:{ ticks:{ callback:v=>"€"+v } } } }} />
        </div>
        <div className="card">
          <div className="card-title">Spese per categoria{fMese?" · "+cap(fMese):""}</div>
          {topCat.length === 0
            ? <div className="empty-state" style={{padding:"40px 0"}}>Nessuna uscita</div>
            : <ChartBox type="doughnut" className="sm"
                data={{ labels: topCat.map(c=>c[0]), datasets:[{ data: topCat.map(c=>c[1]), backgroundColor: PALETTE, borderWidth:1, borderColor:"#fff" }] }}

// PAGINA: BUDGET
// ============================================================
function PageBudget({ anno, movimenti, budget, categorie, onToast }) {
  const [fMese, setFMese] = useState(MESI[new Date().getMonth()]);
  const [newCat, setNewCat] = useState("");
  const [newImp, setNewImp] = useState("");

  const speseMese = useMemo(() => {
    const map = {};
    movimenti.filter(m => m.tipo==="USCITA" && m.mese===fMese)
      .forEach(m => map[m.categoria] = (map[m.categoria]||0)+num(m.importo));
    return map;
  }, [movimenti, fMese]);

  const rows = useMemo(() => budget.map(b => {
    const spent = speseMese[b.categoria] || 0;
    const cap_ = num(b.importo);
    const pct = cap_>0 ? spent/cap_*100 : 0;
    return { ...b, spent, cap_, pct };
  }).sort((a,b)=>b.pct-a.pct), [budget, speseMese]);

  const totCap = rows.reduce((a,r)=>a+r.cap_,0);
  const totSpent = rows.reduce((a,r)=>a+r.spent,0);

  const addBudget = async () => {
    if (!newCat.trim()) return alert("Inserisci una categoria");
    const imp = num(newImp.replace(",","."));
    if (imp <= 0) return alert("Inserisci un tetto valido");
    await db.ref(`finanze/${anno}/budget/${keyOf(newCat)}`).set({ categoria: newCat.trim(), importo: imp });
    setNewCat(""); setNewImp(""); onToast("Budget salvato");
  };
  const delBudget = async (b) => {
    if (!window.confirm(`Rimuovere il budget per "${b.categoria}"?`)) return;
    await db.ref(`finanze/${anno}/budget/${b._id}`).remove(); onToast("Budget rimosso");
  };
  const editImp = async (b) => {
    const v = prompt(`Tetto mensile per "${b.categoria}" (€):`, b.importo);
    if (v == null) return;
    await db.ref(`finanze/${anno}/budget/${b._id}/importo`).set(num(String(v).replace(",","."))); onToast("Aggiornato");
  };

  const barClass = (p) => p > 100 ? "over" : p > 80 ? "warn" : "ok";

  return (
    <>
      <div className="page-head"><h2 className="serif">Budget mensile</h2>
        <div className="sub">Tetto di spesa per categoria · confronto col mese selezionato</div></div>

      <div className="filters">
        <select value={fMese} onChange={e=>setFMese(e.target.value)}>
          {MESI.map(m => <option key={m} value={m}>{cap(m)}</option>)}
        </select>
      </div>

      <div className="kpi-grid" style={{gridTemplateColumns:"repeat(3,1fr)"}}>
        <div className="kpi"><div className="label">Budget totale</div><div className="value">{eur(totCap)}</div></div>
        <div className="kpi"><div className="label">Speso ({cap(fMese)})</div><div className={"value " + (totSpent>totCap?"neg":"")}>{eur(totSpent)}</div></div>
        <div className="kpi"><div className="label">Residuo</div><div className={"value " + (totCap-totSpent<0?"neg":"")}>{eur(totCap-totSpent)}</div></div>
      </div>

      <div className="card" style={{marginTop:20}}>
        <div className="card-title">Aggiungi / aggiorna un tetto</div>
        <div className="filters" style={{marginBottom:0}}>
          <input type="text" list="dl-cat-b" placeholder="Categoria" value={newCat} onChange={e=>setNewCat(e.target.value)} />
          <datalist id="dl-cat-b">{categorie.map(c => <option key={c} value={c} />)}</datalist>
          <input type="text" inputMode="decimal" placeholder="Tetto € / mese" value={newImp} onChange={e=>setNewImp(e.target.value)} style={{maxWidth:140}} />
          <button className="btn accent sm" onClick={addBudget}>Salva</button>
        </div>
      </div>

      <div style={{marginTop:20, display:"flex", flexDirection:"column", gap:12}}>
        {rows.length === 0 && <div className="empty-state">Nessun budget impostato. Aggiungine uno qui sopra.</div>}
        {rows.map(r => (
          <div key={r._id} className="card flat">
            <div style={{display:"flex", justifyContent:"space-between", alignItems:"baseline", marginBottom:8, gap:10, flexWrap:"wrap"}}>
              <strong>{r.categoria}</strong>
              <span className="mono" style={{fontSize:12.5, color: r.pct>100?"var(--danger)":"var(--ink-2)"}}>
                {eur(r.spent)} / {eur(r.cap_)} · {Math.round(r.pct)}%
              </span>
            </div>
            <div className="bar-track"><div className={"bar-fill " + barClass(r.pct)} style={{width: Math.min(100, r.pct) + "%"}}></div></div>
            <div style={{display:"flex", justifyContent:"space-between", marginTop:8}}>
              <span style={{fontSize:12, color: r.cap_-r.spent<0?"var(--danger)":"var(--ink-3)"}}>
                {r.cap_-r.spent<0 ? "Sforato di "+eur(r.spent-r.cap_) : "Residuo "+eur(r.cap_-r.spent)}
              </span>
              <span style={{whiteSpace:"nowrap"}}>
                <button className="btn ghost sm" onClick={()=>editImp(r)}>✎</button>{" "}
                <button className="btn danger sm" onClick={()=>delBudget(r)}>✕</button>
              </span>
            </div>
          </div>
        ))}
      </div>
    </>
  );
}

function PageConti({ anno, movimenti, saldi, conti, onToast }) {
  const [nome, setNome] = useState("");
  const sIni = {}; saldi.forEach(s => sIni[s.conto] = num(s.importo));

  const movPerConto = {};
  movimenti.forEach(m => { movPerConto[m.conto] = (movPerConto[m.conto]||0) + (m.tipo==="ENTRATA"?1:-1)*num(m.importo); });

  const setSaldoIniziale = async (c) => {
    const v = prompt(`Saldo iniziale del conto "${c}" all'inizio dell'anno (€):`, sIni[c] || 0);
    if (v == null) return;
    await db.ref(`finanze/${anno}/saldiIniziali/${keyOf(c)}`).set({ conto: c, importo: num(String(v).replace(",",".")) });
    onToast("Saldo iniziale aggiornato");
  };
  const addConto = async () => {
    if (!nome.trim()) return;
    await db.ref(`finanze/${anno}/saldiIniziali/${keyOf(nome)}`).set({ conto: nome.trim(), importo: 0 });
    setNome(""); onToast("Conto aggiunto");
  };

  return (
    <>
      <div className="page-head"><h2 className="serif">Conti</h2>
        <div className="sub">Saldo iniziale + movimenti = saldo attuale</div></div>

      <div className="card" style={{marginBottom:20}}>
        <div className="filters" style={{marginBottom:0}}>
          <input type="text" placeholder="Nuovo conto (es. Revolut)" value={nome} onChange={e=>setNome(e.target.value)} />
          <button className="btn accent sm" onClick={addConto}>Aggiungi conto</button>
        </div>
      </div>

      <div className="card flat" style={{padding:0, overflowX:"auto"}}>
        <table className="tbl">
          <thead><tr><th>Conto</th><th className="num">Saldo iniziale</th><th className="num">Variazione</th><th className="num">Saldo attuale</th><th></th></tr></thead>
          <tbody>
            {conti.map(c => {
              const ini = sIni[c] || 0, varz = movPerConto[c] || 0;
              return (
                <tr key={c}>
                  <td><strong>{c}</strong></td>
                  <td className="num">{eur(ini)}</td>
                  <td className={"num " + (varz<0?"neg":"pos")}>{varz>=0?"+":"−"}{eur(varz).replace("−","")}</td>
                  <td className={"num " + (ini+varz<0?"neg":"")}><strong>{eur(ini+varz)}</strong></td>
                  <td><button className="btn ghost sm" onClick={()=>setSaldoIniziale(c)}>Saldo iniziale ✎</button></td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>
    </>
  );
}

// PAGINA: CATEGORIE
// ============================================================
function PageCategorie({ anno, movimenti, onToast }) {
  const stats = useMemo(() => {
    const map = {};
    movimenti.forEach(m => {
      const c = m.categoria || "(senza categoria)";
      if (!map[c]) map[c] = { categoria: c, n: 0, entrate: 0, uscite: 0 };
      map[c].n++;
      m.tipo==="ENTRATA" ? map[c].entrate += num(m.importo) : map[c].uscite += num(m.importo);
    });
    return Object.values(map).sort((a,b)=>(b.entrate+b.uscite)-(a.entrate+a.uscite));
  }, [movimenti]);

  const rename = async (cat) => {
    const nuovo = prompt(`Rinomina la categoria "${cat}" in:`, cat);
    if (!nuovo || nuovo === cat) return;
    const updates = {};
    movimenti.filter(m => (m.categoria||"") === cat).forEach(m => { updates[`${m._id}/categoria`] = nuovo.trim(); });
    await db.ref(`finanze/${anno}/movimenti`).update(updates);
    onToast(`Rinominata in "${nuovo.trim()}" (${Object.keys(updates).length} movimenti)`);
  };

  return (
    <>
      <div className="page-head"><h2 className="serif">Categorie</h2>
        <div className="sub">{stats.length} categorie · rinomina aggiorna tutti i movimenti collegati</div></div>
      <div className="card flat" style={{padding:0, overflowX:"auto"}}>
        <table className="tbl">
          <thead><tr><th>Categoria</th><th className="num">Movimenti</th><th className="num">Entrate</th><th className="num">Uscite</th><th></th></tr></thead>
          <tbody>
            {stats.map(s => (
              <tr key={s.categoria}>
                <td><strong>{s.categoria}</strong></td>
                <td className="num">{s.n}</td>
                <td className="num pos">{s.entrate>0?eur(s.entrate):"—"}</td>
                <td className="num neg">{s.uscite>0?eur(s.uscite):"—"}</td>
                <td><button className="btn ghost sm" onClick={()=>rename(s.categoria)}>Rinomina ✎</button></td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </>
  );
}

// PAGINA: IMPORT
// ============================================================
function PageImport({ anno, movimenti, onToast }) {
  const [preview, setPreview] = useState(null);
  const [busy, setBusy] = useState(false);
  const fileRef = useRef(null);

  const parse = (file) => {
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const wb = XLSX.read(new Uint8Array(ev.target.result), { type: "array" });
        const ws = wb.Sheets["DATI MOVIMENTI"] || wb.Sheets[wb.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: null });
        const parsed = [];
        for (let i = 1; i < rows.length; i++) {
          const r = rows[i]; if (!r) continue;
          const mese = r[0], tipo = r[1], conto = r[2], motivo = r[3], metodo = r[4], catg = r[5], imp = r[6];
          if (mese == null && tipo == null && imp == null) continue;
          const impN = num(imp);
          if (mIdx(mese) < 0 || impN <= 0) continue;
          parsed.push({
            mese: String(mese).toLowerCase().trim(),
            tipo: String(tipo || "USCITA").toUpperCase().trim() === "ENTRATA" ? "ENTRATA" : "USCITA",
            conto: String(conto || "").trim(),
            motivo: String(motivo || "").trim(),
            metodo: String(metodo || "").trim(),
            categoria: String(catg || "").trim(),
            importo: impN
          });
        }
        setPreview({ name: file.name, rows: parsed });
      } catch (e) { alert("Errore lettura file: " + e.message); }
    };
    reader.readAsArrayBuffer(file);
  };

  const doImport = async (clear) => {
    if (!preview) return;
    setBusy(true);
    try {
      if (clear && movimenti.length) {
        if (!window.confirm(`Cancellare i ${movimenti.length} movimenti esistenti del ${anno} prima di importare?`)) { setBusy(false); return; }
        await db.ref(`finanze/${anno}/movimenti`).remove();
      }
      const updates = {};
      preview.rows.forEach(r => {
        const key = db.ref(`finanze/${anno}/movimenti`).push().key;
        updates[key] = { ...r, createdAt: new Date().toISOString() };
      });
      await db.ref(`finanze/${anno}/movimenti`).update(updates);
      onToast(`Importati ${preview.rows.length} movimenti`);
      setPreview(null);
      if (fileRef.current) fileRef.current.value = "";
    } catch (e) { alert("Errore import: " + e.message); }
    setBusy(false);
  };

  const sums = preview ? preview.rows.reduce((a,r)=>{ r.tipo==="ENTRATA"?a.e+=r.importo:a.u+=r.importo; return a; }, {e:0,u:0}) : null;

  return (
    <>
      <div className="page-head"><h2 className="serif">Import da Excel</h2>
        <div className="sub">Legge il foglio <span className="mono">DATI MOVIMENTI</span> (colonne MESE · TIPO · CONTO · MOTIVO · METODO · CATEGORIA · IMPORTO)</div></div>

      <div className="card">
        <input ref={fileRef} type="file" accept=".xlsx,.xls" onChange={e => e.target.files[0] && parse(e.target.files[0])} />
      </div>

      {preview && (
        <div className="card" style={{marginTop:20}}>
          <div className="card-title">Anteprima · {preview.name}</div>
          <p style={{fontSize:13.5}}>Trovati <strong>{preview.rows.length}</strong> movimenti validi — entrate {eur(sums.e)}, uscite {eur(sums.u)}.</p>
          <div className="card flat" style={{padding:0, overflowX:"auto", maxHeight:300, overflowY:"auto"}}>
            <table className="tbl">
              <thead><tr><th>Mese</th><th>Tipo</th><th>Conto</th><th>Motivo</th><th>Categoria</th><th className="num">Importo</th></tr></thead>
              <tbody>
                {preview.rows.slice(0, 30).map((r,i) => (
                  <tr key={i}><td>{cap(r.mese)}</td>
                    <td><span className={"pill " + (r.tipo==="ENTRATA"?"entrata":"uscita")}>{r.tipo==="ENTRATA"?"Entrata":"Uscita"}</span></td>
                    <td>{r.conto}</td><td>{r.motivo}</td><td>{r.categoria}</td>
                    <td className={"num " + (r.tipo==="ENTRATA"?"pos":"neg")}>{eur(r.importo)}</td></tr>
                ))}
              </tbody>
            </table>
          </div>
          {preview.rows.length > 30 && <p style={{fontSize:12, color:"var(--ink-3)"}}>…e altri {preview.rows.length-30} movimenti.</p>}
          <div style={{display:"flex", gap:10, marginTop:16, flexWrap:"wrap"}}>
            <button className="btn accent" disabled={busy} onClick={()=>doImport(false)}>{busy?"Importo…":"Aggiungi ai movimenti esistenti"}</button>
            <button className="btn danger" disabled={busy} onClick={()=>doImport(true)}>Sostituisci tutto</button>
            <button className="btn ghost" disabled={busy} onClick={()=>{setPreview(null); if(fileRef.current) fileRef.current.value="";}}>Annulla</button>
          </div>
        </div>
      )}
    </>
  );
}

// ============================================================
// PAGINA: EXPORT
// ============================================================
function PageExport({ movimenti, anno }) {
  const exportExcel = () => {
    const wb = XLSX.utils.book_new();
    const movRows = [...movimenti].sort((a,b)=>mIdx(a.mese)-mIdx(b.mese)).map(m => ({
      MESE: cap(m.mese), TIPO: m.tipo, CONTO: m.conto, MOTIVO: m.motivo,
      METODO: m.metodo, CATEGORIA: m.categoria, IMPORTO: num(m.importo)
    }));
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(movRows), "MOVIMENTI");

    const catMap = {};
    movimenti.forEach(m => {
      const c = m.categoria || "(senza)";
      if (!catMap[c]) catMap[c] = { CATEGORIA: c, ENTRATE: 0, USCITE: 0 };
      m.tipo==="ENTRATA" ? catMap[c].ENTRATE += num(m.importo) : catMap[c].USCITE += num(m.importo);
    });
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(Object.values(catMap)), "PER CATEGORIA");
    XLSX.writeFile(wb, `finanze_${anno}.xlsx`);
  };

  const exportPDF = () => {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    doc.setFontSize(16); doc.text(`Finanze personali · ${anno}`, 14, 18);
    let e=0,u=0; movimenti.forEach(m => m.tipo==="ENTRATA"?e+=num(m.importo):u+=num(m.importo));
    doc.setFontSize(11);
    doc.text(`Entrate: ${eur(e)}   Uscite: ${eur(u)}   Saldo: ${eur(e-u)}`, 14, 27);
    const catMap = {};
    movimenti.filter(m=>m.tipo==="USCITA").forEach(m => catMap[m.categoria||"(senza)"] = (catMap[m.categoria||"(senza)"]||0)+num(m.importo));
    const body = Object.entries(catMap).sort((a,b)=>b[1]-a[1]).map(([c,v]) => [c, eur(v)]);
    doc.autoTable({ startY: 34, head: [["Categoria di spesa", "Totale"]], body,
      styles:{ fontSize:9 }, headStyles:{ fillColor:[45,94,62] } });
    doc.save(`finanze_${anno}.pdf`);
  };

  return (
    <>
      <div className="page-head"><h2 className="serif">Export</h2>
        <div className="sub">Scarica i dati del {anno}</div></div>
      <div className="card">
        <p style={{fontSize:14, marginTop:0}}>{movimenti.length} movimenti pronti all'esportazione.</p>
        <div style={{display:"flex", gap:10, flexWrap:"wrap"}}>
          <button className="btn accent" onClick={exportExcel}>↧ Esporta Excel</button>
          <button className="btn" onClick={exportPDF}>↧ Esporta PDF (riepilogo)</button>
        </div>
      </div>
    </>
  );
}

          <div className="section-label">Dati</div>
          <button className={"navlink "+(page==="import"?"active":"")} onClick={()=>setPage("import")}><span className="ico">↥</span> Import Excel</button>
          <button className={"navlink "+(page==="export"?"active":"")} onClick={()=>setPage("export")}><span className="ico">↧</span> Export</button>
        </nav>
        {sidebarOpen && <div className="sidebar-backdrop" onClick={()=>setSidebarOpen(false)}></div>}

        <main className="main">
          {loading ? <div className="empty-state">Caricamento dati…</div> : (
            <>
              {page==="dashboard" && <PageDashboard movimenti={movimenti} saldi={saldi} conti={conti} anno={anno} />}
              {page==="nuovo" && <PageNuovo anno={anno} conti={conti} metodi={metodi} categorie={categorie} onDone={(m)=>{showToast(m); setPage("movimenti");}} />}
              {page==="movimenti" && <PageMovimenti anno={anno} movimenti={movimenti} conti={conti} metodi={metodi} categorie={categorie} onToast={showToast} />}
              {page==="budget" && <PageBudget anno={anno} movimenti={movimenti} budget={budget} categorie={categorie} onToast={showToast} />}
              {page==="conti" && <PageConti anno={anno} movimenti={movimenti} saldi={saldi} conti={conti} onToast={showToast} />}
              {page==="categorie" && <PageCategorie anno={anno} movimenti={movimenti} onToast={showToast} />}
              {page==="import" && <PageImport anno={anno} movimenti={movimenti} onToast={showToast} />}
              {page==="export" && <PageExport movimenti={movimenti} anno={anno} />}
            </>
          )}
        </main>
      </div>

      {toast && <div className={"toast " + (toast.type||"")}>{toast.msg}</div>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
