<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Finanze Personali</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

<style>
  :root {
    --bg: #f7f6f2;
    --panel: #ffffff;
    --panel-2: #fbfaf6;
    --ink: #1a1a1a;
    --ink-2: #4a4a4a;
    --ink-3: #8a8a82;
    --rule: #e8e6df;
    --rule-2: #d8d5cc;
    --accent: #2d5e3e;       /* verde campo, sobrio */
    --accent-soft: #e8efe9;
    --accent-ink: #1a3d27;
    --gold: #b8954b;
    --danger: #b54343;
    --danger-soft: #fbecec;
    --success: #2d5e3e;
    --warn: #c08020;
    --shadow-sm: 0 1px 2px rgba(20,20,20,0.04), 0 0 0 1px rgba(20,20,20,0.04);
    --shadow-md: 0 4px 16px rgba(20,20,20,0.06), 0 0 0 1px rgba(20,20,20,0.04);
    --shadow-lg: 0 20px 50px rgba(20,20,20,0.12);
    --radius: 6px;
    --radius-lg: 10px;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--ink);
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }

  .serif { font-family: 'Fraunces', Georgia, serif; }
  .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }

  button { font-family: inherit; cursor: pointer; }
  input, select, textarea { font-family: inherit; font-size: inherit; }

  /* === LAYOUT === */
  .app { min-height: 100vh; display: flex; flex-direction: column; }

  .topbar {
    background: var(--ink);
    color: #f0eee7;
    padding: 14px 28px;
    display: flex;
    align-items: center;
    gap: 24px;
    border-bottom: 1px solid #000;
  }
  .topbar h1 {
    font-family: 'Fraunces', serif;
    font-size: 18px;
    font-weight: 500;
    margin: 0;
    letter-spacing: -0.01em;
    flex: 1;
  }
  .topbar h1 .sub {
    color: #a8a59a;
    margin-left: 12px;
    font-size: 13px;
    font-style: italic;
  }
  .topbar .badge {
    background: #2d2d2d;
    border: 1px solid #3a3a3a;
    padding: 4px 10px;
    border-radius: 4px;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: #c9c7be;
  }
  .topbar select {
    background: #2d2d2d;
    color: #f0eee7;
    border: 1px solid #3a3a3a;
    padding: 5px 10px;
    border-radius: 4px;
    font-size: 12px;
    cursor: pointer;
  }
  .topbar select:hover { border-color: #555; }
  .topbar button.icon-btn {
    background: transparent;
    color: #c9c7be;
    border: 1px solid #3a3a3a;
    padding: 5px 10px;
    border-radius: 4px;
    font-size: 12px;
  }
  .topbar button.icon-btn:hover { background: #2d2d2d; }

  .layout {
    display: flex;
    flex: 1;
    min-height: 0;
  }
  .sidebar {
    width: 220px;
    background: var(--panel);
    border-right: 1px solid var(--rule);
    padding: 24px 12px;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .sidebar .section-label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--ink-3);
    margin: 18px 14px 6px;
    font-weight: 600;
  }
  .sidebar .section-label:first-child { margin-top: 0; }
  .navlink {
    background: transparent;
    border: none;
    text-align: left;
    padding: 8px 14px;
    border-radius: 4px;
    color: var(--ink-2);
    font-size: 13.5px;
    font-weight: 500;
    display: flex;
    align-items: center;
    gap: 10px;
    transition: background 0.12s;
  }
  .navlink:hover { background: var(--bg); color: var(--ink); }
  .navlink.active {
    background: var(--ink);
    color: #f0eee7;
  }
  .navlink .ico {
    font-size: 14px;
    width: 16px;
    text-align: center;
    opacity: 0.7;
  }
  .navlink.active .ico { opacity: 1; }

  .main {
    flex: 1;
    min-width: 0;
    padding: 32px 36px;
    overflow-y: auto;
  }

  .page-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 24px;
    margin-bottom: 28px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--rule);
  }
  .page-head h2 {
    font-family: 'Fraunces', serif;
    font-size: 28px;
    font-weight: 500;
    margin: 0;
    letter-spacing: -0.02em;
  }
  .page-head .sub {
    color: var(--ink-3);
    font-size: 13px;
  }

  /* === BUTTONS === */
  .btn {
    background: var(--ink);
    color: #f0eee7;
    border: 1px solid var(--ink);
    padding: 8px 16px;
    border-radius: var(--radius);
    font-size: 13px;
    font-weight: 500;
    transition: all 0.12s;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .btn:hover { background: #000; }
  .btn.ghost {
    background: transparent;
    color: var(--ink);
    border: 1px solid var(--rule-2);
  }
  .btn.ghost:hover { background: var(--bg); border-color: var(--ink-3); }
  .btn.accent {
    background: var(--accent);
    border-color: var(--accent);
  }
  .btn.accent:hover { background: var(--accent-ink); }
  .btn.danger {
    background: transparent;
    color: var(--danger);
    border: 1px solid var(--rule-2);
  }
  .btn.danger:hover { background: var(--danger-soft); border-color: var(--danger); }
  .btn.sm { padding: 5px 10px; font-size: 12px; }

  /* === CARDS === */
  .card {
    background: var(--panel);
    border: 1px solid var(--rule);
    border-radius: var(--radius-lg);
    padding: 20px;
  }
  .card.flat { box-shadow: var(--shadow-sm); }
  .card .card-title {
    font-family: 'Fraunces', serif;
    font-size: 16px;
    font-weight: 500;
    margin: 0 0 14px;
  }

  /* === KPI === */
  .kpi-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
    gap: 14px;
    margin-bottom: 24px;
  }
  .kpi {
    background: var(--panel);
    border: 1px solid var(--rule);
    border-radius: var(--radius-lg);
    padding: 18px 20px;
    position: relative;
    overflow: hidden;
  }
  .kpi.accent { background: var(--ink); color: #f0eee7; border-color: var(--ink); }
  .kpi .label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--ink-3);
    margin-bottom: 8px;
    font-weight: 600;
  }
  .kpi.accent .label { color: #a8a59a; }
  .kpi .value {
    font-family: 'Fraunces', serif;
    font-size: 28px;
    font-weight: 500;
    letter-spacing: -0.02em;
    line-height: 1.1;
  }
  .kpi .value.neg { color: var(--danger); }
  .kpi .hint {
    margin-top: 4px;
    font-size: 11.5px;
    color: var(--ink-3);
  }

  /* === TABLE === */
  .tbl-wrap {
    background: var(--panel);
    border: 1px solid var(--rule);
    border-radius: var(--radius-lg);
    overflow: hidden;
  }
  table.tbl {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  table.tbl th {
    text-align: left;
    padding: 11px 14px;
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--ink-3);
    font-weight: 600;
    background: var(--panel-2);
    border-bottom: 1px solid var(--rule);
    position: sticky;
    top: 0;
  }
  table.tbl td {
    padding: 10px 14px;
    border-bottom: 1px solid var(--rule);
    vertical-align: top;
  }
  table.tbl tr:last-child td { border-bottom: none; }
  table.tbl tr:hover td { background: var(--panel-2); }
  table.tbl td.num, table.tbl th.num { text-align: right; font-variant-numeric: tabular-nums; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12.5px; }
  table.tbl td.neg { color: var(--danger); }
  table.tbl td.pos { color: var(--success); }
  table.tbl .pill {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 99px;
    font-size: 11px;
    font-weight: 500;
    background: var(--bg);
    border: 1px solid var(--rule);
    color: var(--ink-2);
  }
  table.tbl .pill.entrata { background: var(--accent-soft); border-color: #c8d8ce; color: var(--accent-ink); }
  table.tbl .pill.uscita { background: var(--danger-soft); border-color: #f1d6d6; color: var(--danger); }
  table.tbl .pill.giroconto { background: #f4ebd7; border-color: #e6d5a8; color: #7a5a1d; }

  .empty-state {
    padding: 40px;
    text-align: center;
    color: var(--ink-3);
    font-style: italic;
  }

  /* === FORM === */
  .form-grid {
    display: grid;
    gap: 14px;
  }
  .form-row {
    display: grid;
    grid-template-columns: 180px 1fr;
    align-items: center;
    gap: 16px;
  }
  .form-row label {
    font-size: 12.5px;
    color: var(--ink-2);
    font-weight: 500;
  }
  .form-row .req { color: var(--danger); }
  input[type=text], input[type=number], input[type=date], input[type=password], select, textarea {
    width: 100%;
    padding: 8px 11px;
    border: 1px solid var(--rule-2);
    border-radius: var(--radius);
    background: var(--panel);
    color: var(--ink);
    transition: border 0.12s;
  }
  input:focus, select:focus, textarea:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }
  textarea { resize: vertical; min-height: 60px; }

  .tipo-switch {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 0;
    border: 1px solid var(--rule-2);
    border-radius: var(--radius);
    overflow: hidden;
  }
  .tipo-switch button {
    background: var(--panel);
    color: var(--ink-2);
    border: none;
    border-right: 1px solid var(--rule);
    padding: 10px 12px;
    font-size: 13px;
    font-weight: 500;
    transition: all 0.12s;
  }
  .tipo-switch button:last-child { border-right: none; }
  .tipo-switch button:hover { background: var(--bg); }
  .tipo-switch button.active.entrata { background: var(--accent); color: #fff; }
  .tipo-switch button.active.uscita { background: var(--danger); color: #fff; }
  .tipo-switch button.active.giroconto { background: var(--gold); color: #fff; }

  /* === FILTERS === */
  .filters {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 16px;
    align-items: center;
  }
  .filters input, .filters select {
    padding: 6px 10px;
    font-size: 12.5px;
    max-width: 200px;
  }
  .filters .label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--ink-3);
    font-weight: 600;
  }

  /* === LOGIN === */
  .login-shell {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background:
      radial-gradient(at 20% 30%, var(--accent-soft) 0px, transparent 50%),
      radial-gradient(at 80% 70%, #f4ebd7 0px, transparent 50%),
      var(--bg);
    padding: 24px;
  }
  .login-card {
    background: var(--panel);
    border: 1px solid var(--rule);
    border-radius: 14px;
    padding: 40px 44px;
    max-width: 420px;
    width: 100%;
    box-shadow: var(--shadow-lg);
  }
  .login-card .logo {
    font-family: 'Fraunces', serif;
    font-size: 22px;
    font-weight: 500;
    margin: 0 0 4px;
    letter-spacing: -0.01em;
  }
  .login-card .tag {
    color: var(--ink-3);
    font-size: 12.5px;
    margin-bottom: 28px;
    font-style: italic;
  }
  .login-card .field { margin-bottom: 14px; }
  .login-card .field label {
    display: block;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--ink-3);
    margin-bottom: 5px;
    font-weight: 600;
  }
  .login-card .err {
    color: var(--danger);
    background: var(--danger-soft);
    padding: 8px 12px;
    border-radius: var(--radius);
    font-size: 12.5px;
    margin-bottom: 12px;
  }
  .login-card .btn { width: 100%; justify-content: center; padding: 11px; }

  /* === MODAL === */
  .modal-bg {
    position: fixed;
    inset: 0;
    background: rgba(20,20,20,0.4);
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .modal {
    background: var(--panel);
    border-radius: var(--radius-lg);
    max-width: 640px;
    width: 100%;
    max-height: 90vh;
    overflow-y: auto;
    box-shadow: var(--shadow-lg);
  }
  .modal-head {
    padding: 18px 24px;
    border-bottom: 1px solid var(--rule);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .modal-head h3 {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    margin: 0;
    font-size: 18px;
  }
  .modal-body { padding: 22px 24px; }
  .modal-foot {
    padding: 14px 24px;
    border-top: 1px solid var(--rule);
    display: flex;
    justify-content: flex-end;
    gap: 8px;
  }

  /* === TOAST === */
  .toast {
    position: fixed;
    bottom: 24px;
    right: 24px;
    padding: 12px 18px;
    background: var(--ink);
    color: #f0eee7;
    border-radius: var(--radius);
    font-size: 13px;
    box-shadow: var(--shadow-lg);
    z-index: 200;
    animation: slideUp 0.2s ease-out;
  }
  .toast.success { background: var(--accent); }
  .toast.error { background: var(--danger); }
  @keyframes slideUp {
    from { transform: translateY(20px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }

  /* === LIQUIDITY BARS === */
  .liq-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 14px;
  }
  .liq-card {
    background: var(--panel);
    border: 1px solid var(--rule);
    border-radius: var(--radius-lg);
    padding: 18px 20px;
  }
  .liq-card .head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 10px;
  }
  .liq-card .name {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--ink-3);
    font-weight: 600;
  }
  .liq-card .saldo {
    font-family: 'Fraunces', serif;
    font-size: 24px;
    font-weight: 500;
    letter-spacing: -0.02em;
  }
  .liq-card .saldo.neg { color: var(--danger); }
  .liq-card .delta {
    font-size: 11px;
    color: var(--ink-3);
    margin-top: 4px;
    font-variant-numeric: tabular-nums;
  }
  .liq-card .delta .pos { color: var(--success); }
  .liq-card .delta .neg { color: var(--danger); }

  /* === SCROLLBARS === */
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--rule-2); border-radius: 5px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--ink-3); }

  /* === MOBILE: bottone menu hamburger === */
  .menu-btn {
    display: none;
    background: transparent;
    color: #f0eee7;
    border: 1px solid #3a3a3a;
    width: 36px;
    height: 36px;
    border-radius: 6px;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    padding: 0;
  }
  .menu-btn:hover { background: #2d2d2d; }
  .sidebar-backdrop {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(20,20,20,0.4);
    z-index: 90;
    animation: fadeIn 0.15s ease-out;
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  /* === RESPONSIVE: mobile === */
  @media (max-width: 768px) {
    body { font-size: 14px; }

    .topbar {
      padding: 10px 14px;
      gap: 10px;
      flex-wrap: nowrap;
    }
    .topbar h1 {
      font-size: 15px;
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .topbar h1 .sub { display: none; }
    .topbar .badge { display: none; }
    .topbar select {
      font-size: 13px;
      padding: 6px 8px;
      max-width: 110px;
    }
    .topbar button.icon-btn {
      font-size: 11px;
      padding: 5px 8px;
    }
    .topbar .desktop-only { display: none; }
    .menu-btn { display: inline-flex; }

    /* Sidebar diventa drawer */
    .layout { flex-direction: column; }
    .sidebar {
      position: fixed;
      top: 0; left: 0; bottom: 0;
      width: 75%;
      max-width: 280px;
      z-index: 100;
      flex-direction: column;
      flex-wrap: nowrap;
      padding: 20px 14px;
      overflow-y: auto;
      transform: translateX(-100%);
      transition: transform 0.22s ease-out;
      box-shadow: 0 0 30px rgba(0,0,0,0.15);
    }
    .sidebar.open { transform: translateX(0); }
    .sidebar.open ~ .sidebar-backdrop { display: block; }
    .sidebar .section-label { display: block; margin-top: 14px; }
    .sidebar .section-label:first-child { margin-top: 0; }
    .navlink {
      padding: 10px 14px;
      font-size: 14px;
    }

    /* Main */
    .main {
      padding: 14px;
      width: 100%;
    }

    /* Page head */
    .page-head {
      flex-direction: column;
      align-items: stretch;
      gap: 12px;
      margin-bottom: 18px;
    }
    .page-head h2 { font-size: 22px; }
    .page-head .sub { font-size: 12px; }

    /* KPI grid: 2 colonne su mobile */
    .kpi-grid {
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 16px;
    }
    .kpi {
      padding: 12px 14px;
    }
    .kpi .label { font-size: 9.5px; margin-bottom: 4px; }
    .kpi .value { font-size: 20px; }
    .kpi .hint { font-size: 10.5px; }

    /* Liquidità grid: 2 colonne */
    .liq-grid {
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }
    .liq-card { padding: 12px 14px; }
    .liq-card .saldo { font-size: 18px; }
    .liq-card .name { font-size: 10px; }
    .liq-card .delta { font-size: 10px; }

    /* Form: una colonna, label sopra */
    .form-row {
      grid-template-columns: 1fr;
      gap: 6px;
    }
    .form-row label { font-size: 12px; font-weight: 600; color: var(--ink); }
    input, select, textarea {
      font-size: 16px !important;  /* iOS no-zoom su focus */
      padding: 10px 12px;
    }

    /* Tipo switch */
    .tipo-switch button { font-size: 12px; padding: 9px 6px; }

    /* Filtri: full-width stack */
    .filters {
      gap: 8px;
    }
    .filters input, .filters select {
      max-width: none;
      width: 100%;
      font-size: 13.5px !important;
    }
    .filters .label { width: 100%; margin-bottom: -4px; }

    /* Tabelle: scroll fluido, font più compatto */
    .tbl-wrap {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      border-radius: 8px;
    }
    table.tbl { font-size: 12px; min-width: 600px; }
    table.tbl th { padding: 8px 10px; font-size: 9.5px; }
    table.tbl td { padding: 8px 10px; }
    table.tbl td.num, table.tbl th.num { font-size: 11.5px; }

    /* Modal: quasi fullscreen su mobile */

async function seedData(anno){
  if(!db) return false;
  const base=`finanze/${anno}`;
  try{
    const flag=await db.ref(`${base}/_seedVersion`).get();
    if(flag.exists() && flag.val()===SEED_VERSION) return false;
    await db.ref(`${base}/scritture`).remove();
    await db.ref(`${base}/movimenti`).remove();
    await db.ref(`${base}/pdc`).remove();
    await db.ref(`${base}/cespiti`).remove();
    const upd={};
    (SEED.pdc||[]).forEach(c=> upd[`pdc/${keyOf(c.codice)+"_"+keyOf(c.nome)}`]=c);
    (SEED.movimenti||[]).forEach(m=>{ const k=db.ref(`${base}/movimenti`).push().key; upd[`movimenti/${k}`]={...m}; });
    (SEED.scritture||[]).forEach(s=>{ const k=db.ref(`${base}/scritture`).push().key; upd[`scritture/${k}`]={...s}; });
    (SEED.cespiti||[]).forEach(c=>{ const k=db.ref(`${base}/cespiti`).push().key; upd[`cespiti/${k}`]={...c}; });
    upd['meta/dispTarget']=SEED.dispTarget||{};
    upd['_seedVersion']=SEED_VERSION;
    await db.ref(base).update(upd);
    return true;
  }catch(e){ console.warn("seed:",e); return false; }
}

const mIdxName = (m) => MESI.indexOf(String(m||"").toLowerCase().trim());
const num = (n) => {
  if (n==null||n==="") return 0;
  if (typeof n==="number") return isNaN(n)?0:n;
  let s = String(n).trim().replace(/[€\s]/g,"");
  if (s.indexOf(",")>-1 && s.indexOf(".")>-1) s = s.replace(/\./g,"").replace(",","."); // 1.300,50 -> 1300.50
  else if (s.indexOf(",")>-1) s = s.replace(",",".");                                    // 1300,50  -> 1300.50
  const v = Number(s);
  return isNaN(v)?0:v;
};
const eur = (n) => (n<0?"−":"") + "€ " + Math.abs(num(n)).toLocaleString("it-IT",{minimumFractionDigits:2,maximumFractionDigits:2});
const cap = (s) => s ? String(s).charAt(0).toUpperCase()+String(s).slice(1).toLowerCase() : s;
const keyOf = (s) => String(s||"").replace(/[.#$/\[\]]/g,"_").trim()||"_";
const distinct = (a) => [...new Set(a.filter(x=>x!=null && x!==""))];
const PALETTE = ["#2d5e3e","#b8954b","#b54343","#3c6e91","#7a5a1d","#6b8f71","#a76b8f","#4a4a4a","#c08020","#5b8c5a","#8a6d3b","#a05050","#577590","#9b7b4d","#6d6875","#43658b"];
const isLiquid = (cat) => /LIQUID/i.test(cat||"");

function toISO(v){
  if (v instanceof Date && !isNaN(v)) return v.toISOString().slice(0,10);
  if (typeof v === "number") { const d=new Date(Date.UTC(1899,11,30)+v*86400000); return d.toISOString().slice(0,10); }
  if (typeof v === "string"){
    const m = v.match(/(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/);
    if (m){ let y=+m[3]; if(y<100) y+=2000; return `${y}-${String(+m[2]).padStart(2,"0")}-${String(+m[1]).padStart(2,"0")}`; }
  }
  return null;
}
const meseOf = (iso) => iso ? (parseInt(iso.slice(5,7),10)-1) : null;
const fmtData = (iso) => { if(!iso) return ""; const [y,m,d]=iso.split("-"); return `${d}/${m}/${y.slice(2)}`; };

// ============================================================
// DATA HOOK — piano dei conti + scritture
// ============================================================
function useData(anno, user){
  const [pdc,setPdc]=useState([]);
  const [scritture,setScritture]=useState([]);
  const [movimenti,setMovimenti]=useState([]);
  const [cespiti,setCespiti]=useState([]);
  const [dispTarget,setDispTarget]=useState({});
  const [loading,setLoading]=useState(true);
  useEffect(()=>{
    if(!db||!user){ setLoading(false); return; }
    setLoading(true);
    const base=`finanze/${anno}`;
    const rP=db.ref(`${base}/pdc`), rS=db.ref(`${base}/scritture`), rM=db.ref(`${base}/movimenti`), rT=db.ref(`${base}/meta/dispTarget`), rC=db.ref(`${base}/cespiti`);
    const toArr=(snap)=>{ const o=snap.val()||{}; return Object.keys(o).map(k=>({_id:k,...o[k]})); };
    rP.on("value",s=>setPdc(toArr(s)));
    rS.on("value",s=>{ const arr=toArr(s).map(x=>({...x,righe:Array.isArray(x.righe)?x.righe:Object.values(x.righe||{})})); setScritture(arr); setLoading(false); });
    rM.on("value",s=>setMovimenti(toArr(s)));
    rT.on("value",s=>setDispTarget(s.val()||{}));
    rC.on("value",s=>setCespiti(toArr(s)));
    return ()=>{ rP.off(); rS.off(); rM.off(); rT.off(); rC.off(); };
  },[anno,user]);
  return { pdc, scritture, movimenti, cespiti, dispTarget, loading };
}

function ChartBox({ type, data, options, className }){
  const ref=useRef(null), inst=useRef(null);
  useEffect(()=>{ if(!ref.current) return;
    if(inst.current) inst.current.destroy();
    inst.current=new Chart(ref.current,{type,data,options});
    return ()=>{ if(inst.current) inst.current.destroy(); };
  });
  return <div className={"chart-wrap "+(className||"")}><canvas ref={ref}></canvas></div>;
}

// ============================================================
// MOTORE CONTABILE — derivazioni dalle scritture
// ============================================================
function useContabilita(scritture, pdc){
  return useMemo(()=>{
    // mappa piano dei conti per nome
    const meta = {};
    pdc.forEach(c=>{ meta[c.nome?.trim()] = c; });
    const metaOf = (conto)=> meta[String(conto||"").trim()] || {};
    const catLiquid = (conto)=> isLiquid((metaOf(conto).categoria)||"");

    // righe appiattite
    const righe = [];
    scritture.forEach(s=>{
      (s.righe||[]).forEach(r=>{
        righe.push({ ...r, dare:num(r.dare), avere:num(r.avere), data:s.data, mese:meseOf(s.data), descrizione:s.descrizione, scritturaId:s._id });
      });
    });

    // saldi per conto (DARE - AVERE)
    const perConto = {};
    righe.forEach(r=>{
      const k=r.conto; if(!perConto[k]) perConto[k]={conto:k, dare:0, avere:0, n:0, meta:metaOf(k)};
      perConto[k].dare+=r.dare; perConto[k].avere+=r.avere; perConto[k].n++;
    });
    Object.values(perConto).forEach(c=> c.saldo = c.dare - c.avere);

    // conti liquidi
    const contiLiquidi = Object.values(perConto).filter(c=> isLiquid(c.meta.categoria)).map(c=>c.conto);

    // quadratura globale
    let totDare=0, totAvere=0; righe.forEach(r=>{ totDare+=r.dare; totAvere+=r.avere; });

    return { meta, metaOf, catLiquid, righe, perConto, contiLiquidi, totDare, totAvere };
  },[scritture,pdc]);
}

// PAGINA: DASHBOARD / DISPONIBILITÀ REALI
// ============================================================
function PageDashboard({ scritture, pdc, movimenti, dispTarget, anno }){
  const C = useContabilita(scritture, pdc);

  // disponibilità per conto liquido: entrate=DARE, uscite=AVERE, delta=saldo
  const matchTarget = (conto)=>{
    const keys=Object.keys(dispTarget||{});
    const k=keys.find(t=> conto.toUpperCase().includes(t.toUpperCase()) || t.toUpperCase().includes(conto.toUpperCase()));
    return k!=null ? dispTarget[k] : null;
  };
  const disp = C.contiLiquidi.map(conto=>{
    const c=C.perConto[conto];
    const target=matchTarget(conto);
    const diff = target!=null ? c.saldo-target : null;
    return { conto, entrate:c.dare, uscite:c.avere, delta:c.saldo, target, diff, warn: diff!=null && Math.abs(diff)>0.01 };
  });
  const liquiditaTot = disp.reduce((a,d)=>a+d.delta,0);

  // CONTROLLI: cassa (movimenti) vs giornale (gambe liquide) per mese
  const controlliMese = useMemo(()=>{
    const cash={}, gj={};
    movimenti.forEach(m=>{ const i=mIdxName(m.mese); if(i<0) return; cash[i]=cash[i]||{e:0,u:0}; m.tipo==="ENTRATA"?cash[i].e+=num(m.importo):cash[i].u+=num(m.importo); });
    C.righe.forEach(r=>{ if(!C.catLiquid(r.conto)||r.mese==null) return; gj[r.mese]=gj[r.mese]||{e:0,u:0}; gj[r.mese].e+=r.dare; gj[r.mese].u+=r.avere; });
    const mesi=distinct([...Object.keys(cash),...Object.keys(gj)].map(Number)).sort((a,b)=>a-b);
    return mesi.map(i=>{ const c=cash[i]||{e:0,u:0}, g=gj[i]||{e:0,u:0};
      const de=c.e-g.e, du=c.u-g.u; return { i, cash:c, gj:g, de, du, warn:Math.abs(de)>0.01||Math.abs(du)>0.01 }; });
  },[movimenti,C]);
  const warnings = controlliMese.filter(x=>x.warn).length + disp.filter(d=>d.warn).length;

  // trend mensile dei flussi (conti liquidi): per mese entrate(DARE)/uscite(AVERE)/delta
  const trend = useMemo(()=>{
    const E=Array(12).fill(0), U=Array(12).fill(0);
    C.righe.forEach(r=>{ if(!C.catLiquid(r.conto)||r.mese==null) return; E[r.mese]+=r.dare; U[r.mese]+=r.avere; });
    const last = Math.max(0, ...C.righe.filter(r=>C.catLiquid(r.conto)&&r.mese!=null).map(r=>r.mese).concat([0]));
    return { labels:MESI.slice(0,last+1).map(cap), E:E.slice(0,last+1), U:U.slice(0,last+1), D:E.slice(0,last+1).map((e,i)=>e-U[i]) };
  },[C]);

  const totEntrate = disp.reduce((a,d)=>a+d.entrate,0);
  const totUscite = disp.reduce((a,d)=>a+d.uscite,0);

  if(!scritture.length) return <EmptyImport anno={anno} />;

  return (
    <>
      <div className="page-head"><h2 className="serif">Disponibilità reali</h2>
        <div className="sub">Saldo in tempo reale dei conti · anno {anno}{warnings?` · ⚠ ${warnings} discrepanze da verificare`:" · tutto quadrato ✓"}</div></div>

      <div className="kpi-grid">
        {disp.map((d,i)=>(
          <div key={d.conto} className={"kpi"+(i===0?" accent":"")}>
            <div className="label">{d.conto} {d.warn && <span title={"differenza vs foglio: "+eur(d.diff)} style={{color:"var(--danger)"}}>⚠</span>}</div>
            <div className={"value "+(d.delta<0?"neg":"")}>{eur(d.delta)}</div>
            <div className="hint">{d.target!=null ? (d.warn? `atteso ${eur(d.target)} · Δ ${eur(d.diff)}` : `coincide col foglio ✓`) : `entrate ${eur(d.entrate)} · uscite ${eur(d.uscite)}`}</div>
          </div>
        ))}
        <div className="kpi accent"><div className="label">Liquidità totale</div><div className={"value "+(liquiditaTot<0?"neg":"")}>{eur(liquiditaTot)}</div><div className="hint">somma conti liquidi</div></div>
      </div>

      {warnings>0 && (
        <div className="card" style={{marginTop:20, borderLeft:"3px solid var(--danger)"}}>
          <div className="card-title" style={{color:"var(--danger)"}}>⚠ Controlli e quadrature</div>
          {disp.filter(d=>d.warn).map(d=>(
            <p key={d.conto} style={{fontSize:13,margin:"4px 0"}}>Conto <strong>{d.conto}</strong>: saldo calcolato {eur(d.delta)} vs foglio {eur(d.target)} → differenza <strong style={{color:"var(--danger)"}}>{eur(d.diff)}</strong>.</p>
          ))}
          {controlliMese.filter(x=>x.warn).map(x=>(
            <p key={x.i} style={{fontSize:13,margin:"4px 0"}}><strong>{cap(MESI[x.i])}</strong>: cassa (entrate/uscite {eur(x.cash.e)}/{eur(x.cash.u)}) ≠ giornale ({eur(x.gj.e)}/{eur(x.gj.u)})
            {Math.abs(x.de)>0.01?` · Δ entrate ${eur(x.de)}`:""}{Math.abs(x.du)>0.01?` · Δ uscite ${eur(x.du)}`:""}.</p>
          ))}
        </div>
      )}

      <div className="twocol" style={{marginTop:20}}>
        <div className="card">
          <div className="card-title">Flussi di cassa mensili</div>
          <ChartBox type="bar"
            data={{ labels:trend.labels, datasets:[
              {label:"Entrate", data:trend.E, backgroundColor:"#2d5e3e", borderRadius:4},
              {label:"Uscite", data:trend.U, backgroundColor:"#b54343", borderRadius:4},
            ]}}
            options={{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:"bottom"}},scales:{y:{ticks:{callback:v=>"€"+v}}}}} />
        </div>
        <div className="card">
          <div className="card-title">Delta mensile (variazione liquidità)</div>
          <ChartBox type="line" className="sm"
            data={{ labels:trend.labels, datasets:[{label:"Delta", data:trend.D, borderColor:"#b8954b", backgroundColor:"rgba(184,149,75,.15)", fill:true, tension:.3}]}}
            options={{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{ticks:{callback:v=>"€"+v}}}}} />
        </div>
      </div>

      <div className="card" style={{marginTop:20}}>
        <div className="card-title">Trend mensile per conto</div>
        <div style={{overflowX:"auto"}}><table className="tbl">
          <thead><tr><th>Mese</th><th>Tipo</th>{C.contiLiquidi.map(c=><th key={c} className="num">{c}</th>)}<th className="num">Totale</th></tr></thead>
          <tbody>
            {trend.labels.map((lab,mi)=>{
              const row=(fn)=> C.contiLiquidi.map(c=>{ let v=0; C.righe.forEach(r=>{ if(r.conto===c&&r.mese===mi) v+=fn(r); }); return v; });
              const ent=row(r=>r.dare), usc=row(r=>r.avere);
              const del=ent.map((e,i)=>e-usc[i]);
              return (
                <React.Fragment key={mi}>
                  <tr style={{background:"var(--panel-2)"}}><td rowSpan="3"><strong>{lab}</strong></td><td>Entrate</td>{ent.map((v,i)=><td key={i} className="num pos">{v?eur(v):"—"}</td>)}<td className="num pos">{eur(ent.reduce((a,b)=>a+b,0))}</td></tr>
                  <tr><td>Uscite</td>{usc.map((v,i)=><td key={i} className="num neg">{v?eur(v):"—"}</td>)}<td className="num neg">{eur(usc.reduce((a,b)=>a+b,0))}</td></tr>
                  <tr style={{borderBottom:"2px solid var(--rule-2)"}}><td>Delta</td>{del.map((v,i)=><td key={i} className={"num "+(v<0?"neg":"")}>{eur(v)}</td>)}<td className={"num "+(del.reduce((a,b)=>a+b,0)<0?"neg":"")}><strong>{eur(del.reduce((a,b)=>a+b,0))}</strong></td></tr>
                </React.Fragment>
              );
            })}
          </tbody>
        </table></div>
      </div>
    </>
  );
}

            return (
              <div key={cat} style={{marginBottom:10}}>

                  <tbody>{list.map(c=>(
                    <tr key={c.conto}><td>{c.conto}</td><td className="num">{eur(c.dare)}</td><td className="num">{eur(c.avere)}</td>

    </>
  );
}

function PageBdV({ scritture, pdc }){
  const C = useContabilita(scritture, pdc);
  const [tab,setTab]=useState("bdv");
  const conti = Object.values(C.perConto).sort((a,b)=>a.conto.localeCompare(b.conto));
  const totD = conti.reduce((a,c)=>a+c.dare,0), totA = conti.reduce((a,c)=>a+c.avere,0);
  const quad = Math.abs(totD-totA)<0.01;

  // CE: conti prospetto CE. Ricavi (ecc. AVERE) = avere-dare; Costi (ecc. DARE) = dare-avere
  const ce = conti.filter(c=>/CE/i.test(c.meta.prospetto||""));
  const ricavi = ce.filter(c=>/AVERE/i.test(c.meta.eccedenza||"")||(c.avere-c.dare)>0).map(c=>({nome:c.conto,val:c.avere-c.dare})).filter(x=>Math.abs(x.val)>0.005).sort((a,b)=>b.val-a.val);
  const costi = ce.filter(c=>/DARE/i.test(c.meta.eccedenza||"")||(c.dare-c.avere)>0).map(c=>({nome:c.conto,val:c.dare-c.avere})).filter(x=>Math.abs(x.val)>0.005).sort((a,b)=>b.val-a.val);
  const totRic=ricavi.reduce((a,x)=>a+x.val,0), totCos=costi.reduce((a,x)=>a+x.val,0);
  const risultato=totRic-totCos;

  // SP: conti prospetto SP. Attivo (saldo>0), Passivo+PN (saldo<0 → avere-dare)
  const sp = conti.filter(c=>/SP/i.test(c.meta.prospetto||""));
  const attivo = sp.filter(c=>c.saldo>0.005).map(c=>({nome:c.conto,cat:c.meta.categoria,val:c.saldo})).sort((a,b)=>b.val-a.val);
  const passivo = sp.filter(c=>c.saldo<-0.005).map(c=>({nome:c.conto,cat:c.meta.categoria,val:-c.saldo})).sort((a,b)=>b.val-a.val);
  const totAtt=attivo.reduce((a,x)=>a+x.val,0), totPas=passivo.reduce((a,x)=>a+x.val,0);

  return (
    <>
      <div className="page-head"><h2 className="serif">Bilancio di verifica</h2>
        <div className="sub">{quad?"quadrato ✓":"NON quadra: Δ "+eur(totD-totA)} · con Conto Economico e Stato Patrimoniale</div></div>

      <div className="seg" style={{marginBottom:16}}>
        <button className={tab==="bdv"?"on entrata":""} onClick={()=>setTab("bdv")}>Verifica</button>
        <button className={tab==="ce"?"on entrata":""} onClick={()=>setTab("ce")}>Conto economico</button>
        <button className={tab==="sp"?"on entrata":""} onClick={()=>setTab("sp")}>Stato patrimoniale</button>
      </div>

      {tab==="bdv" && (
        <div className="card flat" style={{padding:0,overflowX:"auto"}}>
          <table className="tbl"><thead><tr><th>Conto</th><th>Prospetto</th><th>Categoria</th><th className="num">Somma di Dare</th><th className="num">Somma di Avere</th></tr></thead>
            <tbody>
              {conti.map(c=>(
                <tr key={c.conto}><td><strong>{c.conto}</strong></td><td><Pros p={c.meta.prospetto}/></td><td style={{color:"var(--ink-3)"}}>{c.meta.categoria||"—"}</td>
                  <td className="num">{c.dare?eur(c.dare):""}</td><td className="num">{c.avere?eur(c.avere):""}</td></tr>
              ))}
              <tr style={{fontWeight:700,background:"var(--panel-2)"}}><td colSpan="3">TOTALE</td><td className="num">{eur(totD)}</td><td className="num">{eur(totA)}</td></tr>
            </tbody></table>
        </div>
      )}

      {tab==="ce" && (
        <div className="card">
          <div className="card-title">Conto economico</div>
          <table className="tbl"><tbody>
            <tr><td colSpan="2" className="field-lbl">Ricavi</td></tr>
            {ricavi.map(x=><tr key={x.nome}><td style={{paddingLeft:16}}>{x.nome}</td><td className="num pos">{eur(x.val)}</td></tr>)}
            <tr style={{fontWeight:600}}><td>Totale ricavi</td><td className="num pos">{eur(totRic)}</td></tr>
            <tr><td colSpan="2" className="field-lbl" style={{paddingTop:10}}>Costi</td></tr>
            {costi.map(x=><tr key={x.nome}><td style={{paddingLeft:16}}>{x.nome}</td><td className="num neg">{eur(x.val)}</td></tr>)}
            <tr style={{fontWeight:600}}><td>Totale costi</td><td className="num neg">{eur(totCos)}</td></tr>
            <tr style={{fontWeight:700,borderTop:"2px solid var(--rule-2)",background:"var(--panel-2)"}}>
              <td>Risultato d'esercizio</td><td className={"num "+(risultato<0?"neg":"pos")}>{eur(risultato)} {risultato<0?"(perdita)":"(utile)"}</td></tr>
          </tbody></table>
        </div>
      )}

      {tab==="sp" && (
        <div className="twocol">
          <div className="card">
            <div className="card-title">Attivo</div>
            <table className="tbl"><tbody>
              {attivo.map(x=><tr key={x.nome}><td>{x.nome}<div style={{fontSize:10.5,color:"var(--ink-3)"}}>{x.cat}</div></td><td className="num">{eur(x.val)}</td></tr>)}
              <tr style={{fontWeight:700,background:"var(--panel-2)"}}><td>Totale attivo</td><td className="num">{eur(totAtt)}</td></tr>
            </tbody></table>
          </div>
          <div className="card">
            <div className="card-title">Passivo e Patrimonio netto</div>
            <table className="tbl"><tbody>
              {passivo.map(x=><tr key={x.nome}><td>{x.nome}<div style={{fontSize:10.5,color:"var(--ink-3)"}}>{x.cat}</div></td><td className="num">{eur(x.val)}</td></tr>)}
              <tr style={{fontWeight:700,background:"var(--panel-2)"}}><td>Totale passivo + PN</td><td className="num">{eur(totPas)}</td></tr>
              <tr><td style={{color:risultato>=0?"var(--accent)":"var(--danger)"}}>Risultato d'esercizio (da CE)</td><td className={"num "+(risultato<0?"neg":"pos")}>{eur(risultato)}</td></tr>
              <tr style={{fontWeight:700,borderTop:"2px solid var(--rule-2)"}}><td>Totale a pareggio</td><td className={"num "+(Math.abs(totAtt-(totPas+risultato))>0.01?"neg":"")}>{eur(totPas+risultato)}</td></tr>
            </tbody></table>
            {Math.abs(totAtt-(totPas+risultato))>0.01 && <p style={{fontSize:12,color:"var(--danger)",marginTop:8}}>⚠ Attivo {eur(totAtt)} ≠ Passivo+PN+risultato {eur(totPas+risultato)} (Δ {eur(totAtt-(totPas+risultato))}).</p>}
          </div>
        </div>
      )}
    </>
  );
}

    </>
  );
}

// ============================================================
// PAGINA: RENDICONTO FINANZIARIO
// ============================================================
function PageRF({ scritture, pdc }){
  const C = useContabilita(scritture, pdc);
  const [fMese,setFMese]=useState("");

  // mesi presenti
  const mesiPresenti = useMemo(()=> distinct(C.righe.map(r=>r.mese)).filter(m=>m!=null).sort((a,b)=>a-b), [C]);

  // per ogni scrittura individuo le gambe liquide e la contropartita
  // entrata su liquido = DARE>0 ; uscita = AVERE>0 ; classifico per categoria contropartita
  const flussi = useMemo(()=>{
    const out=[]; // {mese, conto, importo(+/-), fonte, tipoFlusso: OPER_E/OPER_U/INV}
    scritture.forEach(s=>{
      const righe=s.righe||[];
      const liquide=righe.filter(r=>C.catLiquid(r.conto));
      const contro=righe.filter(r=>!C.catLiquid(r.conto));
      if(!liquide.length) return; // non monetaria: esclusa dal RF
      liquide.forEach(r=>{
        const delta=num(r.dare)-num(r.avere); if(Math.abs(delta)<0.005) return;
        // fonte = contropartita prevalente
        let fonte="VARIE", catContro="";
        if(contro.length){
          // prendi la contropartita di importo maggiore
          const cp=[...contro].sort((a,b)=>(num(b.dare)+num(b.avere))-(num(a.dare)+num(a.avere)))[0];
          fonte=cp.conto; catContro=(C.metaOf(cp.conto).categoria)||cp.categoria||"";
        }
        let tipo;
        if(/IMM\.|FINANZIAR|INVESTIM/i.test(catContro)) tipo="INV";
        else tipo = delta>0 ? "OPER_E" : "OPER_U";
        out.push({ mese:meseOf(s.data), conto:r.conto, importo:delta, fonte, tipo });
      });
    });
    return out;
  },[C,scritture]);

  const conti = C.contiLiquidi;
  const mesiView = fMese!=="" ? [+fMese] : mesiPresenti;

  // saldo cumulato di un conto fino a (escluso) un mese
  const saldoInizialeMese = (conto, mese) => {
    let s=0; C.righe.forEach(r=>{ if(r.conto===conto && r.mese!=null && r.mese<mese) s+=num(r.dare)-num(r.avere); }); return s;
  };

  return (
    <>
      <div className="page-head"><h2 className="serif">Rendiconto finanziario</h2>
        <div className="sub">Flussi di cassa per conto e per mese</div></div>
      <div className="filters">
        <select value={fMese} onChange={e=>setFMese(e.target.value)}>
          <option value="">Tutti i mesi</option>
          {mesiPresenti.map(mi=><option key={mi} value={mi}>{cap(MESI[mi])}</option>)}
        </select>
      </div>

      {mesiView.map(mese=>{
        const fmese = flussi.filter(f=>f.mese===mese);
        // raggruppa entrate/uscite/investimenti per fonte
        const agg=(tipo)=>{ const m={}; fmese.filter(f=>f.tipo===tipo).forEach(f=>{ m[f.fonte]=(m[f.fonte]||0)+Math.abs(f.importo); }); return Object.entries(m).sort((a,b)=>b[1]-a[1]); };
        const entrate=agg("OPER_E"), uscite=agg("OPER_U"), inv=agg("INV");
        const totE=entrate.reduce((a,x)=>a+x[1],0), totU=uscite.reduce((a,x)=>a+x[1],0);
        const totInv=fmese.filter(f=>f.tipo==="INV").reduce((a,f)=>a+f.importo,0);
        const dispIni=conti.reduce((a,c)=>a+saldoInizialeMese(c,mese),0);
        const variazione=totE-totU+totInv;
        const dispFin=dispIni+variazione;
        return (
          <div key={mese} className="card" style={{marginBottom:18}}>
            <div className="card-title">{cap(MESI[mese])}</div>
            <table className="tbl"><tbody>
              <tr style={{background:"var(--panel-2)"}}><td><strong>Disponibilità iniziali</strong></td><td className="num"><strong>{eur(dispIni)}</strong></td></tr>
              <tr><td colSpan="2" className="field-lbl" style={{paddingTop:10}}>Entrate operative</td></tr>
              {entrate.map(([f,v])=><tr key={"e"+f}><td style={{paddingLeft:18}}>{f}</td><td className="num pos">{eur(v)}</td></tr>)}
              <tr style={{fontWeight:600}}><td>Totale entrate</td><td className="num pos">{eur(totE)}</td></tr>
              <tr><td colSpan="2" className="field-lbl" style={{paddingTop:10}}>Uscite operative</td></tr>
              {uscite.map(([f,v])=><tr key={"u"+f}><td style={{paddingLeft:18}}>{f}</td><td className="num neg">{eur(v)}</td></tr>)}
              <tr style={{fontWeight:600}}><td>Totale uscite</td><td className="num neg">{eur(totU)}</td></tr>
              {inv.length>0 && <><tr><td colSpan="2" className="field-lbl" style={{paddingTop:10}}>Investimenti / disinvestimenti</td></tr>
                {inv.map(([f,v])=>{ const signed=fmese.filter(x=>x.tipo==="INV"&&x.fonte===f).reduce((a,x)=>a+x.importo,0);
                  return <tr key={"i"+f}><td style={{paddingLeft:18}}>{f}</td><td className={"num "+(signed<0?"neg":"pos")}>{eur(signed)}</td></tr>; })}
                <tr style={{fontWeight:600}}><td>Totale investimenti</td><td className={"num "+(totInv<0?"neg":"pos")}>{eur(totInv)}</td></tr></>}
              <tr style={{fontWeight:700,borderTop:"2px solid var(--rule-2)"}}><td>Variazione del periodo</td><td className={"num "+(variazione<0?"neg":"")}>{eur(variazione)}</td></tr>
              <tr style={{fontWeight:700,background:"var(--panel-2)"}}><td>Disponibilità finali</td><td className="num">{eur(dispFin)}</td></tr>
            </tbody></table>
          </div>
        );
      })}
      {!mesiPresenti.length && <div className="empty-state">Nessun dato</div>}
    </>
  );
}

// PAGINA: IMPORT (LIBRO GIORNALE + PIANO DEI CONTI)

function EmptyImport({ anno }){
  return <div className="empty-state">Caricamento dei dati iniziali del {anno} in corso… se resta vuoto, ricarica la pagina.</div>;
}

function PageImport({ anno, scritture, onToast }){
  const [preview,setPreview]=useState(null);
  const [busy,setBusy]=useState(false);
  const fileRef=useRef(null);

  const parse=(file)=>{
    const reader=new FileReader();
    reader.onload=(ev)=>{
      try{
        const wb=XLSX.read(new Uint8Array(ev.target.result),{type:"array",cellDates:true});
        // --- PIANO DEI CONTI ---
        const wsP=wb.Sheets["PIANO DEI CONTI"];
        const pdc=[];
        if(wsP){
          const rows=XLSX.utils.sheet_to_json(wsP,{header:1,defval:null});
          let start=rows.findIndex(r=>r&&String(r[0]).toUpperCase()==="CODICE");
          start = start>=0 ? start+1 : 2;
          for(let i=start;i<rows.length;i++){ const r=rows[i]; if(!r) continue;
            const cod=r[0], nome=r[1]; if(cod==null||!nome) continue;
            pdc.push({ codice:String(cod).trim(), nome:String(nome).trim(), eccedenza:String(r[2]||"").trim(), prospetto:String(r[3]||"").trim(), categoria:String(r[4]||"").trim() });
          }
        }
        // --- LIBRO GIORNALE ---
        const wsG=wb.Sheets["LIBRO GIORNALE"]||wb.Sheets[wb.SheetNames[0]];
        const rows=XLSX.utils.sheet_to_json(wsG,{header:1,defval:null});
        let start=rows.findIndex(r=>r&&String(r[0]).toUpperCase()==="DATA");
        start = start>=0 ? start+1 : 0;
        const scr=[]; let cur=null;
        const flush=()=>{ if(cur&&cur.righe.length) scr.push(cur); cur=null; };
        for(let i=start;i<rows.length;i++){
          const r=rows[i]||[];
          const data=r[0], cod=r[1], conto=r[2], desc=r[3], cat=r[4], dare=r[5], avere=r[6];
          const blank=(conto==null||conto==="")&&(dare==null||dare==="")&&(avere==null||avere==="");
          const isMonthHdr = typeof data==="string" && mIdxName(data)>=0 && blank;
          const isAnno = typeof data==="string" && /ANNO/i.test(data);
          if(blank){ if(!isMonthHdr&&!isAnno) flush(); continue; }
          const iso=toISO(data);
          const hasDate = !!iso;
          if(cur==null){ cur={data:iso, descrizione:desc?String(desc).trim():"", righe:[]}; }
          else if(hasDate){ flush(); cur={data:iso, descrizione:desc?String(desc).trim():"", righe:[]}; }
          if(!cur.data && iso) cur.data=iso;
          if(!cur.descrizione && desc) cur.descrizione=String(desc).trim();
          if(conto){ cur.righe.push({ conto:String(conto).trim(), codice: cod!=null?String(cod).trim():"", categoria: cat?String(cat).trim():"", dare:num(dare), avere:num(avere) }); }
        }
        flush();
        // I blocchi "RIEPILOGO" sono riepiloghi mensili, non scritture in partita doppia → esclusi
        const escluse = scr.filter(s=>/riepilog/i.test(s.descrizione||"")).length;
        const scrClean = scr.filter(s=>!/riepilog/i.test(s.descrizione||""));
        // statistiche quadratura
        let td=0,ta=0; scrClean.forEach(s=>s.righe.forEach(r=>{td+=r.dare;ta+=r.avere;}));
        setPreview({ name:file.name, pdc, scritture:scrClean, escluse, totDare:td, totAvere:ta });
      }catch(e){ alert("Errore lettura file: "+e.message); }
    };
    reader.readAsArrayBuffer(file);
  };

  const doImport=async(clear)=>{
    if(!preview) return; setBusy(true);
    try{
      const base=`finanze/${anno}`;
      if(clear){
        if(!window.confirm(`Sostituire TUTTI i dati del ${anno} (scritture + piano dei conti)?`)){ setBusy(false); return; }
        await db.ref(`${base}/scritture`).remove();
        await db.ref(`${base}/pdc`).remove();
      }
      // piano dei conti
      if(preview.pdc.length){
        const upd={}; preview.pdc.forEach(c=>{ upd[keyOf(c.codice)+"_"+keyOf(c.nome)]=c; });
        await db.ref(`${base}/pdc`).update(upd);
      }
      // scritture
      const upd={};
      preview.scritture.forEach(s=>{ const key=db.ref(`${base}/scritture`).push().key; upd[key]={...s, createdAt:new Date().toISOString()}; });
      await db.ref(`${base}/scritture`).update(upd);
      onToast(`Importate ${preview.scritture.length} scritture e ${preview.pdc.length} conti`);
      setPreview(null); if(fileRef.current) fileRef.current.value="";
    }catch(e){ alert("Errore import: "+e.message); }
    setBusy(false);
  };

  return (
    <>
      <div className="page-head"><h2 className="serif">Import da Excel</h2>
        <div className="sub">Legge i fogli <span className="mono">LIBRO GIORNALE</span> e <span className="mono">PIANO DEI CONTI</span></div></div>
      <div className="card"><input ref={fileRef} type="file" accept=".xlsx,.xls" onChange={e=>e.target.files[0]&&parse(e.target.files[0])} /></div>

      {preview && (
        <div className="card" style={{marginTop:20}}>
          <div className="card-title">Anteprima · {preview.name}</div>
          <p style={{fontSize:13.5}}>Trovate <strong>{preview.scritture.length}</strong> scritture e <strong>{preview.pdc.length}</strong> conti{preview.escluse?` (esclusi ${preview.escluse} riepiloghi mensili)`:""}.
            Quadratura: DARE {eur(preview.totDare)} / AVERE {eur(preview.totAvere)} {Math.abs(preview.totDare-preview.totAvere)<0.01?"✓":"⚠ sbilancio "+eur(preview.totDare-preview.totAvere)}.</p>
          <div className="card flat" style={{padding:0,overflowX:"auto",maxHeight:300,overflowY:"auto"}}>
            <table className="tbl"><thead><tr><th>Data</th><th>Descrizione</th><th>Righe</th></tr></thead>
              <tbody>{preview.scritture.slice(0,25).map((s,i)=>(
                <tr key={i}><td>{fmtData(s.data)}</td><td>{s.descrizione}</td><td>{s.righe.map(r=>r.conto).join(" / ")}</td></tr>
              ))}</tbody></table>
          </div>
          {preview.scritture.length>25 && <p style={{fontSize:12,color:"var(--ink-3)"}}>…e altre {preview.scritture.length-25} scritture.</p>}
          <div style={{display:"flex",gap:10,marginTop:16,flexWrap:"wrap"}}>
            <button className="btn accent" disabled={busy} onClick={()=>doImport(true)}>{busy?"Importo…":"Sostituisci tutto e importa"}</button>
            <button className="btn ghost" disabled={busy} onClick={()=>doImport(false)}>Aggiungi senza cancellare</button>
            <button className="btn ghost" disabled={busy} onClick={()=>{setPreview(null); if(fileRef.current) fileRef.current.value="";}}>Annulla</button>
          </div>
        </div>
      )}
    </>
  );
}

function PageExport({ scritture, pdc, anno }){
  const C = useContabilita(scritture, pdc);
  const exportExcel=()=>{
    const wb=XLSX.utils.book_new();
    const gj=[]; [...scritture].sort((a,b)=>(a.data||"").localeCompare(b.data||"")).forEach(s=>{
      (s.righe||[]).forEach((r,i)=> gj.push({ DATA:i===0?fmtData(s.data):"", DESCRIZIONE:i===0?s.descrizione:"", CONTO:r.conto, CATEGORIA:r.categoria, DARE:num(r.dare)||"", AVERE:num(r.avere)||"" }));
    });
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(gj), "LIBRO GIORNALE");
    const bdv=Object.values(C.perConto).sort((a,b)=>a.conto.localeCompare(b.conto)).map(c=>({CONTO:c.conto,PROSPETTO:c.meta.prospetto||"",CATEGORIA:c.meta.categoria||"","SOMMA DARE":c.dare,"SOMMA AVERE":c.avere,SALDO:c.saldo}));
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(bdv), "BILANCIO DI VERIFICA");
    XLSX.writeFile(wb, `contabilita_${anno}.xlsx`);
  };
  return (
    <>
      <div className="page-head"><h2 className="serif">Export</h2><div className="sub">Scarica i dati del {anno}</div></div>
      <div className="card">
        <p style={{fontSize:14,marginTop:0}}>{scritture.length} scritture pronte.</p>
        <button className="btn accent" onClick={exportExcel}>↧ Esporta Excel (Giornale + BdV)</button>
      </div>
    </>
  );
}

// ============================================================
// PAGINA: NUOVA SCRITTURA (rapida + libera)
// ============================================================
function PageNuova({ anno, pdc, onToast }){
  const contiAll = useMemo(()=> distinct(pdc.map(c=>c.nome)).sort(), [pdc]);
  const liquidi = useMemo(()=> pdc.filter(c=>isLiquid(c.categoria)).map(c=>c.nome), [pdc]);
  const metaOf = (nome)=> pdc.find(c=>String(c.nome).trim()===String(nome||"").trim())||{};
  const [mode,setMode]=useState("rapido");
  const [data,setData]=useState(new Date().toISOString().slice(0,10));
  const [desc,setDesc]=useState("");
  const [tipo,setTipo]=useState("USCITA");
  const [contoLiq,setContoLiq]=useState("");
  const [contro,setContro]=useState("");
  const [imp,setImp]=useState("");
  const [righe,setRighe]=useState([{conto:"",dare:"",avere:""},{conto:"",dare:"",avere:""}]);
  const [busy,setBusy]=useState(false);

  useEffect(()=>{ if(!contoLiq && liquidi.length) setContoLiq(liquidi[0]); },[liquidi]);

  const push = async (righeS)=>{
    setBusy(true);
    try{ await db.ref(`finanze/${anno}/scritture`).push({ data, descrizione:desc.trim(), righe:righeS, createdAt:new Date().toISOString() });
      onToast("Scrittura registrata"); setImp(""); setDesc(""); setContro("");
      setRighe([{conto:"",dare:"",avere:""},{conto:"",dare:"",avere:""}]);
    }catch(e){ alert("Errore: "+e.message); }
    setBusy(false);
  };

  const salvaRapido=()=>{
    const a=num(imp);
    if(a<=0) return alert("Importo non valido");
    if(!contoLiq) return alert("Scegli il conto (liquido)");
    if(!contro) return alert("Scegli la contropartita");
    if(!contiAll.includes(contro)) return alert("La contropartita «"+contro+"» non è nel piano dei conti. Selezionala dall'elenco.");
    if(!desc.trim()) return alert("Aggiungi una descrizione");
    const lm=metaOf(contoLiq), cm=metaOf(contro);
    const liq=(d,av)=>({conto:contoLiq,codice:lm.codice||"",categoria:lm.categoria||"",dare:d,avere:av});
    const cp=(d,av)=>({conto:contro,codice:cm.codice||"",categoria:cm.categoria||"",dare:d,avere:av});
    push(tipo==="ENTRATA" ? [liq(a,0),cp(0,a)] : [cp(a,0),liq(0,a)]);
  };

  const totD=righe.reduce((s,r)=>s+num(r.dare),0), totA=righe.reduce((s,r)=>s+num(r.avere),0);
  const quad=Math.abs(totD-totA)<0.01 && totD>0;
  const setRiga=(i,f,v)=>{ const nr=righe.map((r,j)=> j===i?{...r,[f]:v}:r);
    if(f==="dare"&&v) nr[i].avere=""; if(f==="avere"&&v) nr[i].dare=""; setRighe(nr); };
  const salvaLibero=()=>{
    if(!desc.trim()) return alert("Aggiungi una descrizione");
    if(!quad) return alert(`La scrittura non quadra: DARE ${totD.toFixed(2)} ≠ AVERE ${totA.toFixed(2)}`);
    const valide=righe.filter(r=>r.conto&&(num(r.dare)||num(r.avere)));
    if(valide.length<2) return alert("Servono almeno 2 righe valide");
    const sconosciuti=distinct(valide.filter(r=>!contiAll.includes(r.conto)).map(r=>r.conto));
    if(sconosciuti.length) return alert("Conti non presenti nel piano dei conti: "+sconosciuti.join(", ")+".\nSelezionali dall'elenco.");
    push(valide.map(r=>{ const m=metaOf(r.conto); return {conto:r.conto,codice:m.codice||"",categoria:m.categoria||"",dare:num(r.dare),avere:num(r.avere)}; }));
  };

  return (
    <>
      <div className="page-head"><h2 className="serif">Nuova scrittura</h2>
        <div className="sub">Registra un movimento in partita doppia</div></div>
      {!pdc.length && <div className="empty-state" style={{marginBottom:16}}>Caricamento del piano dei conti in corso… attendi qualche secondo e ricarica se necessario.</div>}

      <div className="seg" style={{marginBottom:16}}>
        <button className={mode==="rapido"?"on entrata":""} onClick={()=>setMode("rapido")}>Rapida</button>
        <button className={mode==="libero"?"on entrata":""} onClick={()=>setMode("libero")}>Scrittura libera</button>
      </div>

      <div className="card">
        <div className="form-grid">
          <div><span className="field-lbl">Data</span><input type="date" value={data} onChange={e=>setData(e.target.value)} style={{width:"100%"}} /></div>
          <div><span className="field-lbl">Descrizione</span><input type="text" value={desc} onChange={e=>setDesc(e.target.value)} style={{width:"100%"}} /></div>
        </div>

        {mode==="rapido" ? (
          <div style={{marginTop:14}}>
            <div className="field-full" style={{marginBottom:12}}>
              <span className="field-lbl">Tipo</span>
              <div className="seg">
                <button type="button" className={tipo==="ENTRATA"?"on entrata":""} onClick={()=>setTipo("ENTRATA")}>Entrata</button>
                <button type="button" className={tipo==="USCITA"?"on uscita":""} onClick={()=>setTipo("USCITA")}>Uscita</button>
              </div>
            </div>
            <div className="form-grid">
              <div><span className="field-lbl">Conto (liquido)</span>
                <select value={contoLiq} onChange={e=>setContoLiq(e.target.value)} style={{width:"100%"}}>
                  {liquidi.map(c=><option key={c} value={c}>{c}</option>)}
                </select></div>
              <div><span className="field-lbl">Importo (€)</span><input type="text" inputMode="decimal" value={imp} placeholder="0,00" onChange={e=>setImp(e.target.value)} style={{width:"100%"}} /></div>
              <div className="field-full"><span className="field-lbl">Contropartita ({tipo==="ENTRATA"?"da dove arriva":"per cosa"})</span>
                <input type="text" list="dl-contro" value={contro} onChange={e=>setContro(e.target.value)} style={{width:"100%"}} placeholder="es. STIPENDI PWC / SPESE DIVERSE" />
                <datalist id="dl-contro">{contiAll.map(c=><option key={c} value={c} />)}</datalist></div>
            </div>
            <button className="btn accent" disabled={busy} style={{marginTop:16}} onClick={salvaRapido}>Registra scrittura</button>
          </div>
        ) : (
          <div style={{marginTop:14}}>
            <span className="field-lbl">Righe (almeno 2; per ogni riga importo in DARE oppure AVERE)</span>
            <table className="tbl"><thead><tr><th>Conto</th><th className="num">Dare</th><th className="num">Avere</th><th></th></tr></thead>
              <tbody>{righe.map((r,i)=>(
                <tr key={i}>
                  <td><input type="text" list="dl-conti-all" value={r.conto} onChange={e=>setRiga(i,"conto",e.target.value)} style={{width:"100%"}} /></td>
                  <td><input type="text" inputMode="decimal" value={r.dare} onChange={e=>setRiga(i,"dare",e.target.value)} style={{width:90,textAlign:"right"}} /></td>
                  <td><input type="text" inputMode="decimal" value={r.avere} onChange={e=>setRiga(i,"avere",e.target.value)} style={{width:90,textAlign:"right"}} /></td>
                  <td>{righe.length>2 && <button className="btn ghost sm" onClick={()=>setRighe(righe.filter((_,j)=>j!==i))}>✕</button>}</td>
                </tr>
              ))}</tbody></table>
            <datalist id="dl-conti-all">{contiAll.map(c=><option key={c} value={c} />)}</datalist>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginTop:10,flexWrap:"wrap",gap:10}}>
              <button className="btn ghost sm" onClick={()=>setRighe([...righe,{conto:"",dare:"",avere:""}])}>+ Aggiungi riga</button>
              <span className="mono" style={{fontSize:12.5,color:quad?"var(--accent)":"var(--danger)"}}>
                DARE {eur(totD)} · AVERE {eur(totA)} · {quad?"quadrata ✓":"Δ "+eur(totD-totA)}</span>
            </div>
            <button className="btn accent" disabled={busy} style={{marginTop:16}} onClick={salvaLibero}>Registra scrittura</button>
          </div>
        )}
      </div>
    </>
  );
}

// ============================================================
// PAGINA: RIEPILOGO MOVIMENTI
// ============================================================
function PageRiepilogo({ movimenti }){
  const [fMese,setFMese]=useState(""), [fConto,setFConto]=useState(""), [fCat,setFCat]=useState(""), [fTipo,setFTipo]=useState(""), [q,setQ]=useState("");
  const conti = distinct(movimenti.map(m=>m.conto)).sort();
  const categorie = distinct(movimenti.map(m=>m.categoria)).sort();

  const view = useMemo(()=> movimenti.filter(m=>
    (!fMese||m.mese===fMese) && (!fConto||m.conto===fConto) && (!fCat||m.categoria===fCat) &&
    (!fTipo||m.tipo===fTipo) && (!q||(m.motivo||"").toLowerCase().includes(q.toLowerCase()))
  ).sort((a,b)=> mIdxName(a.mese)-mIdxName(b.mese)), [movimenti,fMese,fConto,fCat,fTipo,q]);

  const e=view.filter(m=>m.tipo==="ENTRATA").reduce((a,m)=>a+num(m.importo),0);
  const u=view.filter(m=>m.tipo==="USCITA").reduce((a,m)=>a+num(m.importo),0);

  const mensile = useMemo(()=>{
    const mp={}; movimenti.forEach(m=>{ const i=mIdxName(m.mese); if(i<0) return;
      mp[i]=mp[i]||{e:0,u:0}; m.tipo==="ENTRATA"?mp[i].e+=num(m.importo):mp[i].u+=num(m.importo); });
    return Object.keys(mp).map(Number).sort((a,b)=>a-b).map(i=>({i,...mp[i],delta:mp[i].e-mp[i].u}));
  },[movimenti]);

  return (
    <>
      <div className="page-head"><h2 className="serif">Riepilogo movimenti</h2>
        <div className="sub">{movimenti.length} movimenti di cassa (entrate / uscite)</div></div>

      <div className="card" style={{marginBottom:18}}>
        <div className="card-title">Riepilogo mensile</div>
        <div style={{overflowX:"auto"}}><table className="tbl">
          <thead><tr><th>Mese</th><th className="num">Entrate</th><th className="num">Uscite</th><th className="num">Delta</th></tr></thead>
          <tbody>
            {mensile.map(m=>(
              <tr key={m.i}><td><strong>{cap(MESI[m.i])}</strong></td>
                <td className="num pos">{eur(m.e)}</td><td className="num neg">{eur(m.u)}</td>
                <td className={"num "+(m.delta<0?"neg":"")}>{eur(m.delta)}</td></tr>
            ))}
            <tr style={{fontWeight:700,background:"var(--panel-2)"}}><td>Totale</td>
              <td className="num pos">{eur(mensile.reduce((a,m)=>a+m.e,0))}</td>
              <td className="num neg">{eur(mensile.reduce((a,m)=>a+m.u,0))}</td>
              <td className="num">{eur(mensile.reduce((a,m)=>a+m.delta,0))}</td></tr>
          </tbody>
        </table></div>
      </div>

      <div className="filters">
        <select value={fMese} onChange={e=>setFMese(e.target.value)}>
          <option value="">Tutti i mesi</option>{MESI.map(m=><option key={m} value={m}>{cap(m)}</option>)}
        </select>
        <select value={fTipo} onChange={e=>setFTipo(e.target.value)}>
          <option value="">Entrate + Uscite</option><option value="ENTRATA">Solo entrate</option><option value="USCITA">Solo uscite</option>
        </select>
        <select value={fConto} onChange={e=>setFConto(e.target.value)}>
          <option value="">Tutti i conti</option>{conti.map(c=><option key={c} value={c}>{c}</option>)}
        </select>
        <select value={fCat} onChange={e=>setFCat(e.target.value)}>
          <option value="">Tutte le categorie</option>{categorie.map(c=><option key={c} value={c}>{c}</option>)}
        </select>
        <input type="text" placeholder="Cerca motivo…" value={q} onChange={e=>setQ(e.target.value)} />
        {(fMese||fConto||fCat||fTipo||q) && <button className="btn ghost sm" onClick={()=>{setFMese("");setFConto("");setFCat("");setFTipo("");setQ("");}}>Reset</button>}
      </div>

      <div className="card flat" style={{padding:0,overflowX:"auto"}}>
        <table className="tbl">
          <thead><tr><th>Mese</th><th>Tipo</th><th>Conto</th><th>Motivo</th><th>Categoria</th><th>Metodo</th><th className="num">Importo</th></tr></thead>
          <tbody>
            {view.map((m,i)=>(
              <tr key={i}><td>{cap(m.mese)}</td>
                <td><span className="chip" style={{color:m.tipo==="ENTRATA"?"var(--accent)":"var(--danger)"}}>{m.tipo==="ENTRATA"?"Entrata":"Uscita"}</span></td>
                <td>{m.conto}</td><td>{m.motivo}</td><td style={{color:"var(--ink-3)"}}>{m.categoria}</td>
                <td style={{color:"var(--ink-3)"}}>{m.metodo}</td>
                <td className={"num "+(m.tipo==="ENTRATA"?"pos":"neg")}>{m.tipo==="ENTRATA"?"+":"−"}{eur(m.importo).replace("−","")}</td></tr>
            ))}
            {!view.length && <tr><td colSpan="7" style={{textAlign:"center",color:"var(--ink-3)",padding:24}}>Nessun movimento</td></tr>}
            <tr style={{fontWeight:700,background:"var(--panel-2)"}}><td colSpan="6">Totale ({view.length}) · entrate {eur(e)} · uscite {eur(u)}</td><td className="num">{eur(e-u)}</td></tr>
          </tbody>
        </table>
      </div>
    </>
  );
}

// ============================================================
// ERROR BOUNDARY — evita lo schermo bianco se una pagina va in crash
// ============================================================
class PageBoundary extends React.Component{
  constructor(p){ super(p); this.state={err:null}; }
  static getDerivedStateFromError(err){ return {err}; }
  componentDidCatch(err){ console.error("Errore pagina:", err); }
  componentDidUpdate(prev){ if(prev.page!==this.props.page && this.state.err) this.setState({err:null}); }
  render(){
    if(this.state.err){
      const msg = this.state.err && this.state.err.message ? this.state.err.message : String(this.state.err);
      return (
        <div className="card" style={{borderColor:"var(--danger)"}}>
          <h3 className="serif" style={{marginTop:0,color:"var(--danger)"}}>Errore in questa pagina</h3>
          <p style={{fontSize:13.5,color:"var(--ink-2)"}}>La pagina non si è caricata per un errore imprevisto. Il resto dell'app continua a funzionare.</p>
          <pre className="mono" style={{fontSize:12,whiteSpace:"pre-wrap",background:"var(--danger-soft)",padding:12,borderRadius:8,overflow:"auto"}}>{msg}</pre>
          <p style={{fontSize:12.5,color:"var(--ink-3)",marginBottom:0}}>Cambia pagina e rientra, oppure ricarica. Se il problema resta, segnala il testo qui sopra.</p>
        </div>
      );
    }
    return this.props.children;
  }
}

// ============================================================
// APP
// ============================================================
function App(){
  const [user,setUser]=useState(undefined);
  const [anno,setAnno]=useState(ANNO_DEFAULT);
  const [page,setPage]=useState("dashboard");
  const [sidebarOpen,setSidebarOpen]=useState(false);
  const [toast,setToast]=useState(null);

  useEffect(()=>{ if(!auth){ setUser(null); return; } return auth.onAuthStateChanged(u=>setUser(u||null)); },[]);
  const { pdc, scritture, movimenti, cespiti, dispTarget, loading } = useData(anno, user);
  const showToast=(msg,type="success")=>{ setToast({msg,type}); setTimeout(()=>setToast(null),2600); };

  useEffect(()=>{ if(db&&user) seedData(anno).then(s=>{ if(s) showToast("Dati caricati dall'Excel nel database"); }); },[user,anno]);

  if(!firebaseReady) return <div className="login-shell"><div className="login-card"><div className="logo">Configurazione richiesta</div><div className="tag">Firebase non configurato.</div></div></div>;
  if(user===undefined) return <div className="login-shell"><div className="login-card"><div className="tag">Verifica accesso…</div></div></div>;
  if(!user) return <Login />;

  const anni = distinct([ANNO_DEFAULT,anno,"2025","2027"]).sort();
  const nav=[
    ["Operatività",[["dashboard","◆","Disponibilità reali"],["nuova","+","Nuova scrittura"],["riepilogo","≣","Riepilogo movimenti"],["giornale","≡","Libro giornale"]]],
    ["Prospetti",[["pivot","⊞","Pivot conti"],["rf","◷","Rendiconto finanziario"],["bdv","▦","Bilancio · CE · SP"],["cespiti","◳","Cespiti e ammortamenti"]]],
    ["Dati",[["export","↧","Export"]]],
  ];

  return (
    <div className="app">
      <div className="topbar">
        <button className="menu-btn" onClick={()=>setSidebarOpen(!sidebarOpen)} aria-label="Menu">☰</button>
        <h1>Contabilità Personale <span className="sub">— partita doppia</span></h1>
        <span className="badge desktop-only">Anno</span>
        <select value={anno} onChange={e=>setAnno(e.target.value)}>{anni.map(a=><option key={a} value={a}>{a}</option>)}</select>
        <button className="icon-btn" onClick={()=>auth.signOut()}>Esci</button>
      </div>
      <div className="layout">
        <nav className={"sidebar "+(sidebarOpen?"open":"")} onClick={(e)=>{ if(e.target.tagName==="BUTTON"&&e.target.classList.contains("navlink")) setSidebarOpen(false); }}>
          {nav.map(([sec,items])=>(
            <React.Fragment key={sec}>
              <div className="section-label">{sec}</div>
              {items.map(([id,ico,label])=>(
                <button key={id} className={"navlink "+(page===id?"active":"")} onClick={()=>{ setPage(id); setSidebarOpen(false); }}><span className="ico">{ico}</span> {label}</button>
              ))}
            </React.Fragment>
          ))}
        </nav>
        {sidebarOpen && <div className="sidebar-backdrop" onClick={()=>setSidebarOpen(false)}></div>}
        <main className="main">
          {loading ? <div className="empty-state">Caricamento…</div> : <PageBoundary page={page}>
            {page==="dashboard" && <PageDashboard scritture={scritture} pdc={pdc} movimenti={movimenti} dispTarget={dispTarget} anno={anno} />}
            {page==="nuova" && <PageNuova anno={anno} pdc={pdc} onToast={showToast} />}
            {page==="riepilogo" && <PageRiepilogo movimenti={movimenti} />}
            {page==="giornale" && <PageGiornale scritture={scritture} pdc={pdc} anno={anno} onToast={showToast} />}
            {page==="pivot" && <PagePivotConti scritture={scritture} pdc={pdc} />}
            {page==="rf" && <PageRF scritture={scritture} pdc={pdc} />}
            {page==="bdv" && <PageBdV scritture={scritture} pdc={pdc} />}
            {page==="cespiti" && <PageCespiti cespiti={cespiti} />}
            {page==="export" && <PageExport scritture={scritture} pdc={pdc} anno={anno} />}
          </PageBoundary>}
        </main>
      </div>
      {toast && <div className={"toast "+(toast.type||"")}>{toast.msg}</div>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);

</script>
</body>
